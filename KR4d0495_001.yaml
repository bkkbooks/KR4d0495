  text: 翰林楊仲弘詩卷之一
  hash: sha256:5319e4bee209f023b5f98ee5a708b3f3a8e3f5d1218449c9a505e55d81b73826
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0495_SBCK_001-1a}
body:
  text: 五言古詩雪軒北風海上來大雪何牡哉上下九萬里洗净無纎埃君家十二樓軒窗洞然開吹笙擊鳴鼓呼賔與㗸杯名言落四座大笑聲如雷舉頭望長空高興驚冥鴻仙人五六輩飛下白雲中粲粲明珠袍相從萬玉童問君何所事未就丹䁀功翩然却携手共入蓬萊宫次方韶父遊九鎖山韻平生一枝笻畏踏市朝路出門見青山如鶻追狡兔茲辰正炎暑赤日那肯暮振衣得冷風超若忘世故冥冥九鎖雲未睹心巳慕想當挾良朋盡取竒絶處曠哉天壤間寓物豈為痼歸來思舊丘我服寧改素無官正爾佳有子亦堪據誰歟事虛名白首不知誤桶底圖巨鰲奮其首戴山出海中神人擇所處共搆金銀宫憑高開户牗屈曲互相通女仙七十二顔色如花紅一一執樂器奏曲殊未終世傳桃源圖共徴彭澤翁此本出異士雕刻尤精工天地極廣大為地當不同我願學仙道積久乃有功錬形去滓穢五色浮虛空一朝乘風去浩然入無窮次韻景逺學士立春日大雪入歲暮其兆為有年漉漉始彌旬父老怨苦寒平旦上馬去重裘忽如單况彼牛衣子束緼噓微煙賴有固窮節猶念及古先古來有道士聲利不置懷顧于草木微而愛松若梅茲辰閲庭户適逢數花開芳意未渠央是足銜吾杯人事重名實趨向盡百端丈夫負雄氣動欲追古賢于意少不愜自放江海邊登高望八極雲氣生我前萬事何足問所須惟酒錢﨑嶇既山曲迢遞亦水濵既見蓬葦士輒復忘為勤得之眉睫間我遇固以神所善但樓護豈暇從若人送淳安徐教諭之任握手出南城眷眷從此辭蒼茫寒江色日莫浮雲滋大舟挾雙櫓輕若四馬馳淳安衆才彥並遲得師資擊鼓㑹高堂帷帳春風吹執經列座下質問無留疑平生五車書少出胸中竒歘然聽佳譽庶用懌我思贈季尊師季君神人也冥晦居山中還丹九轉成顔色如兒童致虛感元氣語默與天通頻歲傷水旱下民食不充曰雨須有雨曰風必有風上帝聞其賢行世多隂功策名紫虛府進位稱仙公騎龍上天去此樂無終窮太古雪為楊友宜賦往時天大風能吹華山裂墜此一卷石或云太古雪粵自開闢𥘉雲氣所凝結巳經六萬歲變化同􅏭嶫望之色正白表裏共澄徹塵土不能涴光采耀日月願君勿愛此持以獻金闕回中避暑時持用消毒熱胡氏刺虎圖涴有烈婦人胡姓嫁劉氏從夫棗陽戍車宿水之澨夜半猛虎至㗸夫入菑翳夫人自驚起不暇生為計直前執虎足盡力與牽制呼兒抽佩刀刃剚虎立斃天命復不救復讐古所貴嗚呼流俗弊人義日以廢婦不失其夫臣子竸為利患難圖苟免聞此得無愧吾故作此詩于以告萬世溪山積雪圖大雪歸溪山長林晝冥窅槎橋跨絶岸逺望行客少買魚酤新酒獨酌竟昏曉似此非他人髙士戴安道偕虞伯生魏雄卿魏池燕集分韻得閣字侯家有貴客置酒燕池閣溽暑方盛極風雨俄大作栘楊相簸蕩蒲荷紛偃薄亂呌失蛙黽回翔迷鸛鶴街流汙穢盡竇湧波濤惡喧聲劇降殺神氣欣洗濯趣歡爭酬酢獻笑雜歌咢益弛劒佩嚴未厭觥籌錯調燮維理得㵕漉宜施博和澤布原野濕烟散城郭嘉𬞞巳蒨蒨良苗常濯濯吾徒家食餘豫有豐稔樂題溫日觀墨葡萄日觀作蒲萄電掃無踪迹誰于故𥿄上點綴辨墨筆西天十萬里來往僅瞬息敗闕固不小遺下履一隻題金壇宋氏自怡軒白雲生何許萌芽自山石厥𥘉僅毫末須臾大充斥蔓延塞虛空日月為昏匿或時為霖雨庶類蒙潤澤或隨飄風散起滅竟無迹相緣千萬變發色黑青赤畸人飾棟宇逺俗喜幽閴開軒納高曠撫玩自怡懌人情慕富貴驅逐不暫息轉盼失故常在已何所得上下數千載往事猶歷歷於焉服聖訓無用苦沉溺昔年陶隱居常作帝王客挂冠神武門作詩寫胸臆超然處物外可謂貞且白何以企若人鞠躬修道德澗松為丁師善作澗松高百尺磊落多大節連根抱危石古色黑如鐡隆冬方沍寒山中積霜雪蘿蔦悉枯死蒼崕猶凍裂此時唯老幹峭直不摧折國匠求美材瞻望歎竒絶險阻不可致既作復中輟我顧驅六丁操斧墮嵑􅠣得此棟梁材持以獻天闕劉將軍詩交趾小蠻夷去國將萬里土産無異物其人狀如鬼濕熱生瘴氣疾者無不死天兵雖南征棄之良有以往年鄂州省綏靖失其理交馳赤白囊來告犯邊鄙遣人覘虛實在廷孰可使矯矯劉將軍一旦備行李有才兼文武不但善弧矢深入險惡地限敵才一水介者數百人視之若螻蟻移文至其國詰問事終始指摘中利害文辭更深美報書禮甚恭弊邑何敢爾疆吏爭怨隙搆煽乃為此賄賂却勿受足以振綱紀威聲聞逺方一邊禍為弭國家方全盛武備不可弛如此將帥才宜歌宿衛士古木詩大木生何許乃在泰山隈泰山崖石裂怒水響如雷浸潤長膏液根株日以培縱歷千百載霜雪不能摧長安天子詔欲築九層臺臺上搆宫殿青雲共徘徊匠氏走海內博求棟梁材萬夫治道路揮斧重林開大器當大用小器易剪裁有如豪侈士蹤跡困塵埃適可厚自養母為興歎哀東山詩為葉子實賦東山高幾許上有浮空雲葉君居其間好道夙所聞窮年絶人事矻坐考遺文松關晝常掩石田朝自藝葆真去汨昏養息襲氤氲軒冕有遺策髙舉謝世紛悠悠阻林莾長與麋鹿群繇來巢許臣不事堯舜君題恆齊精金有恆質入火愛百鍊君子有恆性寧逐外物變既不慕富貴又不厭貧賤素履往無咎夷險隨所踐張侯老世故此義頗深見勉之復勉之繼之在無倦次韻仲實見寄平居憶故舊懷抱輒不佳興來望浮雲悵恨獨舉杯竒文孰能賞高言孰能偕茲辰辱使至喜有意問來諷誦劇傾倒百過卷且開得知賢者心出處與化排山嶽縱可移厥高固崔嵬弊廬邇喧市卑濕苦病骸常念川路修杖屨安得陪撫事意踈散母論與俗乖猶恐戰不勝常處澗谷隈斯言弗果踐臨風重徘徊題文丞相書梅堂大厦就傾覆難以一木支惟公抱忠義挺然出天姿死既得所處自顧乃不疑惻愴大江南名與日月垂我行見遺墨再拜墮涕洟名堂有深意亦唯歲寒枝可知平昔心慷慨非一時峩峩著棟宇昭昭示民知勿使風雨敗永慰千古思塞上曲沙塞何窅窅樹短百草長大河屈曲流不復辨四方驅車日將夕黑雲隱長岡人馬俱飢疲解鞍飲寒塘張坐逐平地擊火燒烏羊桐酪過醇酎搖艷盈杯觴既醉歌鳴鳴頓踏如驚狂月從天外來耿耿流素光悲風動寥廓拂面吹胡霜白鴈中夜飛參差自成行一箭落霜羽挾弓負豪強中情無留滯千載能鷹揚邑中南峰陳翁義莊骨肉分枝葉由來同一身榮枯不相待此富或彼貧君子尚周急况復在親親昧茲損益理有􅌤獨何人南峰自善士義勇超常倫燋心視末俗變化何由淳孰利佳田園壑舟固有神割之惠宗族為世成吾仁仰止文正公遺法實所循垂名倘不朽當與斯人均偶題叢生園中草蔚蔚媚幽姿乘時各敷榮皓色𬒳緑枝似有微香發秋風輒吹之入人襟䄂中亦復可憐茲詰朝步荒畦莖葉稍離披飄零即巳矣霜露不爾私榮悴既有時小大何異而幸愛七尺軀天道不可誣夢讀退之詩頗竒詭巳覺記其大㫖作此篇自聞蓬萊山大林夾長巒上生癭藤蘿下生荆榛管仰不見天日藏蓄霧雨寒仙聖常所處沮洳亦少乾雖云誇鳯凰出入傷羽翰哀音起空洞令人鼻凖酸我欲訴上帝為施鐡鑿鑽琢落石側裂化為千丈磐瓊樓與玉殿玲瓏相通寬日月交户牖光射青琅玕而我從吾師來遊樂且般呼吸養元氣華腴生肺肝萬劫永不死如循環無端竊為仙聖慮炳然心若丹上帝如許我致此亦何難雪後次韻鄭集之雪後登高望江山信竒哉重岡起且伏相連白皚皚水官方謝事雲氣霅然開六龍翻滄海赤日從中來萬物將蠢動忽如登春臺木行味正酸含荾先屬梅天時亦相應𥘉昏占斗魁遨遊自兹始入林踐蒼苔西湖青濎濙西山高崔嵬長松更千載老枝多折摧名僧創精舍靜謐依巖隈伊豫實放士正可誅蒿萊情深惟痛飮母吝發新醅家人欲求我但見白雲堆機心無目作可使絶嫌猜君辭如泉酒我醉如山頽卜居同里巷時時得追陪為瓶或先罄此耻當及罍大雅歌治世其音不宜哀有倡必有和愧我非長才美哉春雪篇雲漢共昭回次韻劉師魯三年客塞上日夜懷舊丘飢來迫我去何暇為逺謀四顧無一親此身如羈囚悲風動沙漠回首令人愁道路巳漫漫歲月復悠悠丈夫四方志至此何所求買船發河上河水亦南流携鉏理荒圃吾疾日巳廖飛鴈至江滸北風天始凉是時禾黍登斯人亦少康皇天降厚德胡為私一方燕趙及齊魯人飢或相戕奈何有積廪如陵復如岡生非肉食者此憂心甚長亟謀樹皋壤剪茅覆小堂我志亦易豐歲祀有特羊夏夜偕田郎中宿張子元家田君有詩用韻長日氣甚昏欲睡不可忍薄暮更飲酒趣取太白引坐久輒醒然纍語加况矧高情逸世表遂使名迹泯彼人較是非逹者但微哂交遊半天下公輩獨英敏橘中篇並海無山林莾莾皆平疇君家擇地利即此營菟裘雜樹作藩屏青紅間綢繆其中植橘柚擁蔽枝葉稠盛夏開白華朱實懸高秋飛霜虐萬物寒風助颼飀凌晨察變候策杖巡維陬是何黃金多暴露宜藏收採摘資衆力轉輸及他州不長傳貸殖謂此同列侯上充國家賦下貽筐筥謀千縑可坐致何必龍陽洲次韻袁伯長盤盤海底石並樹青琅玕至陽生至隂龍宫常苦寒揚光炫朝彩吐氣蒸微瀾根株歷千載莫測勞悴端端如巢居子草木皮衣冠超然去人群取友蹄與翰日誦黃帝言浩歎淚闌干奈何天下治必以雲為官佩劒黃金環咀丹白玉盤自聞至人德積熱生肺肝黃塵日暮起對面不相看三山在何處使我師王韓聊歌紫芝曲倚君清夜彈題屏風畫商山四老人飛雪灑遙野衝波蕩無垠蟠蟠山谷間居此四老人下為民庶師上作王家賔清風眇何許馳想寂寞濵李御史之陜秦中古帝都遺俗五方并君為監御史出治周百城上當采民風下當宣德明赫赫英威振奸惡皆振驚弭節事觀覽慷慨有高情宅土稱上腴后稷此躬耕粳稌既充實蒸民日巳生岋然我行由天下留滯客燕京岐山嶺嘗致鳯凰鳴騑驂不可追矯首望去旌贈詩聊自寫寸心西向傾遣興偶作春𬞞茂前畦蒨蒨有顔色珍禽呌深樹過耳亦一適用是易吾慮母為自襞積放浪天地間無今亦無昔古人得意處相與元不隔如何故人心未照我胸臆徴言極纎芥實出左右力豈憚决係蹯人生且為客書懷寄杜原父吾生何為者稚年志頗高神仙與功名壯思躍秋濤中宵豈無寐悲甚幾欲號後來失所養百數患難逃竭力奉甘㫖出入身甚勞舊書益遺忘九牛存一毛稍後與人事忍情如忍刀旦夕自惟念未足非兒曹常欲力道德屢失迷所撡區區習蠧簡對案夜焚膏倘然有所得中心樂陶陶忽如從古人握手共逰遨携持亦何事庶用娛蓬蒿追思作詠歌示之必賢豪丈夫生世間母論賤與貧夙發多意氣往往惟任真松柏生高岡挺然固出群不為霜雪厄不為風雨春得時可行道節義亦足伸吾生托下土所識凡幾人窮交獨相慰笑語亦復親遙望山下雲旦起迷群岫老鶴巢其中縹眇摽未搆長鳴對秋月鳴罷復俯咮散入墟落間聞者莫能究顧惟雲外客娛心飲醇酎于此何如哉吾亦有所遘往來常泛舟泝流浙江上是時秋風高濤水日夕壯瞬息踰百里猛捷莫可狀倚船縱觀久力可騎􅚪况顧謂吾友言為樂頗豪放斟酌尊中酒懷抱益虛曠常從山中遊實愛巖谷幽長松䕃泉水四時清如秋佇立輒良久忽欲忘其儔吾聞古來人山居多名流此語或可信市朝安得留黃天祥衍三天數求詩嘗論術數書其變難盡紀為之非賢聖亦多有妙理造端無大異據六甲五子分門復析類包括備終始黃生衍三天有名聞逺邇蔓延善推測布算加積纍吾行遍天下所見亦多矣如生豈易得詣實不虛美往來江海上宿留隨所止省識凡幾人孰為豪傑士歲月瞥眼過春花既紛萎蕭條卧旅邸風雨響窗𥿄勸生遊京師北走五千里貴人多問命禍福常自擬兢兢恐跕墜有甚履淵水為言徴無咎抵掌必歡喜徴名何足取奮步從此起題史仲憲重修三皇廟史君宰宜黃政績頗殊異廉不至苟取明不可壅蔽有詔行括田使者自臨視限期巳促迫責在州縣吏乘時自掊剋上下受其弊君不憚勞苦日夜親算計頃畒無增損成書極根柢鄰壤大盜起相約不犯界三皇大聖人典祀承國制捐金修廟學首政繫瞻視事事有條理後來藐難繼集賢秉直筆稱述傳後世當令處風憲擇才頗詳諦一朝任擊搏風采必嚴厲英主方在上明見萬里外鄙詩或流聞亦可當獻替贈無極進上人進公宗門秀髙標如長松霜雪亦摧折夭矯化為龍燕坐大道場五戒為垣墉魔賊悉散走不復事戰攻禪居閟青峭窗户加雲封長日語聲絶風動櫩牙鐘贈執中允上人南山多白雲澶漫塞崖谷中有龎良叟寂寞卧林屋前門樹高松後户植幽竹孤風相纒繞波濤驚蕩沃梵文五千卷誦說盡精熟時時發清唱鏗鏘擊金玉伊余走海內一見輒嘆服願言從之遊淡泊心自足靈龜篇為陳渭叟作馬尊師所畫芝龜也蒼龜生中山深阻絶中道不飮亦不食靈和中自抱嫗休凝神液巖上産芝草支干集五采相射顔色好彼遊江海上作計苦不早一罹豫且罔性命莫能保歸遺宋元君天意資探討築宫修祠祭相承以為寶神者固如斯遺骨易枯槁古聞蒙莊氏苦語欲相曉持為衛生經千載長不老翰林楊仲弘詩卷之一
