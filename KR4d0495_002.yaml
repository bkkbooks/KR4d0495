front:
  text: 翰林楊仲弘詩集卷之二
  hash: sha256:f7ca1562b8783415c424cc0fcd69126c0c1230db66cca07d8950060581d07643
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0495_SBCK_002-1a}
body:
  text: 五言律詩送凌吉叟大江風雨暗此日送行舟會合能無間携離秪自愁棄繻才足恃題柱志𥘉酬請看秋鴻舉冥冥獨未休未俗唯無侶吾儒氣亦卑相從謀飮食那復敬師資衆巳欺王式吾猶信不疑可憐如鷃雀擾擾在藩籬𥘉陽臺望月彩雲相冪歷華露共嬋娟在水渾疑墮當空孰使懸潛虬精魄動宿鶴羽毛鮮寂寂丹臺夜相從訝得仙次韻韶卿壬寅元日又三日聞遊人頗盛之作堂堂宵雨過栗栗曉寒仍獻歲人同得東郊事復興杜門疑我拙有句愛君能且驗臨階草從今日漸增寄劉師魯好在劉公子遨遊興若何江湖勞悵望歲月劇奔波迹寄天涯逺詩傳海內多前賢題詠處一一為經過想君遊宦處正值洞庭湖落日波濤壯晴天島嶼孤舟航通漢沔風物覽衡巫天下文章弊非君孰起豫龍井元造生群物唯龍德最靈作霖蘇亢旱取水竭滄𬈑變化無留迹蜿蜒善養形壯哉吾羡汝一躍上青冥贈吾子行春雨連城闊春雲映户多長衢方淖濘小水亦風波慎獨能如此思君可若何便當乘興去著屣一相過東陽十題焦桐只作全生計唯存半死心芻茪猶不置斤斧重相尋遂使煁焦釡誰為愛古琴有材不足恃愁絶念知音蠧簡往古韋編在何年始汗青蠧蟲深卜宅科斗少成形泯滅阽秦火搜羅出漢廷斯文天未喪不敢望全經破硯彼美端溪石家藏歲月多廉隅皆破缺筋力盡妍磨玉亦堅而巳星如粲者何向來曽自詭持用掇高科殘畫斷裂無邊幅華堂棄置餘蒼松深踞地白鶴上凌虛風格猶森若丹青捴翳如苦心絶人事誰見用功初舊劒匣裏雌雄劒通神世所聞潛精依厚地吐氣切高雲亦有蛟龍害寧無星斗文不逢雷煥識埋沒復何云塵鏡收藏無寶匣歎息網絲懸孰使明為暗如觀醜勝妍玉臺終寂寂金鵲尚翩翩政訝開元日虛將盛事傳廢檠二尺書檠在如今久棄捐魚膏雖有熖蠧簡獨無緣墻下偕遺礫窗間帶舊煙却觀提挈處辛苦悔當年敗裘寂寞牛衣子能無敝緼𫀆塵埃須浣濯蟣蝨費爬搔意味存雞肋寒涼視馬毛千金既銷鑠猶聽朔風號斷碑摩娑不成讀上有蘚斑斑字畫鍾王輩文章漢魏間龜趺凋贔屭螭首落孱顔渤海神明逺今同磑石頑卧鐘漢殿經焚後呺然卧草中雕幾牙板廢鏽澀土花蒙追蠡難陳力華鯨不奏功待賢初設簴想見古人風送屠存博二首君往金陵郡于豫亦有聞海環平野盡山出大江分未召元司馬誰憐鄭廣文自今師道立章薦必紛紛江左知名士唯君德最淳明經𥘉試吏食祿可榮親矯矯能違世棲棲直為貧朝廷求俊乂未易捨斯人渡江寄俞仲連舟濟大江濆中流日欲曛鹵翻沙際雪潮落渡頭雲鯨躍常知候鴻飛不亂群頗思論勝槩把酒莫如君奉題伯父雙峰樵隱山出雙峰秀溪流一派清土風存禮讓人事省將迎路逐高低過田隨早晚耕家林有如此南望每關情童稚離桑梓猶能憶故山雲峰乘白腳蘚石露蒼顔插架詩書富應門禮義間緑林遺我恨回首淚瓓珊石樹盤根瘦沙溪激浪清竹間看犢卧木末見人行穡事常分力樵歌輒和聲從來携杖處不礙白雲生山曲兩三家相過路不賖對門開竹徑臨水種梅花酒熟留人醉詩成任客誇時時談舊事相看鬢垂華草滿三春緑山留萬古青呼兒欣解意應俗憚勞形採菌𫾣寒木收魚照夜汀秪應老崖谷束帶尚論經贈方韶父處士蜀郡蘇明允襄陽孟浩然成名兼二子得句詫群賢口絶人間事身如物外仙卓然能有此未信獨無傳古賢皆眇邈不意見斯人得趣時時好吟詩句句新拿舟來訪友覽勝輒經旬别業稠山下歸歟願北鄰和孟東野題崑山寺蘭若負崑岡鑿崖安佛牀梯雲石磴滑入厨泉水香旦寒鳥相聚月黑龍放光舟行苦局促幸憩殊勝場送方韶父先輩遊五湖蕭蕭垂素髮渺渺泛滄波過眼江山好離家日月多詩名終不朽世事復如何一往五湖上蒼茫問釣簑和張仲實之吳興舟行雜詠水程通百里雲樹隔千層鶴髮歡相見龍門羡獨登文辭無乃壯杯杓尚能勝仰止情何極吾為附驥蠅風流須我輩解后及斯時道術懷經濟文章出笑嘻由來天下士絶異里中兒它日金閨彥姢姢想翠眉翰林楊仲弘詩卷之二終
