front:
  text: 翰林楊仲弘詩集卷之三
  hash: sha256:ba3a542936d8127e62279533d0c1a5a3be19765ee788d477d156f26da080c2f7
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0495_SBCK_003-1a}
body:
  text: 五言律詩寄題羅氏别業溪行如百里為地巳幽深石轉黃金塢山抽碧玉簮杯觴酬日月弦誦起雲林樂事無終極誰能得此心門前臨白徑長日少人行野樹重重暗溪流脉脉清山形元不斷雲氣自相縈巳似龎公隱何時重入城次韻江行六首潮頭終歲白沙腹有時皤利涉他州柂終更古戌戈天依臨海樹風作滿江波亦有投竿意還聽孺子歌舊事如遺迹新愁轉泥人晴天宜縱步凍草各含春野鵲飛林杪沙鷗過水濵江山故如此晚望及斯辰藜羔真我食薜荔亦吾衣養性隨時足今生徇物非秋蓬猶未定風樹莫相違謾作烟霞想曽無羽翼飛春花聊共采若木有誰編浩蕩寧無取紛華幸見憐緒風吹四裔清露洗重玄萬物皆生意蹉跎畏此年路僻行來好天清望極遐白魚翻急浪黃犢卧晴沙桞吐千條葉梅殘幾樹花佳辰從此數歷歷看韶華子胥因諌戮茲事幾經秋顧爾忠難掩于今憤不休天風吹地轉海水入江流欲問鴟夷處茫然使我愁酬子行𥘉秋風颶之作暮夜風濤變崩騰怒不休魚龍皆失穴江海欲同流並岸漂千舍連檣覆萬艘隂陽知有沴惻愴動深憂送孫大方歸朝元宫高卧林泉表超然謝世紛空山鳴白雨古石繫蒼雲不作䕫龍伍甘從鹿豕群都門遊宦客回首總慙君飛搆上凌空依稀想故宫金盤凝曉露玉佩振秋風𬈑涬那違俗支離更養蒙大還何日就變化入無窮為樓因地勢四靣盡青山路落秋城外河流曉樹間鴈飛雲莫莫龍現雨珊珊建木光華盛何時共折攀饒國吳文康公挽詩二首厚德修天爵崇資拜地官粲然周典禮偉甚漢衣冠共喜懸金印俄聞蓋玉棺史臣書寵數光照碧㠝岏道學繇賢子推恩自聖皇白茅分壤土華衮賜衣裳漫注長生録虛傳却老方神遊終不返瀛海路茫茫題張氏順堂百順名為福紛然㑹此堂詩書成藴籍黍稷發馨香夜户鳴琴瑟春筵酌酒漿子孫宜孟晋相繼謁明光題信州先天觀圖回環因地勢制作本人謀蔽日來龍駕凌空結蜃樓秋琴翻浩蕩夜磬答深幽願受長生訣他年幸一遊高林褰翠氣虛谷散虹光道士多騎虎仙人自牧羊澗泉通地逺山嶺際天長戴子文為記流傳示不忘四圍山不斷狀若碧芙蓉谷逺含風細崖深下露濃茂林藏虎豹隂洞伏蛟龍恍惚神人降浮空羽蓋重鬼神相與處燒藥易成功雲霧生牀下雷霆起室中養身唯淡泊遊世等虛空高舉寧無日飄然獨馭風次韻引浚儀公題蘭竹卷子樹蕙連叢竹秖應族類同相依巖石畔併入畫圖中徑葉凝清露危梢倚碧空諒非高世士此意固難通贈程景純南遊觀楚越北度覽幽燕羇旅新愁換英豪往事傳塵沙迷逺驛風雨暗長川好醉新豐酒清朝正選賢論士無他術先觀氣盛衰澗松多徑節瓊樹有高枝圖籍曽無覽弓旌詎久遺似君宜努力慎莫負明時思菴閔氏青山下遺封見若堂蓼莪恩未泯拱木恨難忘德業銘金石詩書塞棟梁子孫修學術奕世有輝光赤壁圖寂寂長江夜同人共泛舟清尊方淡蕩孤棹且夷猶望逺幽禽度歌長獨繭抽千年遺跡在不逐水東流贈昌上人山中明月小壠上白雲多旦食餐松柏秋衣攬薜蘿俗人希見問禪老每相過異日高僧傳垂名定不磨未生天地始此理固存存直木何由曲清源不可渾養生母過厚守道在彌敦超出塵埃網蘄師共與論送葉彥中之官行臺范滂將攬轡周景巳題輿九扈名兼美三鱣兆豈虛都門愁撡𬒮江徼喜沿書重有斑衣奉南州總不如大府徴才士知君學業優兩京勞侍從十載困淹留白雪歌難和青雲志易酬鍾山多勝概有意與同游送胡秀才歸新安明詔方求士知君有俊才未聞遺𣏌梓何事返蒿萊似驥寧淹足為龍豈暴腮文章成錦繡他日必重來彼美逢衣子遨遊至上京雲霄方有志塵土巳知名塞鴈驚新恨溪鷗憶舊盟秋風吹易水惆悵復南征惠崇古木寒鴉江上秋雲薄寒鴉散亂飛未明常競噪向晚復爭歸似怯霜威重仍嫌樹影稀老僧修止觀寫物固精微留别陳益謙大帆仍馺娑雙棹復夷猶曉岸烟沙濶春江霧雨稠桃花隨漲水荇菜逐長流遲子來京國何時賦壯遊遊陳氏園偕李治中張提舉曉日從千騎郊原樂事多溪山春與麗烟靄晝相和宿蠧藏編冊鳴騶隔薜蘿使君辭滿引起舞亦傞傞挽艾處士才行能䨥美終身作布衣江湖名自逺塵土迹還稀野菊秋霜薄岩松夕照微沙鷗盟未改忽忽下漁磯撰文來相府書字出詞垣盛事傳千載幽光發九原父賢宜並著子孝復堪論多少衣冠族無聞愧後昆顧氏義孰居鄊為義孰茲事罕前聞外户來襟佩中堂蓄典墳儒宗先麗澤聖德尚彌文吳下多豪族能賢總羡君挽吳道士曽為方外士抗迹出塵氛既草歸田賦仍書誓墓文卧牛空有兆紀鶴竟無聞春草年年合誰憐道士墳送林季羽入京宿衛青雲自致身磊落見斯人卷衮辭蒼麓垂纓侍紫宸漏殘珠閣曉香暖玉爐春倘厭承明事歸來衣錦新終軍方近幸賈誼最能文獨用竒才進應將美譽聞金鞍光照地寶劒氣凌雲來往燕臺下同游必羡君衛郎皆世胄之子更才賢意氣雲霄上榮光日月邉都俞聞寶訓出入奉瓊筵立志當弘毅功名不偶然送徐義父入京舊富三冬學今為萬里遊風雲丹鳯闕雨雪黑貂裘南土名先著東堂選必優相逢多意氣談笑接名流幽燕向日邊裘馬去翩翩磧逈沙如雪河窮浪入天上書雙闕下待詔五門前壯節當竒遇無煩愧往賢贈曇上人多生為佛子慧逹自童蒙蟬蛻凡塵外龍騰覺海中一真元不染四大本來空異日叢林下知師繼杲公人世百年內都如過隙塵不開心上眼苦愛夢中身城市無間日江山又晚春相逢言道好獨覺意相親贈胡汲古先生唯逹道久矣樂山林致聘無雙璧為生過十金身間雲出岫髮短雪盈簮遁世猶吾志同盟欲自今野客何蕭散長年暫出遊風塵唯短褐江海自扁舟有迹能來往無心任去留才名今藉甚屈指到枚鄒送胡汲古之吳中有客佩蒼精居然得此生山開棲越跡水泝入吳程佚老悠悠計傷離戀戀情食菲方未巳應不為魚羮中秋攬雲憑結搆步月上林皋不記金尊竭頻瞻玉宇高神清存夜氣天闊數秋毫百尺樓如在何煩卧汝曹挽曹光益斯人吾所愛不見巳經年頗怪魚書絶俄聞鵬賦傳歸魂迷道路遺骨滯山川逺業凋零盡臨風為悵然好學無如子冥冥獨苦心未成梁棟用誰使雪霜侵宿草孤春意游雲泊太隂憶渠情不巳揮淚在衣襟贈劉時中騷雅誰能繼居然屬大才鋭思羅宇宙逸興走風雷處勝輕流俗名高震外臺東郊乘大路翼翼待龍媒吳越千餘里君來按轡遊群公虞罪戾多士想風流决事曽無壅觀民輒有憂若人何可得離别重添愁送王元禮歸平城燕趙多竒士遺風有固然射鵰猶絶藝屠狗亦名賢形勢威天下風流號北邊送君歸此地亦欲奮吾鞭牧羊憐馬援投筆困班生侯印終兼綰窮愁實飽更大才當用世小挫亦知名快飲桑乾酒䏻澆氣不平贈張之翰外臺收掾屬奮步集亨衢落落蟠英氣飄飄發壯圖威風聞郡邑行李涉江湖並轡逢佳友周游興不孤長才當用世進取或殊途剸劇曽揮刃銷奸若燎枯交游冠蓋盛出入禮義都有賴寬衰俗餘波及腐儒送陳君佐入京子欲遊京國程途萬里遙束裝辭邑社振斾躐風飈學問先餘子飛騰在一朝太平知有策必顯聖明朝董子知天道朱雲善易經由來登俊乂所以重朝廷彼有譏儒服吾無鼓說鈴君看鴻鵠舉忽忽至青冥宿延祥觀有感處世如庸俗胡為淹此留蹉跎悲往日磊落愧前修願棄人間事來為物外遊大還如可就猶足訪丹丘瓊館遊仙子超然逺世情言辭多近道豪翰久知名露下衣裳濕風來几案清似君居處勝亦足寄吾生題青田葉叔至野清堂為堂殊顯敞在野興尤濃曰水流千折青山繞百重樹麻行斾斾蒔木倚童童相對漁樵話終朝亦罕逢逺來山異甚龍虎互騫騰溪狹灘聲悍林繁雨氣增正須求靜坐何事角多能謁告還鄊里君堂或可升送張宣撫使嶺南奉使入蠻烟終軍始妙年抗旌辭朔野擊楫渡湘川翠竹侵巖際黃茆盡海邊狼荒非善地為戒莫留連此行行萬里渺渺極朱涯地勢雖懸隔天威可逺加引弓飛惡鳥拔劒斬妖蛇遲子歸來日燕南看雪花送李侍郎使安南九秋天色晚萬里送君行馬首塞雲起腰間寶劒橫奉揚天子命慰答逺人情直渡蠻江水炎氛一日清喜雪酬康子淵院使漠漠連天暗霏霏著地輕欲迷鳷鵲觀先入鳯凰城凍影篩簾密寒光射隙明詰朝宜表賀來歲卜收成送吳清叔驛路程雖逺帆風勢甚遒青山隨岸去白水滿江流牢落添新恨繁華憶舊遊只今歸去好把釣即槎頭贈鄭尊師茫茫雲著地摵摵雨交天篁竹連河上青茅盡海邊棲遲聊應化放曠且談玄相對蒲團坐清風為肅然黃櫟杖為龔聖與作嗟哉黃櫟杖吾賴汝扶持未免道途苦無如筋力衰散才唯不用大節固多竒老向江湖上提携得自隨次韻夏仲勉門前無繫馬屋外有鳴螿迫迮衣冠府蕭條翰墨場雨淫憂地濕風暴喜天凉推轂無時巳令人憶鄭莊不喜為文富長憂得酒慳尊罍堆案上筆硯棄墻間有傳追王績無書繼賈山貴人䏻慢士往見亦胡顔冬至次韻張宣撫北去關河逺南歸歲月長屠龍雖有技相馬獨無方雲水連天暗霜蕪滿地荒客遊應未巳塵土在衣裳瀛海無消息冥冥鳥道長巳驚雙鬢短更待兩瞳方落日依平嶂洪河入大荒憂來那可得揮淚欲沾裳送吳清叔歸婺客遊春向莫無日不思歸雨給桑麻秀山深笋蕨肥薄醪能屢醉舊社足相依莫道天邊鴈衝衝適禍機與方韶卿望月月明胡乃爾秋盛故能然匣鏡無纎翳槃珠有許圓寒光搖碧海爽氣挾青天幸遇山頭鶴令人夜不眠孝思亭詩為王心田作山嶠靄蒼蒼盤旋衛古藏盎溫通地氣赫奕閟天光神化侔飛劒前聞驗若堂子孫修祭祀歲久不能忘淨香亭藝竹蒼空古為亭白日幽一麾方出守千户益封矦外物從渠屏清尊喜客留楣閒標勝語朗詠亦風流翼翼四簷外蕭蕭三徑中珠璣穿夜雨幢纛舞天風擁䄂生清氣開軒近碧空古人雖不見佳興詎無同酬吾子行耿耿思朋舊悠悠涉歲華既依秦大姓方問魯東家雅道將誰與新詩敢自誇秪今能㑹合不憚路途賖偶作碧草含秋意黃雲起暮容歸鴉昏且噪去鴈逺無踪杯酒因循醉朋人邂逅逢身名猶碌碌正坐日踈慵送劉明卿歸安東同郡居相逺逢君豈偶然秋天聮席宴寒夜共衾眠不為時名役猶嗟俗事牽語離還悵快後㑹是何年和張仲實舟行雜詠莫作匆匆去相隨稍稍觀逺山多意態急水易波瀾把酒悠然樂扁舟得爾難五湖天下景六月氣常寒題秋江釣月詩卷泛跡秋江上而今不計年垂綸牽細浪欹帽破長烟巳類玄真子兼疑孟浩然後來名未泯題品有髙賢翰林楊仲弘詩第三卷終
