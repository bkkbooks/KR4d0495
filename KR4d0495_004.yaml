body:
  text: 五言排律夀姚承㫖上帝黃金闕仙人白玉堂皇猷資黼黻大筆主文章間氣生竒偉休期際吉康四朝承寵渥多士仰輝光盡發琅函祕重翻石室藏成書侔二典有道述三皇碩望高天下榮光近日傍謀謨須稷契羽翼藉園黃上殿扶鳩杖開筵接蟻觴九重師道德千載合明良共說綸如綍能催繡作裳人思興禮樂國待理隂陽舊族名先著高門慶甚長賜書踰萬卷納笏過三牀轉覺勛庸盛還欣體力強朱顔朝映日素髮曉欺霜巳注長生籙曽傳却老方宜齊周李耳逺邁漢張蒼松柏深逾秀蘭芝久益芳願公多夀祉仍見子孫昌贈周景逺學士朔易回元氣人才起俊流聲華當翰苑文采冠中州振佩趨臺閣抽毫侍冕旒人傳鸚鵡賦家有鷫鸘裘式覩黌宮立共惟祀典修一朝虞或缺六器俾傍求爼豆俄成列蘋蘩遂可羞中朝方有道下士實同休巳及歸鴻候姑為食蟹謀朋簮多繾綣使節少淹留曉日花間酒春風桞下舟篇章微品藻山水愧清幽鄭璞曾先辱隋珠不暗投考槃雖自引窺觀亦吾憂簡冊銷長日蓬蒿憚凛秋論高非縱誕興逺託賡酬尚憶駒千里胡䏻貉一丘何當把君𬒮相逐馭風遊夀杜尊師淡蕩風雲氣沈雄虎豹姿繇來天下士絶異里中兒苦縣常栽李商山舊采芝不當卿相位猶可帝王師始有巾車獲俄蒙仄席知賢才方並用讒說遽相欺豸角將巍冠龍鱗敢逆批變通俱合道舒卷各乘時築室烟霞祕還丹日月遲願公長住世須作後天期次韻曹上開毗陵喜雨下土方淫潦髙田獨旱乾木形憂隕命藿肉愧為官索寞雲容合蕭條夜色闌精誠天巳感祠禱力𥘉殫逈野霑新潤曽檐下急湍槁苗還薿薿大豆且團團逹宦俱相似疲民乞少安佳章宜刻石留示後人看春雪次陳元之韻寒氣何悽慘春空正杳冥東皇收槖籥北帝駕軨軿混沌包三極􅌭紛走百靈散殊分的皪擊玉碎瓏玲始試朝藏日俄疑晝隕星危橋無客渡曠野少人經白沸疑奔瀨孤撑沒峻嶺林荒顛凍雀崖滑墮哀㹶衮衮隨風舞颼颼雜雨零遺蹤𥘉得兔匿種詎憂螟眄睞傾農室歌謡徹帝庭陽春將布德品類各成形捉筆題新句持杯酌舊􅙩今朝須痛飲醉卧不須醒送張仲實之宜興南渡邦𥘉造西山將獨賢立功何赫赫流慶尚綿綿報國橫戈數登壇授鉞專風雲方際㑹江海固周旋控險千鈞弩臨危七寶鞭忠誠深足仗智勇實兼全自返髙橋役端持肩府權兵威終抗敵人力可回天甲第無踰者諸孫固頴然初生同燕頷有美自蟬姢善學聞當代能詩起妙年衛公猶故物鄭老竟寒氊矯矯青雲器泠泠白雪弦同逰雖未逹自睍巳無前政事兼留意時髦孰比肩知機無轉石縱辨若奔川特逹群公薦酸寒衆目憐姑為文學掾㑹覔孝廉船必見公矦復無論雨露偏秋風鵬鶚健萬里正翩翩送丘子正之海鹽州教授有美區中彥由來志不群舟航了吳越裘馬向燕雲才思庾開府風流王右軍得時宜玉筍稽古賸香藝果拔英毛頴遄收翰墨勛諸公希宦逹半世有辛勤奔走空皮骨躋攀不寸分夏侯何地芥郢匠實風斤嗟我慚鴟鷺棲山似鹿􅍪偶來詢故老因得友多聞湖舫曽秋雨河橋幾夕曛過從方不散慘别亦奚云爼豆班矦泮鹽絺薄海濆未論虞廪米聊樂魯宫芹此日顔應抗之人德巳薰化爐新鼓樂學殖重耝耘行矣穿黃落歸歟守白紛贈言將底事努力在斯文贈班彥功名書稱晋代盛事起江東內翰鍾竒氣深情縱古風摳衣皆弟子入室自豪雄欲立千金價寧論百日功秦名黃閣老承詔大明宫遺教規王氏隂符易禇公杯沾銀鑿落佩簉玉玲瓏文學談經早聲華脫頴同麥光人共賞棘刺巧無窮願積臨池趣流傳史冊中士開燕嶽氏溪堂有溪山新月上江海故人同之句邀豫及張仲實曹克明同足成之置酒秋風裏憑闌野色中溪山新月上江海故人同縱浪情何極留連燕未終三鱣來上客五馬㑹群公積水輸清氣微霞衒近空將昏林尚白及早稻先紅極論追遐古深情念困窮尚觀儀秩秩未遂樂融融才著當朝傑文誇命世雄數君今日選宜爾集南宫次韻黃子久喜晴三十韻呈汪知府霞彩晨張錦蟾光夕挂鈎隂霾雖盡解淫潦豈全收寖動遨遊興還聞倡和謳容容追舊賞歷歷破新愁騎氣城邊縱龍光海際浮艷粧來士女盛服擬王侯在藻群魚躍依林白鳥啾河流交不斷山勢轉相繆物理歸含育人情釋怨尤娭娛從老稚燕樂逐朋儔幄帟分郊次幨帷擁道周聮翩馳畫舫􅏭嶫纍朱樓貿易通遐壤繁華壓大州聚廬千井富接棟萬家稠巳戒增周仍催決下流嘉𬞞連隙地宿麥遍高丘曹事虞多廢胥徒戢過求醲恩方並育和氣與同游期㑹朝先往追隨暮不休露華開的的風葉振颼颼拾芥非無日登禾即有秋朝家期少試鄰郡固難侔共美光華著還矜德業修在廷爭進薦當寧免垂憂玉漏傳金角金尊出殿頭秉心存正道造膝待嘉謀履直恆如矢防偏或類舟第誇翻竹簡不省計牙籌善對慙鳴鶴能歌愧飯牛過情蒙許與彌月為淹留再用韻贈黃子久自惟明似鏡何用曲如鈎未獲唐臣薦徒遭漢吏收悠然安性命復此縱歌謳石父能無辱虞卿即有愁歸田終寂寂行世且浮浮不假儕群彥真堪客五矦高人求替洽末俗避喧啾藜杖常他適繩樞每自繆與人殊用舍在巳寡愆尤濟濟違班刻倀倀逺匹儔能詩齊杜甫分道逼莊周逹飮千鍾酒高登百尺樓艱危仍蜀道留滯復荆州鶴度烟霄濶龍吟霧雨稠東行觀海島西逝涉江流自擬需于血何期渙有丘古書嘗歷覽大藥豈難求撫事吟梁父馳田賦逺游堂名希莫莫亭扁效休休檻日迎東濟窗風背北颼鳴琴消永晝吹律效清秋雅俗居然别仙凡逈不侔多聞踰束晢善對邁楊修進有匡時略寧無切巳憂塵埃深滅跡霜雪暗盈頭始見神龜夢終營狡兔謀雪埋東郭履月滿太湖舟急景誰推轂流年孰唱籌凌波乘赤鯉望氣候青牛好結飛霞佩胡為淹此留寄王繼學二十韻聖主敷皇極元臣建上台虛心求俊乂削迹去奸回拜命超凡品知君秉大材淳風隨日播公道應時開負鼎資烹飪操刀貴剸裁銛鋒行肯綮異味合鹽梅廟議常參决朝班復共陪艱難須㐸助豁逹逺嫌猜遺佚聞風起英豪接踵來經綸非董賈辭藻亦鄒枚在野思羅職盈庭想轂推既將龍作友惡假鴆為媒走也今晋此公乎可念哉執竿猶海上扶耒即巖隈自守幽人意寧虞俗子咍舊遊辭玉府故事憶金臺落魄江湖阻蒼茫歲月催丹心徒耿介素髮巳毰毸勿謂交如水能忘耻及罍飛黃當駕馭猶足異駑駘送完者都同知來游天子學藉甚有聲華論事依三策藏書至五車姓名題鴈塔譜牒記龍沙自可編青竹兼宜綰白麻文工金有價貌美玉無瑕興盡方豪飮篇終不浪誇豈惟吟芍藥曽是賦蒹葭事莫分難易人須辨正邪月中初折桂天上始乘槎勿待秋風起宫門聽鼓撾贈郭集賢衣冠趨近地藻翰集群賢給事黃門裏抽毫黼座前佩龜金作紐賜馬玉為鞭御酒傾壷滿宫花插帽偏清光依日月逸思撓風烟記憶踰三篋吟哦過百篇自惟叨侍從不敢廢周旋秋著隨車獵寒當襮𬒳眠蘇環才既敏陸贄寵尤專自爾紆皇眷于焉理化弦詞臣方進用才大畢騰騫可念如楊子蕭蕭獨草玄悠然閣高閣憑虛起登臨興甚長江流春渺渺樹色曉蒼蒼原隰魚鱗布峰巒鳥翼張雲耒兼北極雨過及南荒地大遺民富時清致理康南山常在望懷古意難忘寄周御史二十韻同游河北後共抵浙西初獨倚知心舊翻成㑹面踈三年仍契濶萬里更吹噓小子無竒氣先生有過譽見稱司馬賦求授夏侯書倉卒排歸計淹晋著寓居巳非興俊逸猶異主癰疽名士多親我諸公或請豫駕言將采芭即事欲連茹顧爾傷流矢居然恨倚閭驚心聞杜宇過眼易蟾蜍忽召抽金匱俄徴論石渠文章殊賈馬謀略匪嚴徐薄技終難效窮愁只自如尚矜存弊履不肯曵長𥚑與作棲梁燕寧為呼轍魚儀形長日想懷抱幾時攄奏疏聞當寧抽毫待直爐烏臺弦既改鰲禁席仍虛馬首何繇見分光興有餘送董與可為句容縣主簿主簿非高士通才或暫為催科虞慘急勾校慮稽遲慎察文無害詳觀獄有疑溫純規白璧正直視朱絲要使聲名著何嫌品秩卑烏臺懸日月舉辟實無私送朱復之為邵武教授放浪來京國于今復幾年山川多歷覽日月屢推遷異俗疑烏帽窮途信馬鞭逹官空有榻遊士固無氊始聽除書下俄聞抗斾還南州分教地成法紹前賢趙彥祥母慶八十從親年八十萬里自西來氏族稱三蜀光華照二臺奈繁愁夜雨筍長望春雷綺食和金鼎香醪進玉杯鳯毛方煒燁鶴髮正毰毸試使蟠桃熟從今更幾回雲山圖為茅山劉宗師作長江千萬里奔浪薄高雲龍現誰能覩猿啼不可聞迂回因地勢昭晣應天文劒氣秋如洗珠光夜欲焚連峰俄筍迸斷崖復瓜分句曲臨東極巖頭有隱君題康里氏家譜國受輿圖廣家傳譜牒詳馳聲繇鴈塞拓跡至狼荒轉戰踰千里來降盡一方奮戈回白日列㦸耀清霜破竹收城邑分茅賜土疆弟兄皆徑悍父祖各雄強相印仍兼綰兵符更迭藏排衙開萬弩納笏過三床巳及書宗祏還宜紀太常後人能繼紹千載有輝光題王參政積翁别故人詩卷後聖主膺新命明公遇盛時混同開宇縣困厄守城池冦盜思攘􅐁黔黎賴寵綏合圭承燕享前席備詢咨築室求梁棟徂堂薦䁀鼒用兵陳廟算養士作邦基巳草歸田賦仍題伐木詩此生終契濶吾道豈磷緇矯矯游龍字綿綿吐鳯辭錦囊加十襲細覽想形儀贈魏虛舟少府西蜀文章伯東吳閥閲家族傳貞觀舊躅繼信陵遐雅度人難測高名衆共誇為楨材不小韞櫝玉無瑕鳴鳯占諧吉乘龍偶契嘉三床邀納笏萬弩護排衙世賞官仍及朝參寵復加天顔垂眷顧地肺侈光華緩步方鳴玉高情欲泛槎翻然歸翠麓姑爾奉黃麻彭澤還栽桞河陽不種花投間銷日月訪古略烟霞臘蟻常開宴春魚每看義興來恆放逸賔從任喧譁閣靜褰珠珀窗虛閟緑紗琴彈多古雅詩就輒妍姱願作梁間燕徒慚井底蛙執鞭曽莫俲抱瑟敢長嗟戀戀情終在悠悠道苦賖春風吹去斾翹首又天涯贈劉平叔郎中肇自三苗氏淫為五虐刑商周終至治禮樂固常經赦過存三宥原情用八聽未能還畫象猶貴去殘刑末俗仍澆薄生民曷救寧謂宜沾雨露抑使震雷霆皡皡惟母擾元元庶有靈林殘求虎豹穀害去蝗螟此意雖忠厚斯言若窅冥君乎吾有望當使在朝廷送丘子正之海鹽珠生滄海底王韞碧山中夜氣交明月陽精現白虹有賢兼重價當代振英風好學由天性能書至國工知名傳冀北作賦擬河東始欲徴楊子旋聞薦楮公隂符難獨美遺教實爭雄絶藝雖宜進竒才自不同交游傾上國掄選屬南宫鄧禹官初試匡衡對漫通海邦終寂寞學館尚穹崇巳注千人録當成五典功星辰皆在水渤澥信浮空把酒歡何限乘槎興不窮文章趨浩瀚物態入牢籠子必登藝閣吾方守桂叢索居彌寡陋荒業孰磨礱弗獲披雲霧惟思對華嵩知音期郭泰流俗易王充江海從茲逝飄飄任短蓬贈虞彥髙吳越知名士風流得此人結交何待久晤語即相親丹穴生儀鳯滄波豈縱麟飛鳴常見瑞變化不無神家世皆為善文儒謹飭身不將紈袴纍自著綵衣新力學追高古修辭絶等倫汪茫涵巨海要眇動纎塵鐘虡聲音大韺䪫節奏均詎誇傳里巷可使抒絲綸藉藉聞當代駸駸集要津省闈曽奉檄學館巳垂紳滋味嘗郊鼎光華薦席珍南宫延國子西掖選詞臣慷慨升車日遲回執𬒮辰論心情巳至抵掌氣彌振虞詡才方壯湯休學最醇相期終晚歲無取艷芳春抱獨知何向為朋喜有因從君鳴一世流詠𬒳無垠鄭中丞母大夫人夀八十端公居重位夀母在高堂天意何相厚人倫實有光豸冠方俊偉鶴髮尚康強內翰為封誥同僚舉慶觴欣欣承玉饌赫赫帶金章獻笑慈親側繩愆聖主傍中天懸日月下土凛風霜可謂全忠孝都緣積義方孟軻難獨美湛氏竟齊芳頌德吾無愧名宜百世揚送朱仲山歲貢入京昭代陶淳化多方出異材鳴岐聞鳯鳥清道服龍媒養素稠山僻觀竒戴籍該為珍如寶璧奮蹟起蒿萊未展垂綸趣初承勸駕催羔羊塤委巷駟馬踐輕埃戰藝鋒無敵搜賢網正恢上書追偃樂作賦並鄒校奮發直從此遊觀亦壯哉雲霄千萬里瞻望重徘徊招真觀圖欲學無為道來居小有天精神消物怪采色變風烟恬淡知天德虛無象帝先高風何特逹古跡尚流傳地涉鴻荒表山開混沌前谷幽疑鬼聚峰巧類人仚疊起三重閣分流百道泉岩穿留虎跡石冷逗蛟涎放浪曽無日遨遊未有年古經披覽罷蒿萊未展垂綸趣初承勸駕催羔羊塤委巷駟馬踐輕埃戰藝鋒無敵搜賢網正恢上書追偃樂作賦並鄒校奮發直從此遊觀亦壯哉雲霄千萬里瞻望重徘徊招真觀圖欲學無為道來居小有天精神消物怪采色變風烟恬淡知天德虛無象帝先高風何特逹古跡尚流傳地涉鴻荒表山開混沌前谷幽疑鬼聚峰巧類人仚疊起三重閣分流百道泉岩穿留虎跡石冷逗蛟涎放浪曽無日遨遊未有年古經披覽罷毛骨為醒然喜晴得揚字呈汪知府霏霏褰宿靄煜煜射𥘉陽出谷鶯聲滑摩空鶴勢張鼓鼙爭奮發帆幔各飛揚不畏塗泥滑寧憂積潦妨農夫分舊種紅女覔柔桑為有豐年慶陳陳滿太倉寄沈少微金華山隱居巖前通細路嶺外接危峰梯磴踰千級烟霞過萬重緣崖收異荈步壑數長松隔屋號朱虎當窗現黑龍蘅蘭爭酷烈桃李角鮮穠隱士多相過仙人庶可逢第能安性命何患改顔容煉鼎丹砂熟傾壷白酒醲微茫追絶響瀟灑振孤踪鄉里宜同好它年必子從挽徐處士此日新安郡名家復數誰危科雖屢掇舊業詎多遺孝友全高行溫恭集令儀花殘青歲晚木落紫山悲結蟻容兼盛銜鱣譽更垂白雲埋骨處揮涕想漣洏送侯尊師歸蜀北上關河逺南歸歲月賖飄飄携短劒杳杳泛靈槎别岸秋濤掩前山曉霧遮欲攀青桂樹先採白蘋花大道元無極浮生即有涯舉杯吞夜月引䄂拂晨霞獨跨冲天鶴能追赴壑蛇秪應投老去長日煉丹砂春晚喜晴積雨俄經月新晴始見春蒼苔侵别墅緑水過比鄰性僻居宜逺身間景易親無詩排世纍有酒縱天真循圃花粘履憑䦨桞拂巾歌呼從稚子談笑或嘉賔漸喜漁樵狎仍欣鳥雀馴幽情延薄莫浩思集清晨養拙元非病為文敢自珍杜門緣底事作計懶隨人翰林楊仲弘詩卷第四終
