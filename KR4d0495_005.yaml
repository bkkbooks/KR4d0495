front:
  text: 翰林楊仲弘詩卷第五
  hash: sha256:19c11ab6ce880031205b26106e6ba0a7ea77734c73a6fa9d33aa0fa08c708742
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0495_SBCK_005-1a}
body:
  text: 七言古詩次韻虞彥髙遊陽明洞憶昔神禹奠九州茲山會計功始休諸侯玉帛渺何許但見萬水從東流衣冠永閉陽明洞夜聞鬼哭巖之幽珠宫貝闕號龍瑞天造地設非人謀槎牙怪樹凍不死化作千丈蒼王虬丹洞呀然仙掌裂翠峰巧矣蛾眉修梅梁飛去鐡鎖斷往往雷雨生靈湫軒轅緱神極祕怪海上笙鶴時相投平生閉門讀史謳子乃探穴先吾遊明當挾子騎汗漫題詩更在最上頭不妨山水樂吾樂豈有飢溺憂民憂故家喬木尚可求有子有孫百世留卧橫玉簫泛歸舟吹散萬斛江南愁送俞用中之蓮城君家文獻猶未泯名載舟車無不之乃翁種德不食報流慶涓涓方在茲皎然王立七尺軀相非公卿無此竒早孤為學孰勉劭藏書萬卷能盡披季父撫育過巳子將為前人護址基我兄長公有年歲才氣偉燁通時宜賈誼朝錯奉大對生晚弗及同驅馳君令沿檄治鄉校𥘉官履歷固不卑要為國中養賢俊政無大小視所施栝蒼山好著仙籍昔人于此自燕順榮公相業輩王謝石僧尚有蹤迹遺君居三載業可想再見惟有操降旗古墻行建炎白馬南渡時循王以身佩安危疏恩治第壯與衛縮板栽幹繇偏禆下鍤江城但沙鹵往夷赤山取焦土帳前親兵力如虎一日連雲興百堵引錐試之鐡石堅長城在此勢屹然上功幕府分金錢歡聲如雷動地傳爾來瞬息逾百年高崖為谷驚推遷華堂寂寞散文礎喬木慘淡棲寒煙我入荒園訪遺古所見惟存丈尋許廢壞終嗟麋鹿遊飄零不記商羊舞主孫欲言淚如雨為言王孫母自苦子孫再世墮門户英公尚及觀房杜如君百不一二數人生富貴當自取况有長才文甚武公侯之後必復初好把家聲繼其祖題山石猿鳥圖萬卷堆中昏欲睡忽見畫圖醒我意眼前崖谷起嵳峨便似看身遊此地楩柟櫧櫟大百圍奔泉透石辟歷飛玄猿孤峙憩美蔭下視白鳥娛清暉昔聞虞舜狩南嶽君子相隨化猿鶴往時此輩猶爾為慨想雲林真可樂拔劍斫山山骨露山鬼咿嚶安敢怒秪今踊躍歸去來莫愁無覔誅茅處李伯時畫浴馬圖古稱難畫莫如馬近朝唯數李伯時不至天間觀帝服如此骨相何由知頭類渴烏尖插耳竟度流沙輕萬里圉人牽浴恆凛然復恐化龍奔入水貧居里巷無馬騎徒步出入多傷悲大脛薄蹄何足願退立道傍塵滿面送時中兄入京先生意氣非常流有如雕鶚厲九秋讀書不肯守章句經濟可許斯人儔懷抱利器將逺遊直往上國交公侯王侯位高不下士如以蛟龍視螻蟻為君莫敏光範書以氣撼搖差可耳功名倘來不足為丈夫須作逺大期君不見麒麟閣上圖英俊當時或自閭閻有闕文次韻題慈照寺浪紋石山前流水響急灘崕崿齟齡嶮且艱直上正平稍去水坡陀漫漫龍背起幽阻之間有竒石洶若北風吹海立滄海飛塵事有徴遂使喧豗化冥寂開闢而來六萬四千歲浩浩洋洋不休息雖有好事者欲為之不似大造無䀶迹我行見之頗愕然抽觴戲欲取涓㒀僧堂託宿語不眠竟莫禮了生公禪意外竒崛當眼前跋涉無負兩足研君家住時宅通廛何如金堂石室友群仙會見石髓流為泉何事更種東臯田子能食之可長年題王起宗畫松岩圖雲起重岩鬱凌亂長松落落樹直幹若人於此結茅屋爽氣飄然拂霄漢艤舟之子何逍遙從者傴僂携一瓢山中無日不間假跋涉相顧凌風飈始知王宰用意高使人觀圖鄙吝消世間未必有此景塗抹變幻憑秋毫丹青遊戲故足樂收絶視聽搜冥寞向來為政殊不惡乃爾胸中有丘壑題華嶽江城圖華嶽能詩世有名學畫丹青亦豪放此圖似寫安慶城雉堞樓臺儼相向北風將至江靣黑千艘萬艘爭避匿滄𬈑涌溢水倒流南嶽動搖天柱側蛟龍戲落秋潭底素練平鋪八千里時清好作釣魚翁間弄輕舟煙霧裏神馬歌次韻陳元之神馬來自昆崙西有足未始行沙泥朝趨欲出飛景塗抹變幻憑秋毫丹青遊戲故足樂收絶視聽搜冥寞向來為政殊不惡乃爾胸中有丘壑題華嶽江城圖華嶽能詩世有名學畫丹青亦豪放此圖似寫安慶城雉堞樓臺儼相向北風將至江靣黑千艘萬艘爭避匿滄𬈑涌溢水倒流南嶽動搖天柱側蛟龍戲落秋潭底素練平鋪八千里時清好作釣魚翁間弄輕舟煙霧裏神馬歌次韻陳元之神馬來自昆崙西有足未始行沙泥朝趨欲出飛鳥上夕逝直與奔星齊緑鬃半散插雙耳赤汗交流攢四蹄風神秀獈狹天地豈顧燕蔡并渠黎時時牽浴臨清溪對人誇殺黃須奚玉沙之禾中芻秣不嚙堤頭枯草梯與君側耳聽長嘶凡馬不聞生駚騠古劒歌為吳真人作間間真人藏古劒敬之如神不敢忽賔客時來求一觀輒有悲風起倉卒人言此是金鐡精良工煆煉久始成動搖天地合變化摩蕩日月含光精昔年有蛟起江中口吐烈熖燒長空下民昏溺上帝怒雷電往擊皆無功嘗持此劒斬蛟首流血滔滔浸廬阜傳記傳聞時既久不意世間今尚有吾過下里多惡氛魍魎魑魅能食人請君為我絶此怪一洗宇宙長清新梅梁歌酬鄭集之大禹之功及天地廟有梅梁何足異奈何過用鐡索纒太祝為之欲􅗲利每言變化失其所去作老龍治風雨一聲霹靂震岩扉千尺蜿蜓辭殿户七月稿苗沾塊土憂殺村中老農父買羊沽酒祭梅梁祭罷祠官傳好語吁嗟老農無爾愚大禹有神焉可誣汝曹淫祀欲求福此物為妖當伏誅題趙千里山水扇靣歌公子丹青藝絶倫喜畫江山上紈扇秪今好事搆千金四幅相連成一卷春流漠漠如江湖飛煙著樹相有無嵐光注射翻長虛白玉盤侵青珊瑚追隨流俗轉蕭踈對此便欲山林居旗亭花發酒須沽舟行為致雙提壷抱琴之子來相須醉歸不省何人扶旁有飛泉出岩隙掣電飛霜相蕩激蛟龍不愛鯢桓食但見垂綸古盤石人生萬事無根柢出處行藏須早計一丘一壑倘如斯便可束書從此逝君不見鄭子真躬耕谷口垂千春毫芒世利能沒身汝胡齷齪為庸人題秋雨長吟圖雨暗秋天黑如墨窮居茅屋出不得終日長吟復短吟吟罷令人轉凄測飢猿抱樹屈雙肘病鶴拖泥垂兩翼何當策杖過溪頭要看南山新翠色竹樹圖荆棘蒙蘢迷竹樹亂堆古石蒼苔護縱獵青郊懷舊路躍馬重岡追狡兔箭翎落地無尋處時中兄示余畫一軸畫一老翁推獨輪小車上載兩巨甕意其為警世之為因為賦詩小人無他獨嗜利兩甕載車將逺致肩赬足趼汗澘然冉冉修程胡不畏世人但笑愚翁愚甕破即與瓦礫俱不知人有千金軀前行險道方乘車翰林楊仲弘詩卷第五終
