body:
  text: 七言律詩宗陽宫望月分韻得聲字老君䑓上涼如水坐㸔冰輪轉二更太地山河㣲有影九天風露寂無聲蛟龍並起承金榜鸞鳯雙飛載玉笙不信弱流三萬里此身今夕到蓬瀛次韻錢唐懐古江湖清濁自天開鴻鴈鳬鷖與徃來黄道星辰環太乙紫雲宫殿擁蓬萊論文競奏王褒頌獻夀深傾阿母盃九域輿圖今混一百年耆舊獨興哀斜界鈎陳通大道中分魏闕對層巒雲生殿上金爐暗露下庭前玉井寒江漢飛龍俄窅窅滄𬈑泛鷁竟漫漫中天㑹合寜非數坐見蒼生奠枕安山囬禁禦入雲長無復陳兵衞兩厢千石金鐘埋野草萬年珠樹落秋霜龍文不徙陽人聚鳥篆終䧏軹道傍九市塵埃來衮衮一江波浪去茫茫化人宫闕𬒳層阿棟宇高低若湧波翠石文章書日月寳珠光𦦨燭山河空枽說法黄龍聴貝葉繙經白馬駝誰謂一無超衆有只今塵土重來過題豐樂樓峥嶸飛構壓名邦西望平湖東望江氣合重玄蒙沆瀣標存九域奠洪龎朝來散霧縈朱栱夜後流星透碧窓倚徧䦨干愁目眩飛鳶旋轉故雙雙水樂洞石林求路轉聱牙來訪香嚴大士家雨過門前生薤葉風行隴上落松花懸崖滴水鳴金磬激磵流泉走玉砂欲適山林去城市乆知寂寞勝紛蕐題拱北樓殷地鼓鼙迎日出倚天梁棟與雲浮北瞻帝闕三千里南控臣藩二百州江海無波沉罔象旌旗垂野駐貔貅鸞迴麗榜多深意繡衮于今有魏牟次韻羅雲叔紅梅玉人中酒殢芳蕐盡壓東風百種花襆𬒳冬深裁異錦篝燈夜永障輕紗纎𬎼露沁蜂腰蠟宻蕋雲蒸鶴頂砂爲問閬風何處在相期高舉籋晨霞紀夢海上垂綸有㡬年平居何事夢朝天蒼龍觀闕東風裏黄道星辰北斗邊治世秪今逢五百前程如此隔三千楊雄觧奏甘泉賦應有聲名逹帝前次韻陳子仁黄河禹功䟽鑿過憂勤海内山川自此分元氣渾淪通地脉孤光迢逓貫天文母金伏礫秋逾盛隂火藏淵夜不焚多少魚龍爭變化緫歸西北㑹風雲隂陽爲殄黄河溢北度艱難擁萬艘齊楚百城防雉堞淮沂千里避鴻濤耕鋤巳失天時正流徙爭依地勢高此日朝廷憂水患湏明利害策賢豪遊水樂洞分韻得人字常聞勝地宅仙人如此淵泉必有神子晋重來玄鶴舞琴高初化赤魚馴巗排利劒鉤鐔古水象鳴球節奏均更有山僧能觧語自今休厭徃來頻望海海門東望浩漫漫風颶無時縱惡湍黒霧漲天隂氣盛滄波衘日曉光寒豈無方士求靈藥亦有幽人把釣竿揺蕩星槎如可馭别離塵土亦何難送罷雲叔歸山中黄石山原風物幽賤子徃年曽一遊舊行􅞢柘巳成逕新藝木麻應滿疇馮衍能忘白首嘆謝安湏爲蒼生憂餘杭溪上明日發愁殺楊花吹客舟送叚時敏之京懐山挾海奠京師氣執紆餘盡北陲鴈度塞雲秋色逺鵲鳴宫樹曉光遲四方英俊皆來萃一代經綸属有爲君有長才希屈賈好将詞賦重當時留别京師嚢衣託載道傍車人事匆匆歲欲徂風雨四更雞亂呌關河千里鴈相呼蕪菁散漫根猶羙桑柘蕭條葉漸枯却向高丘重回首五雲繚繞帝王都柬淛東萬户蕭伯善擇帥中軍自古難獨分符節守藩翰夜鳴鼓角溪山靜曉竪旌旗雨雪乾不待掃門知魏勃豈湏彈鋏識馮驩秪令四海無征戰萬卷詩書好厭觀送勾曲外史張君歸蕐陽送君高舉入蕐陽古洞深蟠石路荒蔽日旌幢朝旋旋飛空環佩夜琅琅飡霞巳試登仙訣祀竈還脩却老方見說陶公雖隱遁猶將道徳佐齊梁送户部康里尚書經濟才高負重名早趨蘭省執權衡唐除宰相同三品漢拜司農列九卿禮樂正圖興羙化錐刀先務巳苛征公家事業齊周召重使斯民望太平屢挾嚢書上國遊途窮獨擁弊貂裘驟蒙陸贄知韓愈直待常何薦馬周北上塵埃憐寂寞南遊歲月苦淹晋鯫生資歴猶卑淺可使徘徊製錦不贈同院諸公詔編國史有程期正是諸郎儤直時虎土守門宫杳杳鷄人傳箭漏遲遲窓間夜雨銷銀燭城上春雲壓彩旗才大各稱天下選書成當繼古人爲玉堂夜直直廬歲晏動覉情朔雪将飛覺夜明金井轆轤哀響絶玉階瓴甓斷紋生蘚花莫辨沿墻迹松葉時聞委砌聲愧以不才同制作諸公此日負高名惠山泉此泉甘洌冠呉中舉世咸稱煑茗功路掛山腰開鹿苑池攅石骨閟龍宫聲揺夜雨聞幽谷彩發朝霞眩太空萬古長流那有盡探源疑與海相通寄維揚賈侯經國長才世豈多群邪嫉正柰公何氣蒸雲霧藏喬嶽聲轉滄𬈑放大河逺跡江湖猶棄絶驚心歲月屢消磨鵾鵬自有垂天翼肯逐飛鴻入網羅寄康大夫徃年持節使山南及此人情上下諳高士變心慚隠逸小胥縮手戒貪婪猿聲散漫浮青嶂鴈影㰚褷曵碧潭遥想政成多暇日幨帷出郭有誰叅遥想幨帷出郭時先駈十里走旌旗青山落日蒼茫暗白水秋風慘淡悲勁矢毎隨前隊發清笳偏逐後行吹荆州未覺風流逺縱飮還應到習池寄康里公廟堂爲政已優游第秉純誠賛大猷五緯連珠環北極萬方同軌㑹中州衣冠肅肅趨金殿鐘皷遲遲報玉樓治世賢才今盛集願陳旱麓頌宗周歎息流年逐逝波功名到手莫蹉跎高才自昔遭逢少公論于今責望多梁棟噐充能負荷鹽梅味合要調和共誰魯國勲庸盛青史何年可㓕磨寄康大夫官居烏府號清嚴察吏由來首六廉舊直螭頭司紀載新加豸角備觀瞻蒙恩聖主寜求進具禮名流每執謙欲論六朝興廢事籃輿應度蒋山尖送伯長扈駕罕畢前驅盛國容黄麾仙仗衞重重星流曠野飛蒼鶻日麗層霄馭赤龍耀武邊陲湏北狩合祛天地待東封論才孰可銘休烈扈聖還宜祀岱宗追從群彦客金門獨用才高𬒳國恩石室紬書裁帝紀玉堂草詔代王言宦途赫赫名方振餘子紛紛氣可吞㑹合適逢千載運奮飛寜羡北𬈑鯤寄袁伯長㡬年簮筆侍明光直取才蕐補衞郎祀事悉稽周典禮頌聲湏假漢文章雲垂逈野鳴鞘逺月滿高城下漏長校獵合祛尤盛事願聞作賦擬長楊東湖四景爲大尹本齋王侯賦朝來千騎出城闉爲向東湖踏早春素練冪林雲氣薄明珠穿草露華新山花獻咲開簷畔海鳥忘機戯水濵記取當年賢太守及時爲樂與斯民夏月湖中爽氣多南風曡曡捲長波漁人舟楫衝蘋藻遊女衣裳擥芰荷膾切銀絲嘗羙味腔傳金縷換新歌史君用意仍深逺即此光華豈㓕磨蹔停麾蓋擁輕舟此日湖山属暮秋采采黄花登几案離離紅樹散汀洲傾壷浮蟻杯頻竭下箸鮮鱗網乍収莫向錢唐誇徃事白蘇未許擅風流雲氣低藏十萬家東湖飛雪又交加玉禾舊布仙山種瓊樹新開帝所花别浦移舟聞過鴈高樓凭檻見歸鴉侯門似有相如客賸賦篇章與世誇虞待制魏録事述懐有作次韻奉和二首二公皆故相之後勢等衡廬各柱天家傳性理並鈎玄諌垣劘切章連上文舘招延席屢前羊豕尚修松下祭麒麟肯信草間眠岷峨舊日求遺族萬里湏乗逆水船理氣兼明善論天秪應爲易又爲玄玩辭巳契忘言表說卦仍觀未畫前對案窮年無近效閉門長夏且高眠却忘京國多竒士欲向長河共買船即事禁城曉色清如水高下樓䑓錦繡中千樹好花連上苑百壷羙酒出深宫珎禽競集高林霧寳馬争嘶横岸風人物此時俱盛極兩都絶勝漢西東次韻伯長待制揮鞭逺過御溝斜出院時時見暮鴉巳入玉堂同視草還趨瓊砌共觀花獸爐香繞窓前霧䗶炬光揺帳底霞此去天津元不隔何湏八月泛靈槎送薛玄卿歸龍虎山金門詔下羽人歸欲向山中採蕨薇琥珀懸崖松樹老琅玕倚澗竹根稀高巖蓄雨星辰濕古石懸雲逕路㣲養性可無軒冕累遊塵元不涴仙衣送虞貞白之辰陽君以調官來上國藹然聲譽動儒林出門遇雨泥塗滑歸路逢霜歲月深楚國千年歌白雪揚州三品貢黄金高才不仕朝廷上有詔應煩使者尋春雨濛濛春雨暗重城莾若山林雲氣生駕過東朝霑羽蓋仗移前殿濕霓旌蒼松宻掩巖頭鶴翠桞深藏谷口鶯明日不愁花爛熳新晴陌上有人行徐獨清挽詩大道無名識者稀獨扵元始探精㣲秦關忽報青牛度遼海寜聞白鶴歸經秘玉函旋地軸書懸金君以調官來上國藹然聲譽動儒林出門遇雨泥塗滑歸路逢霜歲月深楚國千年歌白雪揚州三品貢黄金高才不仕朝廷上有詔應煩使者尋春雨濛濛春雨暗重城莾若山林雲氣生駕過東朝霑羽蓋仗移前殿濕霓旌蒼松宻掩巖頭鶴翠桞深藏谷口鶯明日不愁花爛熳新晴陌上有人行徐獨清挽詩大道無名識者稀獨扵元始探精㣲秦關忽報青牛度遼海寜聞白鶴歸經秘玉函旋地軸書懸金榜闢天扉門人攟拾編遺事第録先生杜徳機寄武當山人張真人山走西南氣勢尊大神遺迹至今存氷横磵下千年凍雲起巖前萬里昬既有嚴威彰赫赫詎無厚福護元元真人制行通天地日日飛仙䧏殿門題火渉不花同知畫像堂堂玉立照青春昭代由來重世臣帶納掖庭聮衞士分符江徼緫編民鷫鸘裘暖鳴鞭疾翡翠簾深翦燭頻州縣三年姑少試驅馳休厭属車塵次韻田師孟西曹即事隠吏重來右掖初清明時節亂花舒霧承黄閣霏霏重雨散彤庭點點踈李耳舊藏周典禮蕭何元得漢圖書經邦事業湏公等要使皇文日粲如次韻黄子乆獄中見贈觧組歸來學種園栖遲聊復守衡門徒憐郿塢開金穴欲效寒溪注石尊世故無涯方擾擾人生如夢竟昬昬何時再㑹呉江上共泛扁舟醉瓦盆鷗波亭阻雨坐聴高樹響颼䬙風雨相兼卒未休氣雜昬明侵晝景色交黄赤變河流潜移窟宅蛟龍怒固守林樊鸛鶴愁水潦此時傷稼穡天人何事計仇讐懐錢唐故人柬應中父㡬年流滯客京師每憶江邊話别離落魄巳甘心似鐡蹉跎無柰鬂成絲草玄思苦無人問彈鋏歌長只自悲滿目塞雲飛去盡倚笻獨立更多時寄吏部張尚書復喜清朝用大賢玉音俄對廣庭宣姚崇巳託君臣契李泌終操将相權此日經綸湏展布他時簡冊要流傳淵明有待公田米可念江湖乆棄捐題謝疊山遺墨荆南失守見亡形太歲徒聞忌丙丁羸老扣心天藐藐鬼神號哭夜冥冥忠臣效死招烏合烈婦捐生報雉經辭氣凛然遺墨在再三㝷繹淚雙零故宫愁見黍離離大厦元非一木支義士忠臣徒走死寡妻弱子謾傷悲五經文字寜虛設一代人才頗中衰慷慨殺身猶易事似公方可正民彛題本齋王公畫像天姿英粹異庸常早籋雲霄𬒳寵光劒㦸森嚴開武庫珪璋特逹薦明堂願承簮履趨門下竊候旌麾拜道傍邪正此時真雜糅秦䑓懸鏡亦煌煌詩禮傳家徳望隆一門三世拜三公五營帶甲軍容盛九府流泉國賦充房魏素懐尊主術龔黄先奏養民功欲将惠澤量深淺楚浸洋洋與海通寄題成都萬竹軒爲李仲淵作君家種竹蜀江傍高與蠶崖勢頡頏巳樹旌旗分部曲更鳴琴瑟應宫商蛟龍併逐波濤化虎豹曽因霧雨藏兄弟至今俱宦逹未應開逕接求羊送范徳機徃歲從君直禁林相扵道義最情深有愁併許詩頻和巳醉寜辭酒屢斟漏下秋宵何杳杳窓開晴晝自隂隂當時話别雖匆遽秖使離憂攪客心送鄭子謙倅蘭溪主人情重賦驪駒户外群騶有所湏将喜在塲登薺麥母忘入澤取萑蒲風乾鳥雀當櫩噪日下牛羊隔隴呼昭代擇賢先治理服勤簡牘是良圖青絲絡馬去翩翩正是春風二月天樂作前行尤一蔚壮書随後乗併稠填徴符此日湏官次射策他時對御筵玉府編摩求大手知君元有筆如椽贈彭萬里素居郷䣊繋瞻聴逺渉京都迓寵靈掛席波濤秋淼森㨿鞍星宿曉熒熒肯如蛟劒終藏匣誰信牛刀始發硎将相與人殊勢分秪應雙眼爲君青七月十九日大明殿早朝王氣浮空御殿開金衣照日近臣來絲囊巳進千秋録黼座還稱萬夀盃王子吹笙雙鳯下羲娥攬轡六龍囬衢樽此日霑恩賜散作祥風遍九垓酬賈郎中挺生雄俊氣昻昻服事朝家𬒳寵光鸚鵡盃中春正好鳯凰池上日偏長新裁樂府傳宫體舊着朝衣帶御香忠孝两全人所羡只今慈母在高堂雷江阻風寄池陽通守周南翁繋舟江岸隠蒲蘆坐聴篙師制疾徐巨浪駕空龍出沒猛風吹樹鳥讙呼詩題短札難頻寄酒滿長缾已屢沽輦道沙乾宜並馬問君何日宦京都送王仲儀歸婺源學道山中歲月長中年已見髪蒼蒼爲延簮笏開松逕困蓄詩書蓋草堂季子不期爭富貴公孫莫厭舉賢良告歸苦值兼旬雨㡬度黄流撼石梁體覆木綿價過樂平境中偶賦蒼山百里路盤盤遥望連峰劒㦸攅㫁岸囬風纒古木髙崖飛雨雜奔湍石田磽硧収成薄巗屋﨑嶇結構難度地何如江以北提封百萬有餘寛點義倉即事南來受命佐爲州喜遇豐年暫出遊過嶺﨑嶇㝷道路上山磽确治田疇修藤掛樹龍蛇走恠石攅溪鴈鶩浮賦役巳寛詞訴簡素飡無𥙷謾優悠題楊指揮樂善堂樂善名堂事可誇兩全忠孝故侯家弦匏入廟思無忝分胄升壇聴不譁窓下唱鷄書未卷門前立馬皷猶檛後人自爾蒙遺徳流漲春江詎有涯次韻張秋泉真人碧桃道院桃開一樹春徃來勾引㸔花人揮毫欲賦巫山女振佩疑逢洛浦神翠蕚臨風揺不定珠㽔承露綴如新煌煌更結千年實凡木何由竊比倫再次韻一枝如玉照芳春㡬度凭䦨欲殢人翠𬒳夜寒愁灑淚珠簾月冷怕傷神劉郎陌上裁仍舊王母池邊賞又新不是梨花飄雪樹望中清絶更無倫江上合流渾渾古則然中有物恠藏深淵鮫人賣鮹出水底龍女結佩遊堤邊芙蓉覆波顔色好薜荔絡石根株懸此行欲遂極幽險所聞廬阜多神仙過安慶城下呈李惟肅判官山川未到巳知名前代英雄㡬戰爭水受委輸開巨浸地乗走集建孤城島夷筐篚來修貢楚俗魚鹽樂治生四海晏然當此日斯民何幸際承平寓長春道院春雨即事呈鄭尊師南榮相距數㝷間滿地春泥隔徃還夜雨暗添籬脚水曉雲濃揜樹頭山修篁夾徑宜増植細草侵堦莫謾刪世慮紛然無止極敢求大藥駐衰顔客遊無頼阻重隂院落蕭條徑術深數畒林塘觀不厭一窓風雨坐相侵靈蚪尚有蟠泥跡老驥寜無越塊心多謝西家賢太守相招樂飲費千金題沈君湖山春曉圖詩卷迤邐沙堤接畫橋東風楊桞暗長條鶯随玉笛聲偏巧馬受金羈氣益驕舞榭歌䑓臨道路佛宫仙舘入雲霄西湖春色年年好底事詩翁歎寂寥東程䖏士故人不見十年餘鴻鴈南來得素書茶吐槍旗迷澗谷竹供編簡塞庭除詎容煉藥燒金䁀有待橫經校石渠江上繋舟将發去黄山回首重躊躇贈合部遇宗師逺俗超然百慮忘蒲團孤坐日偏長髙城靜數蓮花漏宻室頻燒栢子香古地神通周世外諸天雄猛侍階旁雜蕐義諦無窮盡願見菩提發寳光翰林楊仲弘詩卷第六終
