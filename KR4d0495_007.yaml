front:
  text: 翰林楊仲弘詩卷第七
  hash: sha256:a162ca3a30aab360ffffcc47a5c5379fd6610a9d9831376058db2f681d13817d
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0495_SBCK_007-1a}
body:
  text: 七言律詩舟次池陽偕通守周南翁燕表姪陳和卿家席上贈歌者故人相見話綢繆三日江干繫客舟高燕未䦨明月上艷歌初轉彩雲留光搖崖䗶寧知夜字寫邊鴻巳報秋底事尊前能盡醉為伊肯展翠眉愁簡松江汪知府君為郡守屢豐年能使歡聲塞市㕓泮水荐游聲甚美鈞金並入聽無偏漁河夜集千家網煮海朝凝萬竈烟賔客况聞才子盛詠歌宜屬後人傳夀姚國公可樂無如父母全既賢既貴又長年金壷賜出青雲上玉佩朝辭白日邊楚木論春猶五百蟠桃稱夀必三千似聞黃綺歸來後長向山中作地仙武當山張真人張公𬒳髮下山來欲為神州救旱災感召上天垂雨露指揮平地起風雷槁苗再發還堪刈枯木重榮不假裁受詔即思歸舊隱瓊樓玉殿繞崔嵬奉呈左司張元朴郎中上相登庸求佽助明公秉德動觀聽旗常大法藏清廟玉帛彌文薦外廷欲立高名垂宇宙須知雅量配江𬈑鯫生論事非朝董盡力還堪備使今贈惠山聖長老道人卓錫向名山路絶巖頭未易攀海上潮來風浩浩洞中雲出雨潺潺松柟直起參天碧苔蘚旁行匝地斑藉甚後人蒙法施有如流水注蒼灣寄曹雲西羡君卜宅逺紛龎長把絲綸釣大江粳稻色枯雲慘慘芰荷聲急雨淙淙消磨歲月書千卷傲睨乾坤酒一缸甫里當年遺帙在交鋒那肯竪幡降送師總𬋩使節南來寵渥新漢家京尹擇能臣金爐香暖迎丹詔玉陛霜清謁紫宸巳用嚴威摧酷吏更推仁政澤齊民知公夙抱經綸志多立功名繼古人題景德寺雲谷老師宜月軒月入中庭欲睡遲况逢秋夜特相宜十分隂魄凝中氣五色祥光溢上規影漬金杯須滿泛風生玉笛任橫吹老禪心地元虛寂更想髙簷獨坐時送趙伯常君如寶玉不磨礱吐氣騰騰作白虹外户將迎皆美士前途推挽必名公鵷行不獲朝參共燕坐猶能獻酢同我憶東歸心正切奮飛偏羡挾秋風重陽日作客中佳節罷登高獨坐悽然感二毛紫陌泥塗秋泊泊黑山風雨夜嘈嘈幽人侈有觀魚樂壯士慚無汗馬勞得喪古今都一律唯應痛飲讀離騷贈善畫沈處士繪畫時賢屢逼直謾于城市老間身孰知麋鹿臺前客解寫麒麟閣上人種樹十尋知閲世滋蘭百本喜逢春詩成有愧丹青引獨使曹劉敻絶塵送戴尊師入越躍馬年年塞北遊春風此日送歸舟山中樹老飛玄鶴江上莎長卧白鷗欲與謝公同隱逸肯容賀老獨風流山隂道士如相見沽取村醪醉未休簡李可度從來憲府擢群英攬轡雍容按百城鵰鶚逢時方厲疾豺狼避道敢縱橫每崇實政除民瘼肯假嚴威駭物情君有美才當進用竚聞雅譽逹神京贈戴醫推測隂陽術巳精研窮問難更通明山中說劒仍聞道市上懸壷即治生蛇為㗸珠知藥聖犬因䑛鼎驗丹成上醫醫國惟君可行載軺車入帝京贈王止善不見故人十年餘况復往來音問踈倐然携離事何限即此歡㑹情如初不愁官卑少俸粟第恐年長廢讀書隨群逐隊秪可厭秋風共釣長江魚次韻吳生見贈早入儒林衣鵠𫀆淋漓杯酒謾稱豪愁來客路烟沙逺夢斷仙山雪浪高魯望浮家名獨著君平賣卜志仍操和詩不足酬佳貺孰謂瓊瑶報木桃贈雲上人道人庭户閟烟霞誦習微文願力加萬法莊嚴充世界一音演說被河沙窗光盡日搖松葉履迹長年沒鮮花解后有言還契合𬗟思同㑹結龍華卜耕宋徴士古人命卜極精詳苟得神龜必寶藏分胃在天兼赤黑圖書隨地列圓方大而元氣求乖合細則人為驗否藏家食如君知此術耕耘何事竟凶穰送周用章君行萬里赴京師凛凛風霜及此時第挾簡編辭白屋遽承𫀆笏㑹丹墀宫花插帽知恩重御酒霑唇覺醉遲必有三篇侔賈傳上陳王道正民彛送陳堯卿之京師欲携三策扣天閽萬里程途未易論彈鋏幾年依客舍曳𥚑何處覔王門夜闌孤館聽殘漏春入長河辨舊痕文采似君宜得意要津何患少攀援登邵氏宜晚樓曽入明光捧御筵歸來山澤伴儒仙驅馳巳出紅塵表締構還依碧嶂前豁逹軒窗吞宇宙嵬峩梁棟接雲烟憑高眺望尤宜晚屏障橫開紫翠連呈馬昻夫僉院君為胄子入京都才望髙華世所無祕殿為郎監玉篆雄藩作守判銅符科條自可蘇民瘼議論還宜贊聖謨更倚覃懷功業盛峨峨天柱立坤隅次韻錢翼之有聲吳下頗多年長把漁竿釣海邊李賀才名過杜牧魯公書法繼張顛塵沙撲面驚吾老星宿蟠胸愧子賢歲晚著書言道妙青青林竹正宜編賦飛鴻送胡則大年年客裏見飛鴻成陳成行上碧空杳杳江湖尋故侣蕭蕭蘆葦下新叢翶翔巳出雲霄上飲啄寧來沼沚中今日似君歸去好扁舟一夜起東風賜宴謝恩恭承明詔策群英欲為斯民致太平孔孟教人先禮樂申韓操術尚刑名混同巳正千年統恆久方觀萬物情勿謂成周多吉士朝陽亦有鳯凰鳴送劉長卿張伯起二公歸閩中去來蹤跡固相違邂逅今朝共載歸欲效駏蛩俱北上復隨鴻鵠向南飛乍離江上芙蓉幕還著山中薜荔衣所羡二君才氣盛願聞玉屑吐霏霏奉美劉矦蘇白風流迹未賖賢矦相繼事堪誇史書日覽三千牘民版春登百萬家逰寺巳諳松下路泛舟頻醉桞邊沙要知為政多恩澤看取庭前丹桂花次韻蕭君用崔嵬出水翠雲浮舁轎拖舟豈厭遊澶漫渠河方涉夏蕭條竹樹巳迎秋銜杯興盡人先醉舞劒歌長客易愁八月江湖翻渤澥長竿更約與君投送殷國華之和州送君行李欲何如楚國蕭條戰伐餘西塞人州連草莾南江風浪入空虛遺民少作先王服故府徒存博士書舊事到今多泯滅好從黎老問從初遣興庭樹號蟬日巳凉塞雲橫鴈夜何長挾書萬里干明主仗劒三年别故鄊西北諸山連朔漠東南衆水隔荆揚淹留不去慚蘇子莫遣貂裘壓雪霜湖上秋郊縱步却驂驔勝事能多許客參如雪萬家收早稻未霜千樹著黃柑鼉鳴海上潮先湧猿呌山前霧欲含放浪漁樵元有處使人猶愛住江南贈沈子成學琴年少巳知名揮弄和柔指法精秋塞乍聞鴻鴈呌朝陽還聽鳯凰鳴幽人隱几中情適壯士投戈宿憤平此日有虞興至治南風一曲解同聲偕汪矦宴舟中中流畫鷁獨翶翔暫勒鳴騶駐岸傍風引錦帆衝野色波隨蘭棹泛晴光草涵宿潤珠璣滑麥漲春雲餅餌香何事乘槎之海上問津從此逹天潢偕鄭尊師飮余氏池亭池亭翼翼午風涼隔岸田疇穧麥香碧水千尋鷗蕩漾青天萬里鶴翶翔藏書不為傳孫子學道還宜應帝王獨行似君何可得結交晚歲獲裘羊竹所為余隱君作竒君負郭定幽居多植修篁數畒餘結實巳期棲鳯鳥垂綸仍欲釣鯨魚揭竿對户思排㦸截簡盈筐備寫書清響繁隂皆可愛炎天飛雪滿庭除贈月桂庭長老婆娑影滿一輪中普照人間不計功金色光明函世界玉毫相好現虛空開時已與羣芳異出處難將衆木同萬里青雲方得路遨逰願入廣寒宫送王仲致舍人歸閩中鳴騶擁道去翩翩欲詣閩中拜墓田伏虎為司樵牧禁蟠螭著代鼎彛鎸上公復世儀文備胄子承家問學專家舍驟興循制度大書史冊必流傳用左轄郝公詩韻寄曹雲西居士姓名燁燁冠清流處世還同貉一丘干木道髙寧仕魏子房身退尚封留靜依杉竹營書室深入蕖荷理釣舟乘興每思陪笑語揚帆萬頃泛清秋送劉希孟赴曹雲西招吳郡唯君善鼓琴曾于律吕用情深和聲細潤鶯遷木奏響清圓鶴在隂素習巳能除俗調靜聽真可禁邪心相知賴有曹居士為産從茲過十金送葉顯仁任衢州録吾鄊文雅舊彬彬再遇時清喜有人鳯沼巳聞繇衆選熊蹯無愧用賢賔橫經辨論超周列奉􅊾光華及老親姑蔑到家三百里告歸晨省莫辭頻暮春遊西湖北山愁耳偏工著雨聲好懷長恐負山行未辭花事駸駸盛正喜湖光淡淡晴倦憩客猶勤訪寺幽棲吾欲厭歸城緑疇桑麥盤櫻筍因憶離家恰歲更題夏氏濟饑詩卷木饑火旱際荒年百姓流離狀可憐往往富人心似鐡纍纍餓殍口生烟此時顆粒無沾丐是歲鄊都少棄捐天道神明加鑒在宜令夏氏子孫賢謝曹雲西菊聽鶴亭西處士家中園萬本值秋華擕鉏歲歲根株茂載酒時時興趣嘉已散曰英凝曉露更敷紅艷照晨霞新題料得篇章冨肯示同遊細細誇題沈氏東陽義孰並海蒼涼建學宫雲端百里現青紅東南多士題詩遍西北諸儒坐席通求道每加操守力明經深著討論功流傳後世光華盛事與南京戚氏同謝曹雲西寄菊花君種菊花兼五色能令秋日勝春時香浮盞斚和金屑光射園林列錦帷逺水波寒凝慘淡嚴霜節屇厭離披淵明去後踰千載猶有斯人把一枝寄無錫倅劉雄飛張景亮二史君閥閲俱高負美名共分符竹守江城帆檣密送遮天影鐘鼓遙傳動地聲木落西山愁歲晏禾登南畒慶秋成知君優政多恩惠側耳邦人頌太平次韻羅雲叔雪中見寄目前坑塹巳平填此日封姨復弄權略彴未通溪上路轒輼方陷漠南天寒侵兔窟愁山鬼凍合龍宫逼水仙堪羡廣文才力壯詩成並和轉清妍贈張相師縉紳往往識名流歲晏猶為汗漫逰自許唐生知蔡澤欲干季布禮曹丘囊詩價重聮珠玉匣劒芒寒射斗牛輦穀諸公爭致士江湖何事更淹留次韻汪復心主簿秋霜壓鬢似相陵喚父呼兄乍肯譍厭采黃花延醉客喜焚柏子待禪僧驟登臺閣期君可久困塵沙歎我曽二子說聞俱好學鵬程萬里羡飛騰送方天瑞釣臺山長富春江上釣臺髙傍築書堂處俊髦要為鄊閭施教化更因山水暢風騷虀鹽供養寧嫌薄朱墨研磨肯憚勞至日菊花黃滿地淋漓觴酒任君操髙沙朱山甫挽詩何勞閲市稅魚雞歸去山中樂舊棲瘦杖穿雲登峻嶺小舟乘月泛清溪無僧扣竹茶仍煮有客尋花酒亦携江海風流今已矣孤墳愁見草萋萋送高子盤初菴山長文行繇來著本根芳菲何異殖蘭蓀諸公籍籍多相許凡子區區不足論書館巳能更士習翰林併可代王言明年復應求賢詔必掇髙科奉帝軒題張氏順堂厥宗好德繇先世門內曽無害氣侵春鯉上盤雕白玉夏蠶登箔鑄黃金兒長愷悌求書帙女大妖妍弄繡針彼美堂名從此得固應長句為君吟遣興庸人往往慢吾曹汨沒空嗟命不遭死後欲留千載譽生前須作萬人豪倦遊關塞身將老悵望雲天興漫高却恨素無田二頃欲乘春雨蓻東臯用左轄郝公詩韻曹雲西居士羡君祕學治玄玄黃老遺文有自傳不與宛駒爭萬里漫隨遼鶴數千年橫編每欲論今古中酒何勞問聖賢甫里似聞粳稻熟舉家還泛五湖船題胡伯衡飛雲圖未應時命固相違千里遨遊久不歸巳占龍頭承紫詔更蘄馬首賜朱衣塵沙客路牽愁逺泉石家鄉入夢稀日夜思親心更切滄浪悵望白雲飛元日早朝次韻辛良史掖垣迢遞到城回魏闕嵯峨此日開赤芾㑹庭宵仗引朱輪爭道曉鐘催三泉忽報藏金甲萬歲徒聞獻玉杯樂奏象簫從此畢小臣思見鳯凰來歸至丹陽宿逆旅主人夢作燕子詩燕子歸來意何當羽毛初刷仍煌煌孔鸞相望不我與鷹隼有知那汝傷晴雲淑郁鳴上下春院芳華飛頡頏莫言帝力逺微物長發曽聞興彼商送吳真人具嚴威命領祠官歷祀名山不厭難上帝乘龍逰下土真人騎鶴降虛壇巳刋白玉為封檢更鑄黃金作祭冠國夀延洪千萬歲願祈穀熟小民安子紹重黎有大功父宜封建至三公絲綸詔下皇恩重黼黻衣成古禮崇視草乍聞辭玉府獻桃曽見到珠宫有闕文便與彭籛得夀同題貢氏秀野堂貢氏諸郎皆好學南湖舊有讀書堂波濤巳逐鯤鯨化霧雨猶聞虎豹藏隴上麥禾春娓娓谷中杉桂曉蒼蒼君卿雅有當時望八十能來佐漢皇次韻張仲實除日聞鵲奕世侯門能載德微如鳥鵲到今馴雕簷曉日鳴聲好緑樹春風鼓翼頻雲漢有愁天欲近昆岡見抵俗難親主人定有除書至貴爾先知及上春吳山晚眺山椒翬構四垂寬上相旌旗㑹覽觀傍近江湖天廣大上連星斗地清寒龍宫永鎖函書閟鳯嶺重嗟菀樹殘此際獨無雲蔽日正宜翹首望長安次克明韻贈劉時中循行郡國弗遲遲宣布新條及盛時民俗要令無狗盜人才今喜得牛醫窗間夜雨銷銀燭門外春雲壓彩旗左右湖山都未覺好分餘力治文辭潮潮頭初起壯何如如阜如岡乍有無高浪駕天龍出沒疾風吹樹鳥歡呼隂陽莫測機相軋朝夕初生信不渝海石向來誇水德巳應傾倒盡歸墟次韻袁德平苦雨二月雨霖無乃早園林誰復辨青紅浪花汨汨還登岸雲葉翻翻久亂空水落巖崕通鳥道墅流椔翳塞龍宫只今海上尤空闊碩踏浮槎逐釣翁遣興門前高桞緑紛紛戀靄晋烟晝不分雨砌芳菲晴後見風窗言語靜中聞桐花可作鳯凰食竹葉還成虎豹文但使此心無外慕卜居何日絶人羣雪急霰中宵響瓦塍寒光未曉入窗稜橫飛朔野威風壯盡壓西山氣概增蟻酒優歡唯弟共貂裘縱獵豈吾能如今何處堪遊目葛嶺浮圖最一層夏夜對月暑天煩倦唯酣寢薄暮登樓起宿痾簟報新秋涼意早窗開永夜月明多不眠孤鶴頻驚呌好事流螢屢見過安得泛舟江海上坐觀冰鏡落滄波送方仲永為重慶路校官君有英才世罕徒矯然如鶴在天衢長懷道藝干明主却恨衣冠纍巨儒愁裏論心相慰藉醉中發興共歌呼此行萬里官西蜀有問長因竹使符次韻劉時中見寄泥塗霄漢固難謀亦有元龍百尺樓籍籍圖書聊自適茫茫江海與誰遊但聞燕市能求馬肯向秦川輒飯牛富貴不才名盡滅未應摧沮恨淹留遣懷往歲銜杯意氣踈願隨童子誦詩書久荒靖節松三徑獨守楊雄宅一區春圃花殘收夏果海門潮落買江魚如今也足成吾趣何事王門作曳𥚑翰林楊仲弘詩卷第七終
