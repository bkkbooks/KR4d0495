front:
  text: 翰林楊仲弘詩卷第八
  hash: sha256:51b0cc4439a032ea64d046cd23d2c4dfd36ff50928252baf7bf0766b335a1064
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0495_SBCK_008-1a}
body:
  text: 五言絶句題高尚書竹石矯龍疑蒼筠踞虎肖白石倘乗風雲㑹變化那可測趙浚儀公竹石老竹倚危石比徳猶弟兄凌競度霜雪然後大節明王晋卿古木走根坼裂石曲幹漸清漣雷電忌交作化龍起重􅷧墨蘭謂香辭迫求曰色却媚愛執徳非固然何用結爲佩墨蕙與蘭大相似多花花蕋蕋在古象何人孤竹君二子題松雪翁墨竹蘅蘭倚修竹寂寞生幽谷比徳如夷齊扵此受命獨側石狀竒峭横竹枝扶踈猗蘭復叅立信哉徳不孤題墨竹四首爲鄭尊師作飲霧初泠泠沭雨還斾斾相從采真遊可作晤語對蔽日訝無影䟽風疑有聲移根來室中尚假筆墨精虛心可遊世直道難事人伯夷聖之清信哉徳有隣風味既澹泊顔色不娬媚孤生崖谷間有此凌雲氣畫竹二首翡翠含春霧琅玕振曉風清聲來枕上秀色入簾中萌芽成虎豹變節作蛟龍正直唯吾與清修必子從七言絶句客中即事漸覺星星兩鬢皤推愁不去柰愁何客中忘却春光度驚見前林嫩竹多終朝矻矻坐書帷春去春來緫不知恠得山禽如有意隔窓撩亂踏花枝㡬日懸懸雨不休客窓孤逈使人愁杜䳌啼切知何處坐對雲山萬木稠羙木千章遶故宫如烟如霧塞虚空路衝南北山岡斷披拂能来萬里風逺望潮頭出海來直衝西岸復東囬鴟夷萬古晋深恨如此波濤亦壮哉悼隣妓西子湖邊楊桞花随風飄泊到天涯青春遇着歸來燕㗸入當年王謝家金沙灘上觀音面刼火光中幻化身抱取摩尼却歸去天衣元不汚風塵一種腰肢分外妍雙眉畫作月姢姢春風吹破襄王夢行雨行雲若箇邊種桞圖連山斷岸古今同彷彿柴桑入望中爲問江邊枯桞樹飛花㡬度亂春風趙松雪畫蘭竹石石上蘭苕巳蔚然竹枝相間復姢姢正如王謝佳公子文采風流並世傳謾題都門㡬度見秋風楓柘連山樹樹紅江海此時囬首望黄花滿地酒樽空贈陳相士英豪無處覔知音奔走塵埃嘆陸沉他日預言當富貴相逢何惜贈千金江湖茫茫眼欲空㝷常貴賤相多同低頭強與時人語踪迹徒勞逐轉蓬棘林圖村北村南隔暮雲滿林黄葉亂紛紛楚江回首三千里過鴈如今不可聞沙鴈漠漠寒烟樹影㣲一行沙鴈背人飛江南江北秋将盡客子如今猶未歸題應中父所藏陳仲羙山水小景層巒疊嶂倚晴空松檜相連秀色同下有幽人茆屋在浩歌宜属紫芝翁扇上竹種竹何湏種萬竿一枝分影亦檀欒秋宵更受風披拂聴取清聲入夢寒題髙尚書墨竹尚書善畫名天下戯掃脩篁筆更竒何異𥙷陀巖石上雪霜摧折有殘枝聴琴圖繇來六律妙難知聖徳巍巍亦有師欲向琴中求至理想從虞舜五絃推讀碑圖老自負知無窮文藝兼求事事通獨忌楊矦才勝巳䧟身令入網羅中水仙花花似金盃薦玉盤炯然光照一庭寒世間復有雲梯子獻與嫦娥月裏看題雪竹圖飽經霜雪性堅強㧞起危梢百尺長大節挺然雖屈撓渾如宋璟立班行題風竹圖屋後屋前皆種竹中宵無柰朔風號似維舟楫滄江上裂岸崩崖聴怒濤題息齋竹老節嚴嚴若自持翛然分影覆堦墀此君不受纎塵汚更看清朝雨過時雷泉石崖深處有潜龍奮起春雷不見蹤自此白雲山下路流泉一道響淙淙次韻康子山舎人兼旬風雨氣寒涼院落幽深草木長却喜今年多夏果碧苞丹實滿林香欲賞秋花色巳涼碧雲散盡楚天長姮娥舊種無多樹何故人間有此香題鍾吕傳道圖濟世曽聞有大才超然脫屣去塵埃劒光昱昱今何在上下乗龍戯九垓到京師城雪初消薺菜生角門深巷少人行桞梢聴得黄鸝語此是春來第一聲送人客路逢春雪乍消眼前愁思轉相撩垂楊染作黄金色舞遍東風萬萬條金溝河上始通流海子橋邊䌓客舟却到江南春水漲拍天波浪泛輕鷗畫竹石竹前恠石起參差篁竹叢深使客疑如過瀟湘江上路鷓鴣啼罷日西時息齋道人能畫竹攬結造化歸毫端偶從𥿄上得一箇大勝渭川栽萬竿宿浚儀公湖亭四首夜宿湖亭水氣涼四更風露濕衣裳空濛霧重前山暗屋角斜明是月光兩兩三三白鳥飛背人斜去落漁磯雨餘不遣濃雲散猶向前山擁翠㣲㡬年鄕夢隔江湖此日登臨興不孤小艇欲行無逺近不愁歸醉要人扶能文亦有張公子徃歲俄加道士衣載酒白雲山下路擬将毫翰與同揮題十二紅卷子碧桃枝上有珎禽調舌交交聴好音畫出江南春意思明年携酒共追㝷題巨然秋山山石嵯峨樹老蒼筆端描邈辨毫芒從来名下無虛士可與荆關作鴈行題鄭子貞畫像外姓爭權國必危若人有道獨前知倘縁辟召登朝著忍見他年漢鼎移躬耕谷口雜編民寜肯懐金媚賊臣楊子觧言如許事不知執㦸是何人次韻陳又新真人北上驛騎翩翩秪蹔歸夀觴捧罷戀慈闈秋風萬里關河道回首那堪翔鴈飛贈高如山江行瞩望多竒絶疊璧重崖翠倚空此日如山相邂逅皓然秋鬢一衰翁題畫兎呈馬伯庸學士姮娥乞與長生藥自可騰空入月中竊食草間多利害飢鷹奮擊待秋風喜晴樓外斜陽放晚晴街衢前後聴歡聲廻舟更倚南風順千里青山照眼明題廣寒龍先生詩卷匡廬山下有仙翁夀與乹坤配始終記得霓裳羽衣曲此身曽入廣寒宫人事休祥靡不知道高曽作帝王師龍顔大恱承天寵長記麻衣上殿時古來聞有列仙儒栖宿巖巒道味腴度世直湏功行滿乗龍飛去侍清都題倪御史墨帖官府移文存大略僧家常住守清規秪令坐奪齊人食嘆息浮屠亦少衰唐季朝衘亦漫加長憂羣盗亂如麻子孫奕葉猶昌熾知是當年積善家紀夢四面青山擁翠㣲樓䑓相向闢天扉夜闌毎作遊仙夢月滿瓊田萬鶴飛紛紛鸞鶴滿虚空耳畔如聞度海風直上雲霄千萬里此身飛入紫㣲宫題温日觀葡萄老禪嗜酒醉不醒強坐虚櫩寫清影興来擲筆意茫然落葉滿庭秋月冷醉中捉筆兩眼花倚簷架子欹復斜翠藤盤屈那可辨但見滿𥿄生龍蛇題墨竹嶰谷隂寒石如鐡二龍僵立露骨節春雷動地萬物活畏汝飛騰衝石裂攅青聚緑生巖幽海濤聲引風䬙䬙年年三伏林下卧白晝憀慄如深秋用韻送徳陽入越爲贅壻從來浪迹信流槎始至山隂便作家不與淮王援桂樹應随越女採荷花輕霞薄霧詰朝晴岸桞江梅着樹明更向若耶溪上聴傍人歌唱盡春聲次韻子正雪中雜興天公何事又飛花欲以文章起作家坐想玉堂風味在赤銅官鼎試春茶舊說曽城玉爲樹千樹萬樹遶仙家又湏天上春風早想見飄零如此花姑射仙人玉佩裳周流天地有輝光但令糓熟不疵癘未受人間黍稷香寂寞寒儒半畒宫堆瓊積玉未爲窮向來得此成竒觀一任衡門動健風題子行所藏魚藻圖畫出鯈魚戯緑漪羣分小白更相随主人真得蒙荘趣視此洋洋樂可知題宣和畫爵蕞然徴命出蓬蒿飛躍無踰數仞高阿閤鳯凰行此畫渠能使聖躬勞一爵翩然飛且鳴翎毛嘴瓜若天成遼陽一徃無消息猶得人間着畫名次韻雪若有神人爲散花徃來揮灑任横斜乗龍忽忽行天上何不斯湏過我家初上衣𥚑細細花老松俄頃半枝斜高林窮谷無行徑敗壁頽簷有住家砑光㡌子舞山花吹落曽城萬仞斜安得飈輪爲蕞然徴命出蓬蒿飛躍無踰數仞高阿閤鳯凰行此畫渠能使聖躬勞一爵翩然飛且鳴翎毛嘴瓜若天成遼陽一徃無消息猶得人間着畫名次韻雪若有神人爲散花徃來揮灑任横斜乗龍忽忽行天上何不斯湏過我家初上衣𥚑細細花老松俄頃半枝斜高林窮谷無行徑敗壁頽簷有住家砑光㡌子舞山花吹落曽城萬仞斜安得飈輪爲我駕一時飛到列仙家題曽氏墳山詩漫漫平田一望中前山突起勢穹崇千年留得孤墳在秪爲州人敬魯公題三生圖一生曽歴萬生多貴賤賢愚變㡬何更向此身存業識茫茫大刼詎消磨雲林雨霽圖爲瞿澤民賦麗澤乗時灑八荒歸雲杉抄尚悠揚齊民亦有豐年望豈但陳陳問太倉山谷帖古來君子重親親欣戚相扵此意真再拜先賢遺墨在弟兄闘䦧是何人趙承㫖帖書名世仰浚儀公望重朝廷品秩隆今日後生思倣傚臨池湏費十年功陽關圖咸陽西距玉門關萬里征人憚徃還此别尊前湏盡醉相逢俱是鬢毛斑春山圖春山流水暗㳙㳙發歛朝雲與暮烟更茸竒峰千萬仞不愁無處學神仙集虛虛室還能致吉祥唯嫌六鑿互相攘百神受命皆來舎豈假乗雲入帝郷偶題巨木埋根數百年蔚然蒼翠上叅天不歸宫闕充梁棟也作龍舟濟大川海上雲來徧地隂波間漏日瀉黄金水車倦踏傷淫潦無柰連天雨正深畫枇杷四月江南盧橘熟離離佳實滿枝黄丹青偶向圖中見漬蜜猶思配一觴偶題藏名匿迹黄塵中日抱書案心冥濛墻頭花變兩三色又是一年㸔春風清溪霧擁春郊白晝昬清溪路斷客銷魂更憐把釣衝風雨欲與漁翁共一樽喜晴簷外喧喧雀報晴夕陽猶照小窓明廻舟更倚南風順要聴田家打麥聲題沙緫𬋩屏風驚濤奔衝山震動靈液滲灑樹滋長襲肌或怯寒吹揺入耳如聞怒雷響畫馬天家狙狡骨骼竒朝飲暮秣必以時世無造父能駕馭直欲弄影舞瑶池翰林楊仲弘詩卷之八終
