front:
  text: 翰林楊仲弘詩卷第八
  hash: sha256:51b0cc4439a032ea64d046cd23d2c4dfd36ff50928252baf7bf0766b335a1064
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0495_SBCK_008-1a}
body:
  text: 五言絶句題高尚書竹石矯龍疑蒼筠踞虎肖白石倘乘風雲㑹變化那可測趙浚儀公竹石老竹倚危石比德猶弟兄凌競度霜雪然後大節明王晋卿古木走根坼裂石曲幹漸清漣雷電忌交作化龍起重􅷧墨蘭謂香辭迫求曰色却媚愛執德非固然何用結為佩墨蕙與蘭大相似多花花蕊蕊在古象何人孤竹君二子題松雪翁墨竹蘅蘭倚修竹寂寞生幽谷比德如夷齊于此受命獨側石狀竒峭橫竹枝扶踈猗蘭復參立信哉德不孤題墨竹四首為鄭尊師作飲霧初泠泠沭雨還斾斾相從采真遊可作晤語對蔽日訝無影疏風疑有聲移根來室中尚假筆墨精虛心可遊世直道難事人伯夷聖之清信哉德有鄰風味既淡泊顔色不嫵媚孤生崖谷間有此凌雲氣畫竹二首翡翠含春霧琅玕振曉風清聲來枕上秀色入簾中萌芽成虎豹變節作蛟龍正直唯吾與清修必子從七言絶句客中即事漸覺星星兩鬢皤推愁不去奈愁何客中忘却春光度驚見前林嫩竹多終朝矻矻坐書帷春去春來總不知怪得山禽如有意隔窗撩亂踏花枝幾日懸懸雨不休客窗孤逈使人愁杜䳌啼切知何處坐對雲山萬木稠美木千章繞故宫如烟如霧塞虛空路衝南北山岡斷披拂能來萬里風逺望潮頭出海來直衝西岸復東回鴟夷萬古晋深恨如此波濤亦壯哉悼鄰妓西子湖邊楊桞花隨風飄泊到天涯青春遇著歸來燕㗸入當年王謝家金沙灘上觀音面劫火光中幻化身抱取摩尼却歸去天衣元不汚風塵一種腰肢分外妍雙眉畫作月姢姢春風吹破襄王夢行雨行雲若箇邊種桞圖連山斷岸古今同倣佛柴桑入望中為問江邊枯桞樹飛花幾度亂春風趙松雪畫蘭竹石石上蘭苕巳蔚然竹枝相間復姢姢正如王謝佳公子文采風流並世傳謾題都門幾度見秋風楓柘連山樹樹紅江海此時回首望黃花滿地酒樽空贈陳相士英豪無處覔知音奔走塵埃嘆陸沉他日預言當富貴相逢何惜贈千金江湖茫茫眼欲空尋常貴賤相多同低頭強與時人語踪迹徒勞逐轉蓬棘林圖村北村南隔暮雲滿林黃葉亂紛紛楚江回首三千里過鴈如今不可聞沙鴈漠漠寒烟樹影微一行沙鴈背人飛江南江北秋將盡客子如今猶未歸題應中父所藏陳仲美山水小景層巒疊嶂倚晴空松檜相連秀色同下有幽人茆屋在浩歌宜屬紫芝翁扇上竹種竹何須種萬竿一枝分影亦檀欒秋宵更受風披拂聽取清聲入夢寒題髙尚書墨竹尚書善畫名天下戲掃修篁筆更竒何異𥙷陀巖石上雪霜摧折有殘枝聽琴圖繇來六律妙難知聖德巍巍亦有師欲向琴中求至理想從虞舜五絃推讀碑圖老自負知無窮文藝兼求事事通獨忌楊矦才勝巳陷身令入網羅中水仙花花似金杯薦玉盤炯然光照一庭寒世間復有雲梯子獻與嫦娥月裏看題雪竹圖飽經霜雪性堅強拔起危梢百尺長大節挺然雖屈撓渾如宋璟立班行題風竹圖屋後屋前皆種竹中宵無奈朔風號似維舟楫滄江上裂岸崩崖聽怒濤題息齊竹老節嚴嚴若自持翛然分影覆階墀此君不受纎塵汚更看清朝雨過時雷泉石崖深處有潜龍奮起春雷不見蹤自此白雲山下路流泉一道響淙淙次韻康子山舍人兼旬風雨氣寒涼院落幽深草木長却喜今年多夏果碧苞丹實滿林香欲賞秋花色巳涼碧雲散盡楚天長姮娥舊種無多樹何故人間有此香題鍾吕傳道圖濟世曽聞有大才超然脫屣去塵埃劒光昱昱今何在上下乘龍戲九垓到京師城雪初消薺菜生角門深巷少人行桞梢聽得黃鸝語此是春來第一聲送人客路逢春雪乍消眼前愁思轉相撩垂楊染作黃金色舞遍東風萬萬條金溝河上始通流海子橋邊繁客舟却到江南春水漲拍天波浪泛輕鷗畫竹石竹前怪石起參差篁竹叢深使客疑如過瀟湘江上路鷓鴣啼罷日西時息齊道人能畫竹攬結造化歸毫端偶從𥿄上得一箇大勝渭川栽萬竿宿浚儀公湖亭四首夜宿湖亭水氣涼四更風露濕衣裳空濛霧重前山暗屋角斜明是月光兩兩三三白鳥飛背人斜去落漁磯雨餘不遣濃雲散猶向前山擁翠微幾年鄉夢隔江湖此日登臨興不孤小艇欲行無逺近不愁歸醉要人扶能文亦有張公子往歲俄加道士衣載酒白雲山下路擬將毫翰與同揮題十二紅卷子碧桃枝上有珍禽調舌交交聽好音畫出江南春意思明年携酒共追尋題巨然秋山山石嵯峨樹老蒼筆端描邈辨毫芒從來名下無虛士可與荆關作鴈行題鄭子貞畫像外姓爭權國必危若人有道獨前知倘緣辟召登朝著忍見他年漢鼎移躬耕谷口雜編民寧肯懷金媚賊臣楊子解言如許事不知執㦸是何人次韻陳又新真人北上驛騎翩翩秪暫歸夀觴捧罷戀慈闈秋風萬里關河道回首那堪翔鴈飛贈高如山江行矚望多竒絶疊璧重崖翠倚空此日如山相邂逅皓然秋鬢一衰翁題畫兔呈馬伯庸學士姮娥乞與長生藥自可騰空入月中竊食草間多利害飢鷹奮擊待秋風喜晴樓外斜陽放晚晴街衢前後聽歡聲回舟更倚南風順千里青山照眼明題廣寒龍先生詩卷匡廬山下有仙翁夀與乾坤配始終記得霓裳羽衣曲此身曽入廣寒宫人事休祥靡不知道高曽作帝王師龍顔大恱承天寵長記麻衣上殿時古來聞有列仙儒栖宿巖巒道味腴度世直須功行滿乘龍飛去侍清都題倪御史墨帖官府移文存大略僧家常住守清規秪令坐奪齊人食嘆息浮屠亦少衰唐季朝銜亦漫加長憂羣盜亂如麻子孫奕葉猶昌熾知是當年積善家紀夢四面青山擁翠微樓臺相向闢天扉夜闌每作遊仙夢月滿瓊田萬鶴飛紛紛鸞鶴滿虛空耳畔如聞度海風直上雲霄千萬里此身飛入紫微宫題溫日觀葡萄老禪嗜酒醉不醒強坐虛櫩寫清影興來擲筆意茫然落葉滿庭秋月冷醉中捉筆兩眼花倚簷架子欹復斜翠藤盤屈那可辨但見滿𥿄生龍蛇題墨竹嶰谷隂寒石如鐡二龍僵立露骨節春雷動地萬物活畏汝飛騰衝石裂攢青聚緑生巖幽海濤聲引風䬙䬙年年三伏林下卧白晝憀栗如深秋用韻送德陽入越為贅壻從來浪迹信流槎始至山隂便作家不與淮王援桂樹應隨越女採荷花輕霞薄霧詰朝晴岸桞江梅著樹明更向若耶溪上聽傍人歌唱盡春聲次韻子正雪中雜興天公何事又飛花欲以文章起作家坐想玉堂風味在赤銅官鼎試春茶舊說曽城玉為樹千樹萬樹繞仙家又須天上春風早想見飄零如此花姑射仙人玉佩裳周流天地有輝光但令穀熟不疵癘未受人間黍稷香寂寞寒儒半畒宫堆瓊積玉未為窮向來得此成竒觀一任衡門動健風題子行所藏魚藻圖畫出鯈魚戲緑漪羣分小白更相隨主人真得蒙莊趣視此洋洋樂可知題宣和畫爵蕞然徴命出蓬蒿飛躍無踰數仞高阿閣鳯凰行此畫渠能使聖躬勞一爵翩然飛且鳴翎毛嘴瓜若天成遼陽一往無消息猶得人間著畫名次韻雪若有神人為散花往來揮灑任橫斜乘龍忽忽行天上何不斯須過我家初上衣𥚑細細花老松俄頃半枝斜高林窮谷無行徑敗壁頽簷有住家砑光帽子舞山花吹落曽城萬仞斜安得飈輪為蕞然徴命出蓬蒿飛躍無踰數仞高阿閣鳯凰行此畫渠能使聖躬勞一爵翩然飛且鳴翎毛嘴瓜若天成遼陽一往無消息猶得人間著畫名次韻雪若有神人為散花往來揮灑任橫斜乘龍忽忽行天上何不斯須過我家初上衣𥚑細細花老松俄頃半枝斜高林窮谷無行徑敗壁頽簷有住家砑光帽子舞山花吹落曽城萬仞斜安得飈輪為我駕一時飛到列仙家題曽氏墳山詩漫漫平田一望中前山突起勢穹崇千年留得孤墳在秪為州人敬魯公題三生圖一生曽歷萬生多貴賤賢愚變幾何更向此身存業識茫茫大劫詎消磨雲林雨霽圖為瞿澤民賦麗澤乘時灑八荒歸雲杉抄尚悠揚齊民亦有豐年望豈但陳陳問太倉山谷帖古來君子重親親欣戚相于此意真再拜先賢遺墨在弟兄鬪䦧是何人趙承㫖帖書名世仰浚儀公望重朝廷品秩隆今日後生思倣效臨池須費十年功陽關圖咸陽西距玉門關萬里征人憚往還此别尊前須盡醉相逢俱是鬢毛斑春山圖春山流水暗㳙㳙發斂朝雲與暮烟更茸竒峰千萬仞不愁無處學神仙集虛虛室還能致吉祥唯嫌六鑿互相攘百神受命皆來舍豈假乘雲入帝鄉偶題巨木埋根數百年蔚然蒼翠上參天不歸宫闕充梁棟也作龍舟濟大川海上雲來遍地隂波間漏日瀉黃金水車倦踏傷淫潦無奈連天雨正深畫枇杷四月江南盧橘熟離離佳實滿枝黃丹青偶向圖中見漬蜜猶思配一觴偶題藏名匿迹黃塵中日抱書案心冥濛墻頭花變兩三色又是一年看春風清溪霧擁春郊白晝昏清溪路斷客銷魂更憐把釣衝風雨欲與漁翁共一樽喜晴簷外喧喧雀報晴夕陽猶照小窗明回舟更倚南風順要聽田家打麥聲題沙總𬋩屏風驚濤奔衝山震動靈液滲灑樹滋長襲肌或怯寒吹搖入耳如聞怒雷響畫馬天家狙狡骨骼竒朝飲暮秣必以時世無造父能駕馭直欲弄影舞瑶池翰林楊仲弘詩卷之八終
