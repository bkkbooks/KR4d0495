  - {type: variant, offset: 959, length: 1852, content: 次方韶父遊九鎻山韻桶底圖次韻景逺學士送淳安徐教諭贈季尊師大古雪胡氏刺虎圖溪山積雪圖偕虞伯生魏池燕分韻題温日觀葡萄金壇宋氏自怡軒澗松劉將軍詩古木東山詩爲葉子實賦題恒齋次張仲實韻題文丞相書塞上曲邑中南峰義莊偶題夢讀韓退之詩雪後次韻鄭集之次韻劉師魯夏夜用田郎中韻橘中篇次韻袁伯長題屏風商山四老李御史之陜遣興偶作書懐寄杜原父黃天祥衍數題史仲憲修三皇廟贈無極上人贈執中允上人靈龜篇卷第二五言律詩送凌吉叟初陽䑓望月次韻方韶卿寄劉師魯龍井贈吾子行東陽十題送屠存博渡江寄俞仲連題雙峰樵隠贈方韶父和孟東野送方韶父先軰遊五湖卷第三五言律詩題羅氏别業次韻江行酬吾子行送孫大方歸朝元宫宜逺樓饒國呉文康公挽詩題張氏順堂題信州先天觀圖次韻題蘭竹贈程景純思菴赤璧圖贈昌上人送葉彦中之官行䑓送胡秀才歸新安惠崇古木寒鴉留别陳益謙逰陳氏園挽艾䖏士顧氏義塾挽呉道士送林季羽入京三首送徐義父入京贈曇上人贈胡汲古中秋挽曹光益贈劉時中二首送王元禮歸平城贈張之翰二首送陳君佐二首宿延祥觀有感題野清堂送張宣撫使嶺南喜雪酬康院使送李侍郎使安南送呉清叔贈鄭尊師黄櫟杖爲龔聖與作次韻夏仲勉二首冬至次韻張宣撫送呉清叔歸婺與方韶卿望月孝思亭淨香亭二首酬吾子行偶作送劉明卿歸安東和張仲實舟行韻題秋江釣月詩卷卷第四五言律詩夀姚承㫖贈周景逺學士夀杜尊師次韻曹士開毗陵喜雨春雪次陳元之韻送張仲實之宜興送丘子正之海鹽贈班彦功燕岳氏溪堂次韻黄子乆喜晴用韻贈黃子乆寄王繼學二十韻送完者都同知贈郭集賢悠然閣寄周御史二十韻送董與可送朱復之邵武教授趙彦祥母八十雲江圖爲劉宗師作題康里氏家譜題王叅政積翁詩卷贈魏虛舟少府贈劉平叔郎中送丘子正之海鹽贈虞彦高鄭中丞母八十送朱仲山歲貢入官招真觀圖喜晴得楊字呈汪知府寄沈少㣲挽徐處士送矦尊師歸蜀春晚喜晴卷第五七言古詩次韻虞彦高送俞用中之蓮城古墻行題山石猿鳥圖李伯時畫浴馬圖送時中兄入京次韻題浪紋石題王起宗畫松岩圖題蕐岳山城圖神馬歌次韻陳元之古劒歌梅梁歌題趙千里山水題秋雨長吟圖竹樹圖時中獨輪車圖卷第六七言律詩宗陽宫望月次韻錢唐懷古四首題豐樂樓水樂洞題拱北樓次韻羅雲叔紅梅紀夢次韻陳子仁黃河二首遊水樂洞分韻望海送羅雲叔歸山中送叚時敏之京留别京師柬蕭伯善萬户送句曲外史張君送康里尚書贈同院諸公玉堂夜直惠山泉寄維揚賈侯寄康大夫送伯長扈駕寄袁伯長東湖四景爲王本齋賦和虞待制魏録事即事次韻袁伯長待制送薛玄卿歸龍虎山送虞貞白春雨徐獨清挽詩寄武當山張真人題火渉同知像次韻田師孟西曹卽事次韻黃子乆鷗波亭阻雨懐錢唐故人寄吏部張尚書題謝疊山遺墨題本齋王公畫像寄題萬竹軒送范徳機送鄭子謙贈彭萬里七月十九日大明殿早朝酬賈郎中雷江阻風寄周南翁送王仲儀點義倉即事體覆木綿過樂平偶賦題楊指揮樂善堂次韻張真人碧桃江上過安慶城下呈李判官寓長春道院即事題沈君湖山春曉圖柬程處士贈合部遇宗師卷第七七言律詩舟次池陽贈歌者簡松江汪知府夀國公武當山張真人奉呈左司張元朴贈惠山盛長老寄曹雲西送師緫管題景徳寺宜月軒送趙伯常重陽日作贈善畫沈處士送戴尊師入越簡李可度贈戴鍳贈王止善次韻呉生見贈贈雲上人卜耕宋徴士送周用章送陳堯卿之京登邵氏宜晚樓呈馬昻夫僉院次韻錢翼之賦飛鴻送胡則大賜宴謝恩送劉長卿張伯起奉羙劉侯次韻蕭君用送殷國華之和州遣興湖上贈沈子成偕汪矦宴舟中偕鄭尊師飲余氏竹所爲余隠君作贈月桂庭長老送汪仲致舎人歸閩中用左轄郝公韻送劉希孟赴曹雲西招送葉顯仁録事暮春逰西湖北山題夏氏濟飢詩卷謝曹雲西菊題沈氏義塾謝曹雲西寄菊寄無錫劉張二君次韻羅雲叔雪中見寄贈張相士次韻汪復心主簿送方天瑞山長高沙朱山甫挽詩送汪子盤山長題張氏順堂遣興用郝左轄韻贈曹雲西題胡伯衡飛雲圖元日早朝次韻辛良史歸至丹陽送呉真人二首題貢氏秀野堂次韻張仲實除日聞鵲呉山晚眺次克明韻贈劉時中潮次韻袁徳平苦雨遣興雪夏夜對月一送方永爲重慶校官次韻劉時中見寄遣懐卷第八五言絶句題髙尚書竹石王晋卿古木墨蘭墨蕙題松雪墨竹題墨竹四首畫竹二首七言絶句客中即事五首悼隣妓種桞圖趙松雪畫蘭竹石漫題贈陳相士棘林圖沙鴈題應中父山水圖扇上竹題髙尚書墨竹聴琴圖讀碑圖題水仙花題雪竹圖題風竹圖題息齋竹雷泉次韻康子山題鍾吕傳道圖到京師送人畫竹石宿浚儀公湖亭四首題十二紅卷子題巨然秋山題鄭子真畫像次韻陳又新真人贈髙如山題畫兎呈馬伯庸學士喜晴題廣寒龍先生詩卷題倪御史墨帖紀夢題温日觀葡萄題墨竹用韻送徳陽次韻子正雪中雜興題子行魚藻圖題宣和畫爵二首次韻雪三首題曽氏墳山詩題三生圖雲林雨霽圖山谷帖趙承㫖帖陽關圖春山圖集虛偶題畫枇杷偶題清溪喜晴題沙緫管屏風畫馬翰林楊仲弘詩目録終, WYG: ''}
