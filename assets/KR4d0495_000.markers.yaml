  - {type: variant, offset: 4, length: 0, content: '', WYG: 國史院編修官調海船萬户府照磨㑹仁宗復行科舉之制遂登延祐二年進士授饒州路同知浮梁州事終于寧國路總管府推官事蹟具元史儒學傳焦竑國史經籍志載楊載仲宏集四巻此本八巻不知何人所分元代詩人世推虞楊范掲史稱其文章一以氣為主而于詩尤有法度自其詩出一洗宋季之陋云云葢宋代詩派凡數變西崑傷于雕琢一變而為元祐之朴雅元祐傷于平易一變而為江西之生新南渡以後江西宗派盛極而衰江湖諸人欲變之而力不勝于是仄徑旁行相率而為瑣屑寒陋宋詩于是掃地矣載生于詩道弊壊之後窮極而變乃復其始風規雅贍雍雍有元祐之遺音史之所稱固非溢美故清思不及范梈秀韻不及掲傒斯權竒飛動尤不及虞集而四家並稱終無怍色葢以此也都穆南濠詩話曰楊孟載詩律精􅋀其追和李義山無題五首詞意兼到真義山之勍敵瞿宗吉歸田詩話曰}
