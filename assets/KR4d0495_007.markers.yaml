  - {type: variant, offset: 0, length: 4570, content: 翰林楊仲弘詩卷第七七言律詩舟次池陽偕通守周南翁燕表姪陳和卿家席上贈歌者故人相見話綢繆三日江干繫客舟高燕未䦨明月上艶歌初轉彩雲留光揺崖䗶寜知夜字寫邊鴻巳報秋底事尊前能盡醉爲伊肯展翠眉愁簡松江汪知府君爲郡守屢豐年能使歡聲塞市㕓泮水荐游聲甚羙鈞金並入聴無偏漁河夜集千家網煑海朝凝萬竈烟賔客况聞才子盛詠歌宜属後人傳夀姚國公可樂無如父母全既賢既貴又長年金壷賜出青雲上玉佩朝辭白日邊楚木論春猶五百蟠桃稱夀必三千似聞黄綺歸來後長向山中作地仙武當山張真人張公𬒳髪下山來欲爲神州救旱災感召上天垂雨露指揮平地起風雷槁苗再發還堪刈枯木重榮不假裁受詔即思歸舊隠瓊樓玉殿繞崔嵬奉呈左司張元朴郎中上相登庸求佽助明公秉徳動觀聴旂常大法藏清廟玉帛彌文薦外廷欲立高名垂宇宙湏知雅量配江𬈑鯫生論事非晁董盡力還堪備使今贈惠山聖長老道人卓錫向名山路絶巖頭未易攀海上潮來風浩浩洞中雲出雨潺潺松柟直起叅天碧苔蘚旁行匝地斑藉甚後人蒙法施有如流水注蒼灣寄曹雲西羡君卜宅逺紛龎長把絲綸釣大江秔稲色枯雲慘慘芰荷聲急雨淙淙消磨歲月書千卷傲睨乹坤酒一缸甫里當年遺帙在交鋒那肯竪幡䧏送師緫𬋩使節南來寵渥新漢家京尹擇能臣金爐香暖迎丹詔玉陛霜清謁紫宸巳用嚴威摧酷吏更推仁政澤齊民知公夙抱經綸志多立功名繼古人題景徳寺雲谷老師宜月軒月入中庭欲睡遲况逢秋夜特相宜十分隂魄凝中氣五色祥光溢上規影漬金盃湏滿汎風生玉笛任横吹老禪心地元虚寂更想髙簷獨坐時送趙伯常君如寳玉不磨礱吐氣騰騰作白虹外户将迎皆羙士前途推挽必名公鵷行不獲朝叅共燕坐猶能獻酢同我憶東歸心正切奮飛偏羡挾秋風重陽日作客中佳節罷登高獨坐悽然感二毛紫陌泥塗秋泊泊黒山風雨夜嘈嘈幽人侈有觀魚樂壮士慚無汗馬勞得䘮古今都一律唯應痛飲讀離騷贈善畫沈䖏士繪畫時賢屢逼直謾扵城市老間身孰知麋鹿䑓前客觧寫麒麟閣上人種樹十㝷知閱世滋蘭百本喜逢春詩成有愧丹青引獨使曹劉夐絶塵送戴尊師入越躍馬年年塞北遊春風此日送歸舟山中樹老飛玄鶴江上莎長卧白鷗欲與謝公同隠逸肯容賀老獨風流山隂道士如相見沽取村醪醉未休簡李可度從來憲府擢群英攬轡雍容按百城鵰鶚逢時方厲疾豺狼避道敢縱横每崇實政除民瘼肯假嚴威駭物情君有羙才當進用竚聞雅譽逹神京贈戴毉推測隂陽術巳精研窮問難更通明山中說劒仍聞道市上懸壷即治生蛇爲㗸珠知藥聖犬因䑛鼎驗丹成上毉毉國惟君可行載軺車入帝京贈王止善不見故人十年餘况復徃來音問踈倐然携離事何限即此歡㑹情如初不愁官卑少俸粟第恐年長廢讀書随群逐隊秪可厭秋風共釣長江魚次韻呉生見贈早入儒林衣鵠𫀆淋漓杯酒謾稱豪愁來客路烟沙逺夢斷仙山雪浪高魯望浮家名獨著君平賣卜志仍操和詩不足酬佳貺孰謂瓊瑶報木桃贈雲上人道人庭户閟烟霞誦習㣲文願力加萬法荘嚴充世界一音演說被河沙窓光盡日揺松葉履迹長年沒鮮花觧后有言還契合𬗟思同㑹結龍蕐卜畊宋徴士古人命卜極精詳苟得神龜必寳藏分胃在天兼赤黒圖書随地列圓方大而元氣求乖合細則人爲驗否藏家食如君知此術耕耘何事竟凶穰送周用章君行萬里赴京師凛凛風霜及此時第挾簡編辭白屋遽承𫀆笏㑹丹墀宫花挿㡌知恩重御酒霑唇覺醉遲必有三篇侔賈傳上陳王道正民彛送陳堯卿之京師欲携三策扣天閽萬里程途未易論彈鋏㡬年依客舎曳𥚑何處覔王門夜闌孤舘聴殘漏春入長河辨舊痕文采似君宜得意要津何患少攀援登邵氏宜晚樓曽入明光捧御筵歸來山澤伴儒仙驅馳巳出紅塵表締構還依碧嶂前豁逹軒窓吞宇宙嵬峩梁棟接雲烟憑高眺望尤宜晚屏障横開紫翠連呈馬昻夫僉院君爲胄子入京都才望髙蕐世所無秘殿爲郎監玉篆雄藩作守判銅符科條自可甦民瘼議論還宜賛聖謨更倚覃懐功業盛峨峨天柱立坤隅次韻錢翼之有聲呉下頗多年長把漁竿釣海邊李賀才名過杜牧魯公書法繼張顛塵沙撲面驚吾老星宿蟠胸愧子賢歲晚著書言道妙青青林竹正宜編賦飛鴻送胡則大年年客裏見飛鴻成陣成行上碧空杳杳江湖尋故侣蕭蕭蘆葦下新樷翶翔巳出雲霄上飲啄寜來沼沚中今日似君歸去好扁舟一夜起東風賜宴謝恩恭承明詔策群英欲爲斯民致太平孔孟教人先禮樂申韓操術尚刑名混同巳正千年統恒乆方觀萬物情勿謂成周多吉士朝陽亦有鳯凰鳴送劉長卿張伯起二公歸閩中去來蹤跡固相違邂逅今朝共載歸欲效駏蛩俱北上復随鴻鵠向南飛乍離江上芙蓉幕還着山中薜荔衣所羡二君才氣盛願聞玉屑吐霏霏奉羙劉矦蘇白風流迹未賖賢矦相繼事堪誇史書日覽三千牘民版春登百萬家逰寺巳諳松下路泛舟頻醉桞邊沙要知爲政多恩澤㸔取庭前丹桂花次韻蕭君用崔嵬出水翠雲浮舁轎拖舟豈厭遊澶漫渠河方渉夏蕭條竹樹巳迎秋衘杯興盡人先醉舞劒歌長客易愁八月江湖翻渤澥長竿更約與君投送殷國蕐之和州送君行李欲何如楚國蕭條戰伐餘西塞人州連草莾南江風浪入空虛遺民少作先王服故府徒存博士書舊事到今多泯滅好從黎老問從初遣興庭樹號蟬日巳凉塞雲横鴈夜何長挾書萬里干明主仗劒三年别故鄊西北諸山連朔漠東南衆水隔荆揚淹留不去慚蘇子莫遣貂裘壓雪霜湖上秋郊縱歩却驂驔勝事能多許客叅如雪萬家収早稻未霜千樹着黄柑鼉鳴海上潮先湧猿呌山前霧欲含放浪漁樵元有處使人猶愛住江南贈沈子成學琴年少巳知名揮弄和柔指法精秋塞乍聞鴻鴈呌朝陽還聴鳯凰鳴幽人隠几中情適壮士投戈宿憤平此日有虞興至治南風一曲觧同聲偕汪矦宴舟中中流畫鷁獨翶翔暫勒鳴騶駐岸傍風引錦帆衝野色波随蘭棹汎晴光草涵宿潤珠璣滑麥漲春雲餅餌香何事乗槎之海上問津從此逹天潢偕鄭尊師飮余氏池亭池亭翼翼午風涼隔岸田疇穧麥香碧水千尋鷗蕩漾青天萬里鶴翶翔藏書不爲傳孫子學道還宜應帝王獨行似君何可得結交晚歲獲裘羊竹所爲余隠君作竒君負郭定幽居多植脩篁數畒餘結實巳期棲鳯鳥垂綸仍欲釣鯨魚掲竿對户思排㦸截簡盈筐俻寫書清響繁隂皆可愛炎天飛雪滿庭除贈月桂庭長老婆娑影滿一輪中普照人間不計功金色光明函世界玉毫相好現虛空開時已與羣芳異出處難将衆木同萬里青雲方得路遨逰願入廣寒宫送王仲致舎人歸閩中鳴騶擁道去翩翩欲詣閩中拜墓田伏虎爲司樵牧禁蟠螭著代鼎彛鎸上公復世儀文俻胄子承家問學專家舎驟興循制度大書史冊必流傳用左轄郝公詩韻寄曹雲西居士姓名燁燁冠清流䖏世還同貉一丘干木道髙寜仕魏子房身退尚封留靜依杉竹營書室深入蕖荷理釣舟乗興每思陪笑語揚帆萬頃泛清秋送劉希孟赴曹雲西招呉郡唯君善鼓琴曾扵律吕用情深和聲細潤鶯遷木奏響清圓鶴在隂素習巳能除俗調靜聴真可禁邪心相知頼有曹居士爲産從茲過十金送葉顯仁任衢州録吾鄊文雅舊彬彬再遇時清喜有人鳯沼巳聞繇衆選熊蹯無愧用賢賔横經辯論超周列奉􅊾光蕐及老親姑蔑到家三百里告歸晨省莫辭頻暮春遊西湖北山愁耳偏工着雨聲好懐長恐負山行未辭花事駸駸盛正喜湖光淡淡晴倦憇客猶勤訪寺幽棲吾欲厭歸城緑疇桑麥盤櫻筍因憶離家恰歲更題夏氏濟饑詩卷木饑火旱際荒年百姓流離状可憐徃徃富人心似鐡纍纍餓殍口生烟此時顆粒無沾丐是歲鄊都少棄捐天道神明加鑒在宜令夏氏子孫賢謝曹雲西菊聴鶴亭西䖏士家中園萬本值秋華擕鉏歲歲根株茂載酒時時興趣嘉已散曰英凝曉露更敷紅艶照晨霞新題料得篇章冨肯示同遊細細誇題沈氏東陽義塾並海蒼涼建學宫雲端百里現青紅東南多士題詩徧西北諸儒坐席通求道每加操守力明經深著討論功流傳後世光華盛事與南京戚氏同謝曹雲西寄菊花君種菊花兼五色能令秋日勝春時香浮琖斚和金屑光射園林列錦帷逺水波寒凝慘淡嚴霜節屇厭離披淵明去後踰千載猶有斯人把一枝寄無錫倅劉雄飛張景亮二史君閥閱俱高負羙名共分符竹守江城帆檣宻送遮天影鐘皷遥傳動地聲木落西山愁歲晏禾登南畒慶秋成知君优政多恩惠側耳邦人頌太平次韻羅雲叔雪中見寄目前坑塹巳平塡此日封姨復弄權略彴未通溪上路轒輼方䧟漠南天寒侵兔窟愁山鬼凍合龍宫偪水仙堪羡廣文才力壮詩成並和轉清妍贈張相師縉紳徃徃識名流歲晏猶爲汗漫逰自許唐生知蔡澤欲干季布禮曹丘嚢詩價重聮珠玉匣劒芒寒射斗牛輦糓諸公爭致士江湖何事更淹留次韻汪復心主簿秋霜壓鬢似相陵喚父呼兄乍肯譍厭采黄花延醉客喜焚栢子待禪僧驟登䑓閣期君可乆困塵沙歎我曽二子說聞俱好學鵬程萬里羡飛騰送方天瑞釣䑓山長富春江上釣䑓髙傍築書堂處俊髦要爲鄊閭施教化更因山水暢風騷虀鹽供養寜嫌薄朱墨研磨肯憚勞至日菊花黄滿地淋漓觴酒任君操髙沙朱山甫挽詩何勞閱市稅魚鷄歸去山中樂舊棲痩杖穿雲登峻嶺小舟乗月泛清溪無僧扣竹茶仍煮有客㝷花酒亦携江海風流今已矣孤墳愁見草萋萋送高子盤初菴山長文行繇來著本根芳菲何異殖蘭蓀諸公籍籍多相許凡子區區不足論書舘巳能更士習翰林併可代王言明年復應求賢詔必掇髙科奉帝軒題張氏順堂厥宗好徳繇先世門内曽無害氣侵春鯉上盤琱白玉夏蠶登箔鑄黄金兒長愷悌求書帙女大妖妍弄繡針彼羙堂名從此得固應長句爲君吟遣興庸人徃徃慢吾曹汨没空嗟命不遭死後欲留千載譽生前湏作萬人豪倦遊關塞身将老悵望雲天興漫高却恨素無田二頃欲乗春雨蓻東臯用左轄郝公詩韻曹雲西居士羡君秘學治玄玄黄老遺文有自傳不與宛駒爭萬里漫随遼鶴數千年横編每欲論今古中酒何勞問聖賢甫里似聞秔稻熟舉家還泛五湖船題胡伯衡飛雲圖未應時命固相違千里遨遊乆不歸巳占龍頭承紫詔更蘄馬首賜朱衣塵沙客路牽愁逺泉石家鄉入夢稀日夜思親心更切滄浪悵望白雲飛元日早朝次韻辛良史掖垣迢逓到城回魏闕嵯峨此日開赤芾㑹庭宵仗引朱輪爭道曉鐘催三泉忽報藏金甲萬歲徒聞獻玉盃樂奏象箾從此畢小臣思見鳯凰来歸至丹陽宿逆旅主人夢作燕子詩燕子歸來意何當羽毛初刷仍煌煌孔鸞相望不我與鷹隼有知那汝傷晴雲淑郁鳴上下春院芳華飛頡頏莫言帝力逺㣲物長發曽聞興彼商送呉真人具嚴威命領祠官歴祀名山不厭難上帝乗龍逰下土真人騎鶴䧏虚壇巳刋白玉爲封檢更鑄黄金作祭冠國夀延洪千萬歲願祈糓熟小民安子紹重黎有大功父宜封建至三公絲綸詔下皇恩重黼黻衣成古禮崇視草乍聞辭玉府獻桃曽見到珠宫有闕文便與彭籛得夀同題貢氏秀野堂貢氏諸郎皆好學南湖舊有讀書堂波濤巳逐鯤鯨化霧雨猶聞虎豹藏隴上麥禾春娓娓谷中杉桂曉蒼蒼君卿雅有當時望八十能來佐漢皇次韻張仲實除日聞鵲奕世侯門能載徳㣲如鳥鵲到今馴雕簷曉日鳴聲好緑樹春風鼓翼頻雲漢有愁天欲近昆岡見抵俗難親主人定有除書至貴爾先知及上春呉山晚眺山椒翬構四垂寛上相旌旗㑹覧觀傍近江湖天廣大上連星斗地清寒龍宫永鎻函書閟鳯嶺重嗟菀樹殘此際獨無雲蔽日正宜翹首望長安次克明韻贈劉時中循行郡國弗遲遲宣布新條及盛時民俗要令無狗盗人才今喜得牛毉窓間夜雨銷銀燭門外春雲壓彩旗左右湖山都未覺好分餘力治文辭潮潮頭初起壮何如如阜如岡乍有無高浪駕天龍出沒疾風吹樹鳥讙呼隂陽莫測機相軋朝夕初生信不渝海石向來誇水徳巳應傾倒盡歸墟次韻袁徳平苦雨二月雨霖無乃早園林誰復辨青紅浪花汨汨還登岸雲葉翻翻乆亂空水落巖崕通鳥道墅流椔翳塞龍宫只今海上尤空闊碩踏浮槎逐釣翁遣興門前高桞緑紛紛戀靄晋烟晝不分雨砌芳菲晴後見風窓言語靜中聞桐花可作鳯凰食竹葉還成虎豹文但使此心無外慕卜居何日絶人羣雪急霰中宵響瓦塍寒光未曉入窓稜横飛朔野威風壯盡壓西山氣㮣増蟻酒优歡唯弟共貂裘縱獵豈吾能如今何處堪㳺目葛嶺浮圖㝡一層夏夜對月暑天煩倦唯酣寢薄暮登樓起宿痾簟報新秋涼意早窓開永夜月明多不眠孤鶴頻驚呌好事流螢屢見過安得泛舟江海上坐觀冰鏡落滄波送方仲永爲重慶路校官君有英才世罕徒矯然如鶴在天衢長懐道藝干明主却恨衣冠累鉅儒愁裏論心相慰藉醉中發興共歌呼此行萬里官西蜀有問長因竹使符次韻劉時中見寄泥塗霄漢固難謀亦有元龍百尺樓籍籍圖書聊自適茫茫江海與誰遊但聞燕市能求馬肯向秦川輙飯牛富貴不才名盡滅未應摧沮恨淹留遣懐徃歲衘杯意氣踈願随童子誦詩書乆荒靖節松三徑獨守楊雄宅一區春圃花殘収夏果海門潮落買江魚如今也足成吾趣何事王門作曳𥚑翰林楊仲弘詩卷第七終, WYG: ''}
