front:
  text: 翰林楊仲弘詩集卷之二
  hash: sha256:f7ca1562b8783415c424cc0fcd69126c0c1230db66cca07d8950060581d07643
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0495_SBCK_002-1a}
body:
  text: 五言律詩送凌吉叟大江風雨暗此日送行舟㑹合能無間携離秪自愁棄繻才足恃題柱志􅀄酬請㸔秋鴻舉􅄀􅄀獨未休未俗唯無侶吾儒氣亦卑相從謀飮食那復敬師資衆巳欺王式吾猶信不疑可憐如鷃雀擾擾在藩籬􅀄陽䑓望月彩雲相冪歴蕐露共嬋娟在水渾疑墮當空孰使懸潜虬精魄動􅀫鶴羽毛鮮寂寂丹䑓夜相從訝得仙次韻韶卿壬寅元日又三日聞游人頗盛之作堂堂宵雨過栗栗曉寒仍獻􅀊人同得東郊事復興杜門疑我拙有句愛君能且驗臨堦草從今日漸増􅀉劉師魯好在劉公子遨遊興􅀂何江湖勞悵望􅀊月劇奔波迹􅀉天涯逺詩傳海内多前賢題詠處一一爲經過想君遊宦處正值洞庭湖落日波濤壮晴天島嶼􅀌舟航通漢􅃆風物覧衡巫天下文章弊非君孰起予龍井元造生群物唯龍徳最靈作霖蘇亢旱取水竭滄􅈚變化無留迹蜿蜒善養形壮哉吾羡汝一躍上青㝠贈吾子行春雨連城闊春雲暎户多長衢方淖濘小水亦風波慎獨能如此思君可􅀂何便當乗興去着屣一相過東陽十題焦桐只作全生計唯存半死心芻茪猶不置斤斧重相㝷遂使煁焦釡誰爲愛古琴有材不足恃愁絶念知音蠧簡徃古􅅊編在何年始汗青蠧蟲深卜宅科斗少成形泯㓕阽秦火搜羅出漢􅋝斯文天未䘮不敢望全經破硯彼羙端溪石家藏􅀊月多㢘隅皆破缺筋力盡妍磨玉亦堅而巳星如粲者何向來曽自詭持用掇高科殘􅀞斷裂無􅁁幅蕐堂棄置餘蒼松深踞地白鶴上凌虛風格猶森􅀂丹青捴翳如苦心絶人事誰見用功初舊劒匣裏雌雄劒通神世所聞潜精依厚地􅄍氣切高雲亦有蛟龍害寜無星斗文不逢雷煥識埋沒復何云塵鏡収藏無寳匣歎息網絲懸孰使明爲暗如觀醜勝妍玉䑓終寂寂金鵲尚翩翩政訝開元日虚􅀅盛事傳廢檠二尺書檠在如今乆弃􅂢魚膏雖有熖蠧簡獨無縁墻下偕遺礫窓間􅅁舊烟却觀提挈處辛苦悔當年敗裘寂寞牛衣子能無敝緼􅂁塵埃湏浣濯蟣蝨費爬搔意味存鷄肋寒凉視馬毛千金既銷鑠猶聴朔風號斷碑摩娑不成讀上有蘚斑斑字畫鍾王軰文章漢魏間􅀛趺凋贔屭螭首落孱顔渤海神明逺今同磑石頑卧鐘漢殿經焚後呺然卧草中雕㡬牙板廢鏽澁土花􅂪追蠡難陳力蕐鯨不奏功待賢初設簴想見古人風送屠存􅀶二首君徃金陵郡扵予亦有聞海環平野盡山出大江分未召元司馬誰憐鄭廣文自今師道立章薦必紛紛江左知名士唯君徳最淳明經􅀄試吏食禄可榮親矯矯能違世棲棲直爲貧朝廷求俊乂未易捨斯人渡江􅀉俞仲連舟濟大江濆中流日欲曛鹵翻沙際雪潮落渡頭雲鯨躍常知候鴻飛不亂群頗思論勝槩把酒莫如君奉題伯父􅀟峰樵隠山出􅀟峰秀溪流一􅂀清土風存禮讓人事省􅀅迎路逐高低過田隨早晚耕家林有如此南望毎􅀜情童稚離桑梓猶能憶故山雲峰乗白脚蘚石露蒼顔挿架詩書富􅀿門禮義閒緑林遺我恨囬首淚瓓􅃢石􅀣盤根瘦沙溪􅈭浪清竹間㸔犢卧木末見人行穡事常分力樵歌輙和聲從來携杖處不礙白雲生山曲兩三家相過路不賖對門開竹逕臨水種梅花酒熟留人醉詩成任客誇時時談舊事相㸔􅁂垂華草滿三春緑山留萬古青呼兒欣觧意􅀿俗憚勞形採菌􅃻寒木収魚照夜汀秪􅀿老崖谷束􅅁尚論經贈方韶父䖏士蜀郡蘇明允襄陽孟浩然成名兼二子得句詫群賢口絶人閒事身如物外仙卓然能有此未信獨無傳古賢皆眇邈不意見斯人得趣時時好吟詩句句新挐舟來訪友覧勝輙經旬别業稠山下歸歟願北隣和孟東野題崑山寺蘭􅀂􅀒崑岡鑿崖安佛􅇃梯雲石磴滑入厨泉水香旦寒鳥相聚月黒龍放光舟行苦􅈰促幸憇殊勝塲送方韶父先軰遊五湖蕭蕭垂素髪渺渺汎滄波過眼江山好離家日月多詩名終不朽世事復如何一徃五湖上蒼茫問釣簑和張仲實之呉興舟行雜詠水程通百里雲􅀣隔千層鶴髪歡相見龍門羨獨登文辭無乃壮桮杓尚能勝仰止情何極吾爲附􅂹蝇風流湏我軰觧后及斯時道術懐經濟文章出咲嘻由來天下士絶異里中兒它日金閨彦姢姢想翠眉翰林楊仲弘詩卷之二終
