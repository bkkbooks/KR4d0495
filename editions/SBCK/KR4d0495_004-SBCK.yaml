  text: 翰林楊仲弘詩第四卷
  hash: sha256:aadbc94053d16af94c7a4b1182de88b8652cd1919981ea2018d0e64d1439f5bd
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0495_SBCK_004-1a}
body:
  text: 五言排律夀姚承㫖上帝黄金􅆣仙人白玉堂皇猷資黼黻大筆主文章間氣生竒偉休期際吉康四朝承寵渥多士仰輝光盡發琅函秘重繙石室藏成書侔二典有道述三皇碩望高天下榮光近日傍謀謨湏稷契羽翼藉園黄上殿扶鳩杖開筵接蟻觴九重師道徳千載合明良共􅀃綸如綍能催繡作裳人思興禮樂國待理隂陽舊族名先著高門慶甚長賜書踰萬卷納笏過三牀轉覺勛庸盛還欣體力強朱顔朝暎日素髪曉欺霜巳注長生籙曽傳却老方宜齊周李耳逺邁漢張蒼松栢深逾秀蘭芝乆益芳願公多夀祉仍見子孫昌贈周景逺學士朔易囬元氣人才起俊流聲蕐當翰􅁐文采冠中州振佩趨䑓閤抽毫侍冕旒人傳鸚鵡賦家有鷫鸘裘式覩黌宮立共惟祀典修一朝虞或缺六噐俾傍求爼豆俄成列蘋蘩遂可羞中朝方有道下士實同休巳及歸鴻候姑爲食􅈉謀朋簮多繾綣使節少淹留曉日花間酒春風桞下舟篇章㣲品藻山水媿清幽鄭􅒄曾先辱隋珠不暗投考槃雖自引闚􅀚亦吾憂簡冊銷長日蓬蒿憚凛秋論高非縱誕興逺託賡酬尚憶駒千里胡䏻貉一丘何當把君􅃑相逐馭風遊夀杜尊師淡蕩風雲氣沈雄虎豹姿繇來天下士絶異里中兒苦縣常栽李商山舊采芝不當卿相位猶可帝王師始有巾車􅀗俄􅂪仄席知賢才方並用䜛􅀃􅃍相欺豸角􅀅巍冠龍鱗敢逆批變通俱合道舒卷各乗時築室烟霞秘還丹日月遲願公長住世湏作後天期次韻曹上開毗陵喜雨下土方􅁋澇髙田獨旱乾木形憂隕命藿肉愧爲官索寞雲容合蕭條夜色闌精誠天巳感祠禱力􅀄殫逈野霑新􅃳曽檐下急湍槁苗還薿薿大豆且團團逹宦俱相似疲民乞少安佳章宜刻石留示後人㸔春雪次陳元之韻寒氣何悽􅃤春空正杳㝠東皇収槖籥北帝駕軨軿混沌包三極􅌭紛走百靈散殊分的皪擊玉碎瓏玲始試朝藏日俄疑晝隕星危橋無客渡曠野少人經白沸疑奔瀬孤撑沒峻岭林荒顛凍雀崖滑堕哀㹶衮衮隨風舞颼颼􅇎雨零遺蹤􅀄得兎匿種詎憂􅑺眄睞傾農室歌謡徹帝庭陽春􅀅布徳品􅀋各成形捉筆題新句持盃酌舊􅙩今朝湏痛飲醉卧不湏醒送張仲實之宜興南渡􅀖􅀄造西山􅀅獨賢立功何赫赫流慶尚綿綿報國横戈數登壇授􅃏專風雲方際㑹江海固周旋控險千鈞弩臨危七寳鞭忠誠深足仗智勇實兼全自返髙橋役端持肩府權兵威終抗敵人力可囬天甲第無踰者諸孫固頴然初生同燕頷有羙自蟬姢善學聞當代能詩起妙年衞公猶故物鄭老竟寒氊矯矯青雲噐泠泠白雪弦同逰雖未逹自睍巳無前政事兼留意時髦孰比肩知機無轉石縱辨􅀂奔川特逹群公薦酸寒衆目憐姑爲文學􅁺㑹覔孝㢘船必見公矦復無論雨露偏秋風鵬鶚健萬里正翩翩送丘子正之海鹽州教授有羙區中彦由來志不群舟航了呉越裘馬向燕雲才思􅁃開府風流王右軍得時宜玉筍稽古賸香芸果㧞英毛頴遄収翰墨勛諸公希宦逹半世有辛勤奔走空皮骨躋攀不寸分夏侯何地芥郢匠實風斤嗟我慚鴟鷺棲山似鹿􅍪偶來詢故老因得友多聞湖舫曽秋雨河橋㡬夕曛過從方不散􅃤别亦奚云爼豆班矦泮鹽絺薄海濆未論虞廪米􅂓樂魯宫芹此日顔􅀿抗之人徳巳薰化爐新鼓樂學殖重耝耘行矣穿黄落歸歟守白紛贈言􅀅底事努力在斯文贈班彦功名書稱晋代盛事起江東内翰鍾竒氣深情縱古風摳衣皆弟子入室自豪雄欲立千金價寜論百日功秦名黄閣老承詔大明宫遺教䂓王氏隂符易禇公杯沾銀鑿落佩簉玉玲瓏文學談經早聲蕐脫頴同麥光人共賞􅁄刺巧無窮願積臨池趣流傳史冊中士開燕岳氏溪堂有溪山新月上江海故人同之句邀予及張仲實曹克明同足成之置酒秋風裏凭闌野色中溪山新月上江海故人同縱浪情何極留連燕未終三鱣來上客五馬㑹群公積水輸清氣㣲霞衒近空􅀅昏林尚白及早稲先紅極論追遐古深情念困窮尚􅀚儀秩秩未遂樂融融才著當朝傑文誇命世雄數君今日選宜􅈛集南宫次韻黄子乆喜晴三十韻呈汪知府霞彩晨張錦蟾光夕挂鈎隂霾雖盡觧􅁋潦豈全收寖動遨遊興還聞倡和謳容容追舊賞歴歴破新愁􅀐氣城􅁁縱龍光海際浮艶粧来士女盛服擬王侯在藻群魚躍依林白鳥啾河流交不斷山􅀔轉相繆物理歸含毓人情􅇚怨􅀹娭娯從老稚燕樂逐朋儔幄帟分郊次幨帷擁道周聮翩馳􅀞舫􅏭嶫累朱樓貿易通遐壤繁華壓大州聚廬千井富接棟萬家稠巳戒増周仍催決下流嘉􅂼連隙地宿麥徧高丘曹事虞多廢胥徒戢過求醲恩方並育和氣與同游期㑹朝先徃追隨暮不休露􅂠開的的風葉振颼颼拾芥非無日登禾即有秋朝家期少試隣郡固難侔共羙光蕐著還矜徳業修在廷爭進薦當宁免垂憂玉漏傳金角金尊岀殿頭秉心存正道造􅂰待嘉謀􅂂直恒如矢防偏或􅀋舟第誇繙竹簡不省計牙籌善對慙鳴鶴能歌愧飯牛過情􅂪許與彌月爲淹留再用韻贈黄子乆自惟明似鏡何用曲如鈎未􅀗唐臣薦徒遭漢吏􅀵悠然安性命復此縱歌謳石父能無辱虞卿即有愁歸田終寂寂行世且浮浮不假儕群彦真堪客五矦高人求替洽末俗避喧啾藜杖常他適䋲樞每自繆與人殊用舎在巳寡愆􅀹濟濟違班刻倀倀逺匹儔能詩齊杜甫分道偪荘周逹飮千鍾酒高登百尺樓艱危仍蜀道留􅆡復荆州鶴度烟霄濶龍吟霧雨稠東行觀海島西逝渉江流自擬需于血何期渙有丘古書嘗歴覧大藥豈難求撫事吟梁父馳田賦逺游堂名希莫莫亭扁效休休檻日迎東濟窓風背北颼鳴琴消永晝吹律效清秋雅俗居然别仙凡逈不侔多聞踰束晢善對邁楊修進有匡時略寜無切巳憂塵埃深滅跡霜雪暗盈頭始見神􅀛夢終營狡兔謀雪埋東郭􅂂月滿太湖舟急景誰推轂流年孰唱籌凌波乗赤鯉望氣候青牛好結飛霞佩胡爲淹此留􅀉王繼學二十韻聖主敷皇極元臣建上台虛心求俊乂削迹去奸囬拜命超凡品知君秉大材淳風隨日播公道􅀿時開負鼎資烹飪操刀貴剸裁銛鋒行肯綮異味合鹽梅廟議常叅决朝班復共陪艱難湏㐸助豁逹逺嫌猜遺佚聞風起英豪接踵來經綸非董賈辭藻亦鄒枚在野思羅職盈庭想轂推既􅀅龍作友惡假鴆爲媒走也今􅇔此公乎可念哉執竿猶海上扶耒即巖隈自守幽人意寜虞俗子咍舊遊辭玉府故事憶金䑓落魄江湖阻蒼茫􅀊月催丹心徒耿介素髪巳毰毸勿謂交如水能忘耻及罍飛黄當駕馭猶足異駑駘送完者都同知來游天子學藉甚有聲􅂠論事依三策藏書至五車姓名題鴈塔譜牒記龍沙自可編青竹兼宜綰白麻文工金有價貌羙玉無瑕興盡方豪飮篇終不浪誇豈惟吟芍藥曽是賦蒹葭事莫分難易人湏辯正邪月中初折桂天上始乗槎勿待秋風起宫門聴皷撾贈郭集賢衣冠趨近地藻翰集群賢給事黄門裏抽毫黼座前佩􅀛金作紐賜馬玉爲鞭御酒傾壷滿宫花挿㡌偏清光依日月逸思撓風烟記憶踰三篋吟哦過百篇自惟叨侍從不敢廢周旋秋著隨車獵寒當襮􅀍眠蘇環才既敏陸贄寵􅀹專自爾紆皇眷扵焉理化弦詞臣方進用才大畢騰騫可念如楊子蕭蕭獨草玄悠然閤高閣凭虛起登臨興甚長江流春渺渺􅀣色曉蒼蒼原隰魚鱗布峰峦鳥翼張雲耒兼北極􅀨過及南荒地大遺民富時清致理康南山常在望懐古意難忘􅀉周御史二十韻同游河北後共抵浙西初獨􅀝知心舊飜成㑹面踈三年仍契濶萬里更吹嘘小子無竒氣先生有過譽見稱司馬賦求授夏侯書倉卒排歸計淹􅇔着寓居巳非興俊逸猶異主癰疽名士多親我諸公或請予駕言􅀅采􅉮即事欲連茹顧爾傷流矢居然恨􅀝閭驚心聞杜宇過眼易蟾蜍忽召抽金匱俄徴論石渠文章殊賈馬謀略匪嚴徐薄技終難效窮愁只自如尚矜存弊􅂂不肯曵長􅅂與作棲梁燕寜爲呼轍魚儀形長日想懐抱㡬時攄奏䟽聞當宁抽毫待直爐烏䑓弦既改鰲禁席仍虛馬首何繇見分光興有餘送董與可爲句容縣主簿主簿非高士通才或暫爲催科虞􅃤急勾校慮稽遲慎察文無害詳􅀚獄有疑温純規白璧正直視朱絲要使聲名著何嫌品秩卑烏䑓懸日月舉辟實無私送朱復之爲邵武教授放浪來京國于今復㡬年山川多歴覧日月屢推遷異俗疑烏㡌窮途信馬鞭逹官空有榻遊士固無氊始聴除書下俄聞抗斾還南州分教地成法紹前賢趙彦祥母慶八十從親年八十萬里自西來氏族稱三蜀光蕐照二䑓柰繁愁夜雨筍長望春雷綺食和金鼎香醪進玉盃鳯毛方煒燁鶴髪正毰毸試使蟠桃熟從今更㡬回雲山圖爲茅山劉宗師作長江千萬里奔浪薄高雲龍現誰能覩猿啼不可聞迂迴因地􅀔昭晣􅀿天文劒氣秋如洗珠光夜欲焚連峰俄筍迸斷崖復􅀲分句曲臨東極巖頭有隠君題康里氏家譜國受輿圖廣家傳譜牒詳馳聲繇鴈塞拓跡至狼荒轉戰踰千里來䧏盡一方􅁬戈回白日列㦸耀清霜破竹􅀵城邑分茅賜土􅆠弟兄皆勁悍父祖各雄強相印仍兼綰兵符更迭藏排衙開萬弩納笏過三床巳及書宗祏還宜紀太常後人能繼紹千載有輝光題王叅政積翁别故人詩卷後聖主膺新命明公遇盛時混同開宇縣困厄守城池冦盗思攘􅐁黔􅀺頼寵綏合珪承燕享前席俻詢咨築室求梁棟徂堂薦䁀鼒用兵陳廟筭養士作􅀖基巳草歸田賦仍題伐木詩此生終契濶吾道豈磷緇矯矯游龍字綿綿吐鳯辭錦嚢加十襲細覧想形儀贈魏虚舟少府西蜀文章伯東呉閥閱家族傳貞􅀚舊躅繼信陵遐雅度人難測高名衆共誇爲楨材不小韞櫝玉無瑕鳴鳯占諧吉乗龍偶契嘉三床邀納笏萬弩護排衙世賞官仍及朝叅寵復加天顔垂眷顧地肺侈光􅂠緩歩方鳴玉高情欲泛槎翻然歸翠麓姑爾奉黄麻彭澤還栽桞河陽不種花投閑銷日月訪古略烟霞臈蟻常開宴春魚每㸔义興來恒放逸賔從任喧譁閤靜褰珠珀窓虛閟緑紗琴彈多古雅詩就輙妍姱願作梁間燕徒慚井底蛙執鞭曽莫俲抱瑟敢長嗟戀戀情終在悠悠道苦賖春風吹去斾翹首又天涯贈劉平叔郎中肇自三苗氏􅁋爲五虐刑商周終至治禮樂固常經赦過存三宥原情用八聴未能還畫􅁚猶貴去殘刑末俗仍澆薄生民􅂚救寜謂宜沾雨露抑使震雷霆皡皡惟母擾元元庻有靈林殘求虎豹穀害去蝗􅑺此意雖忠厚斯言􅀂窅􅄀君乎吾有望當使在朝廷送丘子正之海鹽珠生滄海底王韞碧山中夜氣交明月陽精現白虹有賢兼重價當代振英風好學由天性能書至國工知名傳冀北作賦擬河東始欲徴楊子旋聞薦楮公隂符難獨羙遺教實爭雄絶藝雖宜進竒才自不同交游傾上國掄選属南宫鄧禹官初試匡衡對漫通海􅀖終寂寞學舘尚穹崇巳注千人録當成五典功星辰皆在水渤澥信浮空把酒􅂬何限乗槎興不窮文章趨浩瀚物態入牢籠子必登芸閣吾方守桂叢索居彌寡陋荒業孰磨礱弗􅀗披雲霧惟思對􅂠嵩知音期郭泰流俗易王充江海從茲逝飄飄任短蓬贈虞彦髙呉越知名士風流得此人結交何待乆晤語即相親丹穴生儀鳯滄波豈縱麟飛鳴常見瑞變化不無神家世皆爲善文儒謹飭身不􅀅紈袴累自著綵衣新力學追高古修辭絶等倫汪茫涵巨海要眇動纎塵鐘虡聲音大韺䪫節奏均詎誇傳里巷可使抒絲綸藉藉聞當代駸駸集要津省闈曽奉檄學舘巳垂紳滋味嘗郊鼎光蕐薦席珎南宫延國子西掖選詞臣慷慨升車日遲囬執􅃑辰論心情巳至抵掌氣彌振虞詡才方壮湯休學最醇相期終晚􅀊無取艶芳春抱獨知何向爲朋喜有因從君鳴一世流詠􅀍無垠鄭中丞母大夫人夀八十端公居重位夀母在高堂天意何相厚人倫實有光豸冠方俊偉鶴髪尚康強内翰爲封誥同僚舉慶觴欣欣承玉饌赫赫􅅁金章獻􅀏􅄌親側䋲愆聖主傍中天懸日月下土凛風霜可謂全忠孝都縁積義方孟軻難獨羙湛氏竟齊芳頌徳吾無媿名宜百世􅀭送朱仲山􅀊貢入京昭代陶淳化多方出異材鳴岐聞鳯鳥清道服龍媒養素稠山僻􅀚竒戴籍該爲珎如寳璧奮蹟起蒿莱未展垂綸趣初承􅂆駕催羔羊塤委巷駟馬踐輕埃戰藝鋒無敵搜賢網正恢上書追􅅯樂作賦並鄒校奮發直從此㳺􅀚亦壮哉雲霄千萬里瞻望重徘徊招真􅀚圖欲學無爲道來居小有天精神消物恠采色變風烟恬澹知天徳虛無􅁚帝先高風何特逹古跡尚流傳地渉鴻荒表山開混沌前谷幽疑􅄦聚峰巧􅀋人仚疊起三重閣分流百道泉岩穿留虎跡石冷逗蛟涎放浪曽無日遨遊未有年古經披覧罷蒿莱未展垂綸趣初承􅂆駕催羔羊塤委巷駟馬踐輕埃戰藝鋒無敵搜賢網正恢上書追􅅯樂作賦並鄒校奮發直從此㳺􅀚亦壮哉雲霄千萬里瞻望重徘徊招真􅀚圖欲學無爲道來居小有天精神消物恠采色變風烟恬澹知天徳虛無􅁚帝先高風何特逹古跡尚流傳地渉鴻荒表山開混沌前谷幽疑􅄦聚峰巧􅀋人仚疊起三重閣分流百道泉岩穿留虎跡石冷逗蛟涎放浪曽無日遨遊未有年古經披覧罷毛骨爲醒然喜晴得􅀭字呈汪知府霏霏褰􅀫靄煜煜射􅀄陽出谷鶯聲滑摩空鶴􅀔張鼓鼙争􅁬發帆幔各飛􅀭不畏塗泥滑寜憂積潦妨農夫分舊種紅女覔柔桑爲有豐年慶陳陳滿太倉􅀉沈少㣲金􅂠山隠居巖前通細路嶺外接危峰梯磴踰千級烟霞過萬重縁崖収異荈歩壑數長松隔屋號朱虎當窓現黒龍蘅蘭爭酷烈桃李角鮮穠隠士多相過仙人庻可逢第能安性命何患改顔容煉鼎丹砂熟傾壷白酒醲㣲茫追絶響瀟洒振􅀌踪郷里宜同好它年必子從挽徐處士此日新安郡名家復數誰危科雖屢掇舊業詎多遺孝友全高行温恭集令儀花殘青􅀊晚木落紫山悲結蟻容兼盛衘鱣譽更垂白雲埋骨處揮涕想漣洏送侯尊師歸蜀北上􅀜河逺南歸􅀊月賖飄飄携短劒杳杳泛靈槎别岸秋濤掩前山曉霧􅃒欲攀青桂􅀣先採白蘋花大道元無極浮生即有涯舉杯吞夜月引䄂拂晨霞獨跨冲天鶴能追赴壑蛇秪􅀿投老去長日煉丹砂春晚喜晴積雨俄經月新晴始見春蒼苔侵别墅緑水過比隣性僻居宜逺身閑景易親無詩排世累有酒縱天真循圃花粘􅂂凭䦨桞拂巾歌呼從稚子談咲或嘉賔漸喜漁樵狎仍欣鳥雀馴幽情延薄莫浩思集清晨養拙元非病爲文敢自珎杜門縁底事作計􅂴隨人翰林楊仲弘詩卷第四終
