front:
  text: 翰林楊仲弘詩卷第五
  hash: sha256:19c11ab6ce880031205b26106e6ba0a7ea77734c73a6fa9d33aa0fa08c708742
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0495_SBCK_005-1a}
body:
  text: 七言古詩次韻虞彦髙遊陽明洞憶昔神禹奠九州茲山㑹計功始休諸侯玉帛渺何許但見萬水從東流衣冠永閉陽明洞夜聞􅀑􅂘巖之幽珠宫貝􅆣􅃅龍瑞天造地設非人謀槎牙恠􅀣凍不死化作千丈蒼王虬丹洞呀然仙掌裂翠峰巧矣蛾眉修梅梁飛去鐡鎻斷徃徃雷􅀨生靈湫軒轅緱神極秘恠海上笙鶴時相投平生閉門讀史謳子乃探穴先吾游明當挾子􅀐汗漫題詩更在最上頭不妨山水樂吾樂豈有飢溺憂民憂故家喬木尚可求有子有孫百世留卧横玉簫泛歸舟吹散萬斛江南愁送俞用中之蓮城君家文獻猶未泯名載舟車無不之乃翁種徳不食報流慶涓涓方在茲皦然王立七尺軀相非公卿無此竒早􅀌爲學孰勉劭藏書萬卷能盡披季父撫育過巳子􅀅爲前人護址基我兄長公有年􅀊才氣偉燁通時宜賈誼晁錯奉大對生晚弗及同驅馳君令沿檄治郷校􅀄官􅂂歴固不卑要爲國中養賢俊政無大小視所施栝蒼山好著仙籍昔人扵此自燕順榮公相業軰王謝石僧尚有踪跡遺君居三載業可想再見惟有操䧏旗古墻行建炎白馬南渡時循王以身佩安危䟽恩治第壮與衞縮板栽􅆬繇偏禆下鍤江城但沙鹵徃夷赤山取焦土帳前親兵力如虎一日連雲興百堵引錐試之鐡石堅長城在此􅀔屹然上功幕府分金錢讙聲如雷動地傳爾来瞬息逾百年高崖爲谷驚推遷華堂寂寞散文礎喬木􅃤淡棲寒烟我入荒園訪遺古所見惟存丈㝷許廢壊終嗟麋鹿㳺飄零不記商羊舞主孫欲言淚如雨爲言王孫母自苦子孫再世􅈥門户英公尚及􅀚房杜如君百不一二數人生富貴當自取况有長才文甚武公侯之後必復初好把家聲繼其祖題山石猿鳥圖萬卷堆中昏欲睡忽見􅀞圖醒我意眼前崖谷起嵳峨便似看身遊此地楩柟櫧櫟大百圍奔泉透石辟歴飛玄猿􅀌峙憩羙䕃下視白鳥娯清暉昔聞虞舜狩南嶽君子相随化猿鶴徃時此軰猶爾爲慨想雲林真可樂㧞劍斫山山骨露山􅀑咿嚶安敢怒秪今踊躍歸去來莫愁無覔誅茅處李伯時􅀞浴馬圖古稱難􅀞莫如馬近朝唯數李伯時不至天閑􅀚帝服如此骨相何由知頭􅀋渇烏尖挿耳竟度流沙輕萬里圉人牽浴恒凛然復恐化龍奔入水貧居里巷無馬􅀐徒歩出入多傷悲大脛薄蹄何足願退立道傍塵滿面送時中兄入京先生意氣非常流有如雕鶚厲九秋讀書不肯守章句經濟可許斯人儔懐抱利噐􅀅逺遊直徃上國交公侯王侯位高不下士如以蛟龍視螻蟻爲君莫敏光範書以氣撼揺差可耳功名倘來不足爲丈夫湏作逺大期君不見麒麟閣上圖英俊當時或自閭閻有􅆣文次韻題􅄌照寺浪紋石山前流水響急灘崕􅔌齟齡嶮且艱直上正平稍去水坡陁漫漫龍背起幽阻之間有竒石洶􅀂北風吹海立滄海飛塵事有徴遂使喧豗化㝠寂開闢而來六萬四千􅀊浩浩洋洋不休息雖有好事者欲爲之不似大造無㾗迹我行見之頗愕然抽觴戯欲取㳙㒀僧堂託宿語不眠竟莫禮了生公禪意外竒崛當眼前䟦渉無􅀒兩足研君家住時宅通􅝬何如金堂石室友群仙㑹見石髓流爲泉何事更種東臯田子能食之可長年題王起宗􅀞松岩圖雲起重岩欝凌亂長松落落􅀣直􅆬􅀂人於此結茅屋爽氣飄然拂霄漢艤舟之子何逍遥從者傴僂携一瓢山中無日不閒假䟦渉相顧凌風飈始知王宰用意高使人􅀚圖鄙吝消世間未必有此景􅂗抺變幻憑秋毫丹青遊戯故足樂収絶視聴搜㝠寞向來爲政殊不惡乃爾胸中有丘壑題蕐岳江城圖蕐岳能詩世有名學􅀞丹青亦豪放此圖似寫安慶城雉堞樓䑓儼相向北風􅀅至江靣黒千艘萬艘爭避匿滄􅈚涌溢水倒流南嶽動揺天柱側蛟龍戯落秋潭底素練平鋪八千里時清好作釣魚翁閑弄輕舟烟霧裏神馬歌次韻陳元之神馬來自崐崙西有足未始行沙泥朝趨欲出飛景􅂗抺變幻憑秋毫丹青遊戯故足樂収絶視聴搜㝠寞向來爲政殊不惡乃爾胸中有丘壑題蕐岳江城圖蕐岳能詩世有名學􅀞丹青亦豪放此圖似寫安慶城雉堞樓䑓儼相向北風􅀅至江靣黒千艘萬艘爭避匿滄􅈚涌溢水倒流南嶽動揺天柱側蛟龍戯落秋潭底素練平鋪八千里時清好作釣魚翁閑弄輕舟烟霧裏神馬歌次韻陳元之神馬來自崐崙西有足未始行沙泥朝趨欲出飛鳥上夕逝直與奔星齊緑鬃半散挿􅀟耳赤汗交流攅四蹄風神秀獈陿天地豈顧燕蔡并渠􅀺時時牽浴臨清溪對人誇殺黄湏奚玉沙之禾中芻秣不嚙堤頭枯草梯與君側耳聴長嘶凡馬不聞生駚騠古劒歌爲呉真人作間閒真人藏古劒敬之如神不敢忽賔客時來求一􅀚輙有悲風起倉卒人言此是金鐡精良工煆煉乆始成動揺天地合變化摩蕩日月含光精昔年有蛟起江中口吐烈熖燒長空下民昏溺上帝怒雷電徃擊皆無功嘗持此劒斬蛟首流血㴞㴞浸廬阜傳記傳聞時既乆不意世間今尚有吾過下里多惡氛魍魉魑魅能食人請君爲我絶此恠一洗宇宙長清新梅梁歌酬鄭集之大禹之功及天地廟有梅梁何足異柰何過用鐡索纒太祝爲之欲􅗲利每言變化失其所去作老龍治風雨一聲霹􅆮震岩扉千尺蜿蜓辭殿户七月槁苗沾塊土憂殺村中老農父買羊沽酒􅀕梅梁􅀕罷祠官傳好語吁嗟老農無爾愚大禹有神焉可誣汝曹􅁋祀欲求福此物爲妖當伏誅題趙千里山水扇靣歌公子丹青藝絶倫喜􅀞江山上紈扇秪今好事搆千金四幅相連成一卷春流漠漠如江湖飛烟著􅀣相有無嵐光注射翻長虛白玉盤侵青􅃢瑚追随流俗轉蕭踈對此便欲山林居旗亭花發酒湏沽舟行爲致􅀟提壷抱琴之子來相湏醉歸不省何人扶旁有飛泉出岩􅂩掣電飛霜相盪激蛟龍不愛鯢桓食但見垂綸古盤石人生萬事無根柢出䖏行藏湏早計一丘一壑倘如斯便可束書從此逝君不見鄭子真躬耕谷口垂千春毫芒世利能没身汝胡齷齪爲庸人題秋雨長吟圖雨暗秋天黒如墨窮居茅屋出不得終日長吟復短吟吟罷令人轉凄測飢猿抱􅀣屈􅀟肘病鶴拖泥垂兩翼何當策杖過溪頭要㸔南山新翠色竹􅀣圖荆􅁄􅂪蘢迷竹􅀣亂堆古石蒼苔護縱獵青郊懐舊路躍馬重岡追狡兎箭翎落地無㝷處時中兄示余􅀞一軸􅀞一老翁推獨輪小車上載兩巨甕意其爲警世之爲因爲賦詩小人無他獨嗜利兩甕載車􅀅逺致肩赬足趼汗澘然冉冉修程胡不畏世人但􅀏愚翁愚甕破即與瓦礫俱不知人有千金軀前行險道方乗車翰林楊仲弘詩卷第五終
