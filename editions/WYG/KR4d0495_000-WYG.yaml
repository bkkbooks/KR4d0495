body:
  text: 楊仲宏集别集類四元提要臣等謹案楊仲宏集八巻元楊載撰載字仲宏浦城人後徙杭州初以布衣薦授翰林國史院編修官調海船萬户府照磨㑹仁宗復行科舉之制遂登延祐二年進士授饒州路同知浮梁州事終于寧國路總管府推官事蹟具元史儒學傳焦竑國史經籍志載楊載仲宏集四巻此本八巻不知何人所分元代詩人世推虞楊范掲史稱其文章一以氣為主而于詩尤有法度自其詩出一洗宋季之陋云云葢宋代詩派凡數變西崑傷于雕琢一變而為元祐之朴雅元祐傷于平易一變而為江西之生新南渡以後江西宗派盛極而衰江湖諸人欲變之而力不勝于是仄徑旁行相率而為瑣屑寒陋宋詩于是掃地矣載生于詩道弊壊之後窮極而變乃復其始風規雅贍雍雍有元祐之遺音史之所稱固非溢美故清思不及范梈秀韻不及掲傒斯權竒飛動尤不及虞集而四家並稱終無怍色葢以此也都穆南濠詩話曰楊孟載詩律精􅋀其追和李義山無題五首詞意兼到真義山之勍敵瞿宗吉歸田詩話曰楊仲宏以宗陽宮翫月詩得名然他作如風雨五更雞亂呌江湖千里雁相呼挾書萬里朝明主仗劍三年别故鄊忩間夜雨銷銀燭城上春雪壓綵旗空桑説法黄龍聽貝葉繙經白馬䭾沉雄典實先叔祖每稱之長篇如古墻行梅梁歌亦皆為時所稱夫人瞿氏余祖姑也嘗以仲宏親筆草稿數紙授予字畫端謹而前後㸃竄㡬盡盖不苟作如是則載于是事亦以苦吟得之者矣陶宗儀輟耕錄曰虞伯生先生楊仲宏先生同在京日楊先生每言伯生不能作詩虞先生載酒請問作詩之法楊先生酒既酣盡為傾倒虞先生遂超悟其理云云竟謂載詩在虞集上則非其實也乾隆四十二年五月恭校上總纂官臣紀昀臣陸錫熊臣孫士毅總校官臣陸費墀楊仲𢎞集原序大德間余始得浦城楊君仲𢎞詩讀之恨不識其為人及至京師與余定交商論雅道則未嘗不與挺掌而說也皇慶初仲𢎞與余同為史官會時有纂述事每同舍下直已而猶相與囘翔畱署或至見月月盡繼燭相語刻苦澹泊寒暑不易者唯余一二人耳故其後余以御史府用筦南憲架閣適海上仲𢎞復登乙卯進士第為浮梁别駕余遷江西仲𢎞亦改宣城理官相違十數年相距數千里迹雖如是而心固猶數晨夕也而仲𢎞竟未任宣城以卒烏乎慟哉余嘗觀於風騷以降漢魏下至六朝弊矣唐初陳子昻輩乘一時元氣之會卓然起而振之開元大厯之音由是丕變至晚宋又極矣今天下同文而治平盛大之音稱者絶少於斯際也方有望於仲𢎞也天又不年假之豈非命耶葢仲𢎞之天禀曠達氣象宏朗開口論議直視千古每大衆廣席占紙命辭敖睨横放盡意所止衆方拘拘已獨坦坦衆方紆餘已獨馳駿馬之長坂而無畱行故當時好之者雖多而知之者絶少要一代之傑作也仲𢎞有子尚幼其殘藁流落未有能為輯次者友人杜君伯原自武夷命僕曰將就其平生所得詩刻諸山中此誠知仲𢎞者而杜君猥謂罄仲𢎞海内之交相好又莫余若也俾為序之用掇其梗槩著于篇端致和元年六月一日臨江范梈序欽定四庫全書楊仲𢎞集巻一元楊載撰雪軒
