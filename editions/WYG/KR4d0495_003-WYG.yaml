body:
  text: 楊仲𢎞集卷三元楊載撰寄題羅氏别業二首溪行如百里為地已幽深石轉黄金塢山抽碧玉簪盃觴酬日月弦誦起雲林樂事無終極誰能得此心又門前臨白逕長日少人行野樹重重暗溪流脉脉清山光元不斷雲氣自相縈已似龎公隠何時重入城江行次韻六首潮頭終歳白沙腹有時皤利涉他州柂終更古戍戈天依臨海樹風作滿江波亦有投竿意還聽孺子歌又舊事如遺迹新愁轉泥人晴天宜縱步凍草各含春野鵲飛林杪沙鷗過水濵江山故如此晚望及斯辰又藜羮真我食薜荔亦吾衣養性隨時足今生徇物非秋蓬猶未定風樹莫相違謾作烟霞想曾無羽翼飛又春花􅊃共采若木有誰編浩蕩寧無取紛華幸見憐緒風吹四裔清露洗重𤣥萬物皆生意蹉跎畏此年又路僻行來好天清望極遐白魚翻急浪黄犢卧晴沙柳吐千條葉梅殘幾樹花佳辰從此數歴歴看韶華又子胥因諫戮兹事幾經秋顧爾忠難揜于今憤不休天風吹地轉海水入江流欲問䲭夷處茫然使我愁酬子行初秋風颶之作􅇀夜風濤變崩騰怒不休魚龍皆失穴江海欲同流竝岸漂千舍連檣覆萬艘隂陽知有沴惻愴動深憂送孫大方歸朝元宮三首髙卧林泉表超然謝世紛空山鳴白雨古石繫蒼雲不作䕫龍伍甘從鹿豕羣都門遊宦客囘首總慙君又飛搆上凌空依稀想故宮金盤凝曉露玉佩振秋風溟滓那違俗支離更養蒙大還何日就變化入無窮又為樓因地勢四面盡青山路落秋城外河流曉樹間雁飛雲莫莫龍現雨珊珊建木光華盛何時共折攀挽饒國吳文康公詩二首厚德修天爵崇資拜地官粲然周典禮偉甚漢衣冠共喜懸金印俄聞葢玉棺史臣書寵數光照碧巑岏又道學繇賢子推恩自聖皇白茅分壤土華衮賜衣裳漫注長生録虚傳郤老方神遊終不返瀛海路茫茫題張氏順堂百順名為福紛然會此堂詩書成藴藉黍稷發馨香夜户鳴琴瑟春筵酌酒漿子孫宜孟晉相繼謁明光題信州先天觀圖四首囘環因地勢制作本人謀蔽日來龍駕凌空結蜃樓秋琴翻浩蕩夜罄答深幽願受長生訣他年幸一遊又髙林褰翠氣虚谷散虹光道士多騎虎仙人自牧羊澗泉通地逺山嶺際天長戴子文為記流傳示不忘又四圍山不斷狀若碧芙蓉谷逺含風細崖深下露濃茂林藏虎豹隠洞伏蛟龍恍惚神人降浮空羽葢重又鬼神相與處燒藥易成功雲霧生牀下雷霆起室中養身唯淡泊遊世等虚空髙舉寧無日飄然獨馭風次引浚儀公題蘭竹卷子韻樹蕙連叢竹秖應族類同相依巖石畔併入画圖中勁葉凝清露危梢倚碧空諒非髙世士此意固難通贈程景純二首南遊觀楚越北度覽幽燕羇旅新愁換英豪往事傳塵沙迷逺驛風雨暗長川好醉新豐酒清朝正選賢又論士無他術先觀氣盛衰澗松多勁節瓊樹有髙枝圖籍曾無覽弓旌詎久遺似君宜努力慎莫負明時思菴閔氏青山下遺封見若堂蓼莪恩未泯拱木恨難忘德業銘金石詩書塞棟梁子孫修學術奕世有輝光赤壁圖寂寂長江夜同人共泛舟清尊方淡蕩孤棹且夷猶望逺幽禽度歌長獨蠒抽千年遺跡在不逐水東流贈昌上人二首山中明月小壠上白雲多旦食飡松柏秋衣攬薜蘿俗人希見問禪老每相過異日髙僧傳垂名定不磨又未生天地始此理固存存直木何由曲清源不可渾養生毋過厚守道在彌敦超出塵埃網蘄師共與論送葉彦中之官行􅄗二首范滂將攬轡周景已題輿九扈名兼美三鱣兆豈虚都門愁撡袂江徼喜沿書重有斑衣奉南州總不如又大府徴才士知君學業優兩京勞侍從十載困淹留白雪歌難和青雲志易酬鍾山多勝槩有意與同游送胡秀才歸新安二首明詔方求士知君有俊才未聞遺杞梓何事返蒿萊似驥寜淹足為龍豈暴腮文章成錦繡他日必重來又彼美逢衣子遨遊至上京雲霄方有志塵土已知名塞雁驚新恨溪鷗憶舊盟秋風吹易水惆悵復南征惠崇古木寒鴉江上秋雲薄寒鴉散亂飛未鳴常競噪向晚復爭歸似怯霜威重仍嫌樹影稀老僧修止觀寫物固精㣲留别陳益謙大帆仍馺娑雙棹復夷猶曉岸烟沙濶春江霧雨稠桃花隨漲水荇菜逐長流遲子來京國何時賦壯遊遊陳氏園偕李治中張提舉曉日從千騎郊原樂事多溪山春與麗烟靄晝相和宿蠧藏編冊鳴騶隔薜蘿使君辭滿引起舞亦傞傞挽艾處士二首才行能䨥美終身作布衣江湖名自逺塵土迹還稀野菊秋霜薄岩松夕照微沙鷗盟未改忽忽下漁磯又撰文來相府書字出詞垣盛事傳千載幽光發九原父賢宜竝著子孝復堪論多少衣冠族無聞愧後昆顧氏義塾居鄉為義塾兹事罕前聞外户來衿佩中堂蓄典墳儒宗先麗澤聖德尚彌文吳下多豪族能賢總羨君挽吳道士曾為方外士抗迹出塵氛既草歸田賦仍書誓墓文卧牛空有兆紀鶴竟無聞春草年年合誰憐道士墳送林季羽入京宿衛三首青雲自致身磊落見斯人巻衮辭蒼麓垂纓侍紫宸漏􅋊珠閤曉香暖玉爐春倘厭承明事歸來衣錦新又終軍方近幸賈誼最能文獨用竒才進應將美譽聞金鞍光照地寶劔氣凌雲來往燕􅄗下同游必羨君又衛郎皆世胄之子更才賢意氣雲霄上榮光日月邊都俞聞寳訓出入奉瓊筵立志當𢎞毅功名不偶然送徐義父入京二首舊富三冬學今為萬里遊風雲丹鳳闕雨雪黑貂裘南土名先著東堂選必優相逢多意氣談笑接名流又幽燕向日邊裘馬去翩翩磧逈沙如雪河窮浪入天上書雙闕下待詔五門前壯節當竒遇無煩媿往賢贈曇上人二首多生為佛子慧達自童蒙蟬脱凡塵外龍騰覺海中一真元不染四大本來空異日叢林下知師繼杲公又人世百年内都如過隙塵不開心上眼苦愛夢中身城市無閑日江山又晚春相逢言道好獨覺意相親贈胡汲古二首先生唯達道久矣樂山林致聘無雙璧為生過十金身閑雲出岫髮短雪盈簪遁世猶吾志同盟欲自今又野客何蕭散長年暫出遊風塵唯短褐江海自扁舟有迹能來往無心任去留才名今藉甚屈指到枚鄒送胡汲古之吳中有客佩蒼精居然得此生山開棲越跡水泝入吳程佚老悠悠計傷離戀戀情食菲方未已應不為魚羮中秋攬雲憑結搆步月上林皋不記金尊竭頻瞻玉宇髙神清存夜氣天濶數秋毫百尺樓如在何煩卧汝曹挽曹光益二首斯人吾所愛不見已經年頗怪魚書絶俄聞鵩賦傳歸魂迷道路遺骨滯山川逺業凋零盡臨風為悵然又好學無如子冥冥獨苦心未成梁棟用誰使雪霜侵宿草孤春意游雲泊太隂憶渠情不已揮淚在衣襟贈劉時中二首騷雅誰能繼居然屬大才銳思羅宇宙逸興走風雷處勝輕流俗名髙震外􅄗東郊乘大路翼翼待龍媒又吳越千餘里君來按轡遊羣公虞罪戾多士想風流決事曾無壅觀民輒有憂若人何可得離别重添愁送王元禮歸平城二首燕趙多竒士遺風有固然射鵰猶絶藝屠狗亦名賢形勢威天下風流號北邊送君歸此地亦欲奮吾鞭又牧羊憐馬援投筆困班生侯印終兼綰窮愁實飽更大才當用世小挫亦知名快飲桑乾酒能澆氣不平贈張之翰二首外􅄗收掾屬奮步集亨衢落落蟠英氣飄飄發壯圖威風聞郡邑行李涉江湖竝轡逢佳友周游興不孤又長才當用世進取或􅌞途剸劇曾揮刃銷奸若燎枯交游冠葢盛出入禮儀都有賴寛衰俗餘波及腐儒送陳君佐入京二首子欲遊京國程途萬里遥束裝辭邑社振斾躐風飈學問先餘子飛騰在一朝太平知有䇿必顯聖明朝又董子知天道朱雲善易經由來登俊乂所以重朝廷彼有譏儒服吾無鼓説鈴君看鴻鵠舉忽忽至青冥宿延祥觀有感二首處世如庸俗胡為淹此留蹉跎悲往日磊落愧前修願棄人間事來為物外遊大還如可就猶足訪丹丘又瓊館遊仙子超然逺世情言辭多近道豪翰久知名露下衣裳溼風來几案清似君居處勝亦足寄吾生題青田葉叔至野清堂二首為堂殊顯敞在野興尤濃白水流千折青山繞百重樹麻行斾斾蒔木倚童童相對漁樵話終朝亦罕逢又逺來山異甚龍虎互騫騰溪狹灘聲悍林繁雨氣增正須求靜坐何事角多能謁告還鄉里君堂或可升送張宣撫使嶺南二首奉使入蠻烟終軍始妙年抗旌辭朔野擊檝渡湘川翠竹侵巖際黄茆盡海邊狼荒非善地為戒莫留連又此行行萬里𣺌𣺌極朱涯地勢雖懸隔天威可逺加引弓飛惡鳥拔劔斬妖蛇遲子歸來日燕南看雪花送李侍郎使安南九秋天色晚萬里送君行馬首塞雲起腰間寳劔横奉揚天子命慰答逺人情直渡蠻江水炎氛一日清喜雪酬康子淵院使漠漠連天暗霏霏著地輕欲迷鳷鵲觀先入鳳凰城凍影篩簾宻寒光射隙明詰朝宜表賀來歳卜收成送吳清叔驛路程雖逺帆風勢甚遒青山隨岸去白水滿江流牢落添新恨繁華憶舊遊只今歸去好把釣即槎頭贈鄭尊師茫茫雲著地摵摵雨交天篁竹連河上青茅盡海邊棲遲聊應化放曠且談𤣥相對蒲團坐清風為肅然黄櫟杖為龔聖與作嗟哉黄櫟杖吾賴汝扶持未免道途苦無如筋力衰散才唯不用大節固多竒老向江湖上提攜得自隨次夏仲勉韻二首門前無繫馬屋外有鳴螿迫迮衣冠府蕭條翰墨場雨淫憂地溼風暴喜天涼推轂無時已令人憶鄭莊又不喜為文富長憂得酒慳尊罍堆案上筆硯棄墻間有傳追王績無書繼賈山貴人能慢士往見亦胡顔冬至次張宣撫韻二首北去關河逺南歸歳月長屠龍雖有技相馬獨無方雲水連天暗霜蕪滿地荒客遊應未巳塵土在衣裳又瀛海無消息冥冥鳥道長已驚雙鬢短更待兩瞳方落日依平嶂洪河入大荒憂來那可得揮淚欲沾裳送吳清叔歸婺客遊春向莫無日不思歸雨給桑麻秀山深笋蕨肥薄醪能屢醉舊社足相依莫道天邊雁衝衝適禍機與方韶卿望月月明胡乃爾秋盛故能然匣鏡無纎翳槃珠有許圜寒光摇碧海爽氣挾青天幸遇山頭鶴令人夜不眠孝思亭詩為王心田作山嶠靄蒼蒼盤旋衛古藏盎温通地氣赫奕閟天光神化侔飛劔前聞驗若堂子孫修祭祀歳久不能忘浄香亭二首藝竹蒼空古為亭白日幽一麾方出守千户益封侯外物從渠屏清樽喜客留楣間標勝語朗詠亦風流又翼翼四簷外蕭蕭三逕中珠璣穿夜雨幢纛舞天風擁神生清氣開軒近碧空古人雖不見佳興詎無同酬吾子行耿耿思朋舊悠悠涉歳華既依秦大姓方問魯東家雅道將誰與新詩敢自誇祇今能會合不憚路途賖偶作碧草含秋意黄雲起􅇀容歸鴉昬且噪去雁有無踪盃酒因循醉朋人邂逅逢身名猶碌碌正坐日疎慵送劉明卿歸安東同郡居相逺逢君豈偶然秋天聨席宴寒夜共衾眠不為時名役猶嗟俗事牽語離還悵怏後會是何年和張仲實舟行雜詠莫作匆匆去相隨稍稍觀逺山多意態急水易波瀾把酒悠然樂扁舟得爾難五湖天下景六月氣常寒題秋江釣月詩卷泛跡秋江上而今不計年垂綸牽細浪欹帽破長烟已類𤣥真子兼疑孟浩然後來名未泯題品有髙賢楊仲𢎞集巻三
