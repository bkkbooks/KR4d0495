body:
  text: 楊仲𢎞集卷六元楊載撰宗陽宮望月分韻得聲字老君􅄗上涼如水坐看氷輪轉二更大地山河微有影九天風露寂無聲蛟龍竝起承金榜鸞鳳雙飛載玉笙不信弱流三萬里此身今夕到蓬瀛次韻錢唐懷古四首江湖清濁自天開鴻鴈鳬鷖與往來黄道星辰環太乙紫雲宮殿擁蓬萊論文競奏王褒頌獻夀深傾阿母盃九域輿圖今混一百年耆舊獨興哀又斜界鈎陳通大道中分魏闕對層巒雲生殿上金爐暗露下庭前玉井寒江漢飛龍俄窅窅滄溟泛鷁竟漫漫中天會合寧非數坐見蒼生奠枕安又山囘禁禦入雲長無復陳兵衛兩廂千石金鐘埋野草萬年珠樹落秋霜龍文不徙陽人聚鳥篆終降軹道傍九市塵埃來衮衮一江波浪去茫茫又化人宮闕被層阿棟宇髙低若湧波翠石文章書日月寳珠光燄燭山河空桑説法黄龍聽貝葉繙經白馬駝誰謂一無超衆有只今塵土重來過題豐樂樓崢嶸飛構壓名邦西望平湖東望江氣合重𤣥蒙流瀣標存九域奠洪龎朝來散霧縈朱栱夜後流星透碧窓倚徧闌干愁目眩飛鳶旋轉故雙雙水樂洞石林求路轉聱牙來訪香嚴大士家雨過門前生薤葉風行隴上落松花懸崖滴水鳴金磬激磵流泉走玉砂欲適山林去城市久知寂寞勝紛華題拱北樓殷地鼓鼙迎日出倚天梁棟與雲浮北瞻帝闕三千里南控臣藩三百州江海無波沉罔象旌旗垂野駐貔貅鸞迴麗榜多深意繡衮于今有魏牟次韻羅雲叔紅梅玉人中酒殢芳華盡壓東風百種花襆被冬深裁異錦篝燈夜永障輕紗纎蕤露沁蜂腰蠟密蕊雲蒸鶴頂砂為問閬風何處在相期髙舉籋晨霞紀夢海上垂綸有幾年平居何事夢朝天蒼龍觀闕東風裏黄道星辰北斗邊治世秖今逢五百前程如此隔三千揚雄解奏甘泉賦應有聲名達帝前次韻陳子仁黄河二首禹功疏鑿過憂勤海内山川自此分元氣渾淪通地脉孤光追逓貫天文母金伏礫秋逾盛隂火藏淵夜不焚多少魚龍爭變化總歸西北㑹風雲又隂陽為殄黄河溢北度艱難擁萬艘齊楚百城防雉堞淮沂千里避鴻濤耕鋤已失天時正流徙爭依地勢髙此日朝廷憂水患須明利害䇿賢豪遊水樂洞分韻得人字常聞勝地宅仙人如此淵泉必有神子晉重來𤣥鶴舞琴髙初化赤魚馴巖排利劍鈎鐔古水象鳴球節奏均更有山僧能解語自今休厭往來頻望海海門東望浩漫漫風颶無時縱惡湍黑霧漲天隂氣盛滄波銜日曉光寒豈無方士求靈藥亦有幽人把釣竿摇蕩星槎如可馭别離塵土亦何難送羅雲叔歸山中黄石山原風物幽賤子往年曾一遊舊行􅞢柘已成逕新藝禾麻應滿疇馮衍能忘白首嘆謝安須為蒼生憂餘杭溪上明日發愁殺楊花吹客舟送段時敏之京懷山挾海奠京師氣埶紆餘盡北陲鴈度塞雲秋色逺鵲鳴宮樹曉光遲四方英俊皆來萃一代經綸屬有為君有長才希屈賈好將詞賦重當時留别京師囊衣託載道傍車人事匆匆歳欲徂風雨四更雞亂叫關河千里鴈相呼蕪菁散漫根猶美桑柘蕭條葉漸枯卻向髙丘重囘首五雲繚繞帝王都柬淛東萬户蕭伯善擇帥中軍自古難獨分符節守藩翰夜鳴鼓角溪山静曉竪旌旗雨雪乾不待掃門知魏勃豈須彈鋏識馮驩祇令四海無征戰萬巻詩書好厭觀送勾曲外史張君歸華陽送君髙舉入華陽古洞深蟠石路荒蔽日旌幢朝旋旋飛空環佩夜琅琅飡霞已試登仙訣祀竈還修却老方見説陶公雖隠遁猶將道德佐齊梁送户部康里尚書二首經濟才髙負重名早趨蘭省執權衡唐除宰相同三品漢拜司農列九卿禮樂正圖興美化錐刀先務已苛征公家事業齊周召重使斯民望太平又屢挾囊書上國遊途窮獨擁弊貂裘驟蒙陸贄知韓愈直待常何薦馬周北上塵埃憐寂寞南遊歳月苦淹留鯫生資歴猶卑淺可使徘徊製錦不贈同院諸公詔編國史有程期正是諸郎儤直時虎士守門宮杳杳雞人傳箭漏遲遲窓間夜雨銷銀燭城上春雲壓彩旗才大各稱天下選書成當繼古人為玉堂夜直直廬歳晏動羇情朔雪將飛覺夜明金井轆轤哀響絶玉階瓴甓斷紋生蘚花莫辨沿墻迹松葉時聞委砌聲愧以不才同制作諸公此日負髙名惠山泉此泉甘洌冠吳中舉世咸稱煮茗功路掛山腰開鹿苑池攢石骨閟龍宮聲摇夜雨聞幽谷彩發朝霞眩太空萬古長流那有盡探源疑與海相通寄維揚賈侯經國長才世豈多羣邪嫉正奈公何氣蒸雲霧藏喬嶽聲轉滄溟放大河逺跡江湖猶棄絶驚心歳月屢消磨鵾鵬自有垂天翼肯逐飛鴻入網羅寄康大夫二首往年持節使山南及此人情上下諳髙士變心慚隠逸小胥縮手戒貪婪猿聲散漫浮青嶂鴈影䙰褷曳碧潭遥想政成多暇日幨帷出郭有誰㕘又遥想幨帷出郭時先駈十里走旌旗青山落日蒼茫暗白水秋風慘淡悲勁矢每隨前隊發清笳偏逐後行吹荆州未覺風流逺縱飲還應到習池寄康里公二首廟堂為政已優游第秉純誠贊大猷五緯連珠環北極萬方同軌㑹中州衣冠肅肅趨金殿鐘鼓遲遲報玉樓治世賢才今盛集願陳旱麓頌宗周又歎息流年逐逝波功名到手莫蹉跎髙才自昔遭逢少公論於今責望多梁棟器充能負荷鹽梅味合要調和共誰魯國勲庸盛青史何年可滅磨寄康大夫官居烏府號清嚴察吏由來首六廉舊直螭頭司紀載新加豸角備觀瞻䝉恩聖主寧求進具禮名流每執謙欲論六朝興廢事籃輿應度蔣山尖送伯長扈駕二首䍑畢前驅盛國容黄麾仙仗衛重重星流曠野飛蒼鶻日麗層霄馭赤龍耀武邊陲須北狩合袪天地待東封論才孰可銘休烈扈聖還宜祀岱宗又追從羣彦客金門獨用才髙被國恩石室紬書裁帝紀玉堂草詔代王言宦途赫赫名方振餘子紛紛氣可吞㑹合適逢千載運奮飛寧羨北溟鯤寄袁伯長幾年簪筆侍明光直取才華補衛郎祀事悉稽周典禮頌聲須假漢文章雲垂迴野鳴鞘逺月滿髙城下漏長校獵合袪尤盛事願聞作賦擬長楊東湖四景為大尹本齋王侯賦四首朝來千騎出城闉為向東湖踏早春素練幕林雲氣薄明珠穿草露華新山花獻笑開簷畔海鳥忘機戲水濵記取當年賢太守及時為樂與斯民又夏月湖中爽氣多南風疉疉捲長波漁人舟楫衝蘋藻遊女衣裳􅒆芰荷膾切銀絲嘗美味腔傳金縷換新歌史君用意仍深逺即此光華豈滅磨又蹔停麾蓋擁輕舟此日湖山屬暮秋采采黃花登几案離離紅樹散汀洲傾壺浮蟻杯頻竭下箸鮮鱗網乍收莫向錢唐誇往事白蘇未許擅風流又雲氣低藏十萬家東湖飛雪又交加玉禾舊布仙山種瓊樹新開帝所花别浦移舟聞過鴈髙樓凭檻見歸鴉侯門似有相如客賸賦篇章與世誇虞待制魏録事述懷有作次韻奉和二首二公皆故相之後二首勢等衡廬各柱天家傳性理竝鈎𤣥諫垣劘切章連上文館招延席屢前羊豕尚修松下祭麒麟肯信草間眠岷峨舊日求遺族萬里須乘逆水船又理氣兼明善論天秪應為易又為𤣥玩辭已􅆻忘言表説卦仍觀未畫前對案窮年無近效閉門長夏且髙眠却忘京國多竒士欲向長河共買船即事禁城曉色清如水髙下樓􅄗錦繡中千樹好花連上苑百壺美酒出深宫珍禽競集髙林霧寳馬爭嘶横岸風人物此時俱盛極兩都絶勝漢西東次韻伯長待制揮鞭逺過御溝斜出院時時見暮鴉已入玉堂同視草還趨瓊砌共觀花獸爐香繞窓前霧蠟炬光摇帳底霞此去天津元不隔何須八月泛靈槎送薛𤣥卿歸龍虎山金門詔下羽人歸欲向山中採蕨薇琥珀懸崖松樹老琅玕倚澗竹根稀髙巖蓄雨星辰濕古石懸雲逕路㣲養性可無軒冕累遊塵元不涴仙衣送虞貞白之辰陽君以調官來上國藹然聲譽動儒林出門遇雨泥塗滑歸路逢霜嵗月深楚國千年歌白雪揚州三品貢黄金高才不仕朝廷上有詔應煩使者尋春雨濛濛春雨暗重城莽若山林雲氣生駕過東朝霑羽蓋仗移前殿濕霓旌蒼松密掩巖頭鶴翠柳深藏谷口鶯明日不愁花爛漫新晴陌上有人行徐獨清挽詩大道無名識者稀獨于元始探精微秦關忽報青牛度􅈙海寧聞白鶴歸經秘玉函旋地軸書懸金榜闢天扉門人攟拾編遺事第録先生杜德機寄武當山人張真人山走西南氣勢尊天神遺迹至今存氷横磵下千年凍雲起巖前萬里昏既有嚴威彰赫赫詎無厚福䕶元元真人制行通天地日日飛仙降殿門題火涉不花同知畫像堂堂玉立照青春昭代由來重世臣帶納掖庭聨衛士分符江徼總編民鷫鸘裘暖鳴鞭疾翡翠簾深翦燭頻州縣三年姑少試驅馳休厭屬車塵次韻田師孟西曹即事隠吏重來右掖初清明時節亂花舒霧承黄閣霏霏重雨散彤庭㸃㸃疎李耳舊藏周典禮蕭何元得漢圖書經邦事業須公等要使皇文日粲如次韻黄子久獄中見贈解組歸來學種園栖遲聊復守衡門徒憐郿塢開金穴欲效寒溪注石尊世故無涯方擾擾人生如夢竟昏昏何時再會吳江上共泛扁舟醉瓦盆鷗波亭阻雨坐聽髙樹響颼颼風雨相兼卒未休氣雜昏明侵晝景色交黄赤變河流潜移窟宅蛟龍怒固守林樊觀鶴愁水潦此時傷稼穡天人何事計仇讐懷錢唐故人柬應中父幾年流滯客京師每憶江邊話别離落魄已甘心似鐵蹉跎無奈鬂成絲草𤣥思苦無人問彈鋏歌長只自悲滿目塞雲飛去盡倚笻獨立更多時寄吏部張尚書復喜清朝用大賢玉音俄對廣庭宣姚崇已託君臣􅆻李泌終操將相權此日經綸須展布他時簡冊要流傳淵明有待公田米可念江湖久棄捐題謝疉山遺墨二首荆南失守見亡形太歳徒聞忌丙丁羸老扣心天藐藐鬼神號哭夜冥冥忠臣效死招烏合烈婦捐生報雉經辭氣凛然遺墨在再三尋繹淚雙零又故宫愁見黍離離大厦元非一木支義士忠臣徒走死寡妻弱子謾傷悲五經文字寧虚設一代人才頗中衰慷慨殺身猶易事似公方可正民彛題本齋王公畫像二首天姿英粹異庸常早籋雲霄被寵光劍㦸森嚴開武庫珪璋特達薦明堂願承簪履趨門下竊候旌麾拜道傍邪正此時真雜糅秦􅄗懸鏡亦煌煌又詩禮傳家德望隆一門三世拜三公五營帶甲軍容盛九府流泉國賦充房魏素懷尊主術龔黄先奏養民功欲將惠澤量深淺楚浸洋洋與海通寄題成都萬竹軒為李仲淵作君家種竹蜀江傍髙與蠶崖勢頡頏已樹旌旗分部曲更鳴琴瑟應宫商蛟龍併逐波濤化虎豹曾因霧雨藏兄弟至今俱宦達未應開逕接求羊送范德機往歳從君直禁林相於道義最情深有愁併許詩頻和已醉寧辭酒屢斟漏下秋宵何杳杳窓開晴晝自隂隂當時話别雖匆遽秖使離憂攪客心送鄭子謙倅蘭溪二首主人情重賦驪駒户外羣騶有所須將喜在塲登薺麥毋忘入澤取萑蒲風乾鳥雀當櫩噪日下牛羊隔隴呼昭代擇賢先治理服勤簡牘是良圖又青絲絡馬去翩翩正是春風二月天樂作前行尤蔚壯書隨後乘併稠填徴符此日須官次射䇿他時對御筵玉府編摩求大手知君元有筆如椽贈彭萬里素居鄉䣊繫瞻聽逺涉京都迓寵靈掛席波濤秋淼淼據鞍星宿曉熒熒肯如蛟劍終藏匣誰信牛刀始發硎將相與人􅌞勢分秖應雙眼為君青七月十九日大明殿早朝王氣浮空御殿開金衣照日近臣來絲囊已進千秋録黼座還稱萬夀盃王子吹笙雙鳳下羲娥攬轡六龍囘衢樽此日霑恩賜散作祥風遍九垓酬賈郎中挺生雄俊氣昂昂服事朝家被寵光鸚鵡盃中春正好鳳凰池上日偏長新裁樂府傳宮體舊著朝衣帶御香忠孝兩全人所羨只今慈母在髙堂雷江阻風寄池陽通守周南翁繫舟江岸隠蒲蘆坐聽篙師制疾徐巨浪駕空龍出沒猛風吹樹鳥讙呼詩題短札難頻寄酒滿長缾已屢沽輦道沙乾宜竝馬問君何日宦京都送王仲儀歸婺源學道山中歳月長中年已見髮蒼蒼為延􅆪笏開松逕困蓄詩書蓋草堂季子不期爭富貴公孫莫厭舉賢良告歸苦值兼旬雨幾度黄流撼石梁體覆木綿價過樂平境中偶賦蒼山百里路盤盤遙望連峰劍㦸攢斷岸囘風纒古木髙崖飛雨雜奔湍石田磽确收成薄巖屋﨑嶇結構難度地何如江以北提封百萬有餘寛㸃義倉即事南來受命佐為州喜遇豐年暫出遊過嶺﨑嶇尋道路上山磽确治田疇脩藤掛樹龍蛇走恠石攢溪雁鶩浮賦役已寛詞訴簡素飡無補謾優悠題楊指揮樂善堂樂善名堂事可誇兩全忠孝故侯家弦匏入廟思無忝分胄升壇聽不譁窻下唱雞書未卷門前立馬皷猶撾後人自爾蒙遺德流漲春江詎有涯次韻張秋泉真人碧桃道院桃開一樹春往來勾引看花人揮毫欲賦巫山女振佩疑逢洛浦神翠萼臨風摇不定珠蕤承露綴如新煌煌更結千年實凡木何由竊比倫再次韻一枝如玉照芳春幾度凭闌欲殢人翠被夜寒愁灑淚珠簾月冷怕傷神劉郎陌上裁仍舊王母池邊賞又新不是梨花飄雪樹望中清絶更無倫江上合流渾渾古則然中有物恠藏深淵鮫人賣鮹出水底龍女結佩遊堤邊芙蓉覆波顔色好薜荔絡石根株懸此行欲遂極幽險所聞廬阜多神仙過安慶城下呈李惟肅判官山川未到已知名前代英雄幾戰爭水受委輸開巨浸地乘走集建孤城島夷筐篚來修貢楚俗魚鹽樂治生四海晏然當此日斯民何幸際承平寓長春道院春雨即事呈鄭尊師二首南榮相距數尋間滿地春泥隔往還夜雨暗添籬脚水曉雲濃揜樹頭山修篁夾徑宜增植細草侵堦莫謾刪世慮紛然無止極敢求大藥駐衰顔又客遊無賴阻重隂院落蕭條徑術深數畆林塘觀不厭一窓風雨坐相侵靈蚪尚有蟠泥跡老驥寧無越塊心多謝西家賢太守相招樂飲費千金題沈君湖山春曉圖詩巻迤􅆔沙堤接畫橋東風楊柳暗長條鶯隨玉笛聲偏巧馬受金羈氣益驕舞榭歌􅄗臨道路佛宮仙館入雲霄西湖春色年年好底事詩翁歎寂寥柬程處士故人不見十年餘鴻雁南來得素書茶吐槍旗迷澗谷竹供編簡塞庭除詎容煉藥燒金鼎有待横經校石渠江上繫舟將發去黄山囘首重躊躇贈合部遇宗師逺俗超然百慮忘蒲團孤坐日偏長髙城静數蓮花漏密室頻燒柏子香古地神通周世外諸天雄猛侍階旁雜華義諦無窮盡願見菩提發寳光楊仲𢎞集卷六
