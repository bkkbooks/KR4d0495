body:
  text: 楊仲宏集别集類四元提要臣等謹案楊仲宏集八巻元楊載撰載字仲宏浦城人後徙杭州初以布衣薦授翰林國史院編修官調海船萬户府照磨㑹仁宗復行科舉之制遂登延祐二年進士授饒州路同知浮梁州事終于寧國路總管府推官事蹟具元史儒學傳焦竑國史經籍志載楊載仲宏集四巻此本八巻不知何人所分元代詩人世推虞楊范掲史稱其文章一以氣為主而于詩尤有法度自其詩出一洗宋季之陋云云葢宋代詩派凡數變西崑傷于雕琢一變而為元祐之朴雅元祐傷于平易一變而為江西之生新南渡以後江西宗派盛極而衰江湖諸人欲變之而力不勝于是仄徑旁行相率而為瑣屑寒陋宋詩于是掃地矣載生于詩道弊壊之後窮極而變乃復其始風規雅贍雍雍有元祐之遺音史之所稱固非溢美故清思不及范梈秀韻不及掲傒斯權竒飛動尤不及虞集而四家並稱終無怍色葢以此也都穆南濠詩話曰楊孟載詩律精􅋀其追和李義山無題五首詞意兼到真義山之勍敵瞿宗吉歸田詩話曰楊仲宏以宗陽宮翫月詩得名然他作如風雨五更雞亂呌江湖千里雁相呼挾書萬里朝明主仗劍三年别故鄊忩間夜雨銷銀燭城上春雪壓綵旗空桑説法黄龍聽貝葉繙經白馬䭾沉雄典實先叔祖每稱之長篇如古墻行梅梁歌亦皆為時所稱夫人瞿氏余祖姑也嘗以仲宏親筆草稿數紙授予字畫端謹而前後㸃竄㡬盡盖不苟作如是則載于是事亦以苦吟得之者矣陶宗儀輟耕錄曰虞伯生先生楊仲宏先生同在京日楊先生每言伯生不能作詩虞先生載酒請問作詩之法楊先生酒既酣盡為傾倒虞先生遂超悟其理云云竟謂載詩在虞集上則非其實也乾隆四十二年五月恭校上總纂官臣紀昀臣陸錫熊臣孫士毅總校官臣陸費墀楊仲𢎞集原序大德間余始得浦城楊君仲𢎞詩讀之恨不識其為人及至京師與余定交商論雅道則未嘗不與挺掌而說也皇慶初仲𢎞與余同為史官會時有纂述事每同舍下直已而猶相與囘翔畱署或至見月月盡繼燭相語刻苦澹泊寒暑不易者唯余一二人耳故其後余以御史府用筦南憲架閣適海上仲𢎞復登乙卯進士第為浮梁别駕余遷江西仲𢎞亦改宣城理官相違十數年相距數千里迹雖如是而心固猶數晨夕也而仲𢎞竟未任宣城以卒烏乎慟哉余嘗觀於風騷以降漢魏下至六朝弊矣唐初陳子昻輩乘一時元氣之會卓然起而振之開元大厯之音由是丕變至晚宋又極矣今天下同文而治平盛大之音稱者絶少於斯際也方有望於仲𢎞也天又不年假之豈非命耶葢仲𢎞之天禀曠達氣象宏朗開口論議直視千古每大衆廣席占紙命辭敖睨横放盡意所止衆方拘拘已獨坦坦衆方紆餘已獨馳駿馬之長坂而無畱行故當時好之者雖多而知之者絶少要一代之傑作也仲𢎞有子尚幼其殘藁流落未有能為輯次者友人杜君伯原自武夷命僕曰將就其平生所得詩刻諸山中此誠知仲𢎞者而杜君猥謂罄仲𢎞海内之交相好又莫余若也俾為序之用掇其梗槩著于篇端致和元年六月一日臨江范梈序欽定四庫全書楊仲𢎞集巻一元楊載撰雪軒北風海上來大雪何壯哉上下九萬里洗淨無纎埃君家十二樓軒窗洞然開吹笙擊鳴鼓呼賔與銜盃名言落四座大笑聲如雷舉頭望長空高興驚冥鴻仙人五六輩飛下白雲中粲粲明珠袍相從萬玉童問君何所事未就丹鼎功翩然却攜手共入蓬萊宮次方韶父遊九鎖山韻平生一枝笻畏踏市朝路出門見青山如鶻追狡兔兹晨正炎暑赤日那肯􅇀振衣得泠風超若忘世故冥冥九鎖雲未睹心已慕想當挾良朋盡取竒絶處曠哉天壤間寓物豈為痼歸來思舊丘我服寧改素無官正爾佳有子亦堪據誰歟事虚名白首不知誤桶底圖巨鼇奮其首戴山出海中神人擇所處共搆金銀宮凭髙開户牖屈曲互相通女仙七十二顔色如花紅一一執樂器奏曲殊未終世傳桃源圖共徴彭澤翁此本出異士雕刻尤精工天地極廣大為地當不同我願學仙道積久乃有功鍊形去滓穢五色浮虚空一朝乘風去浩然入無窮次景逺學士立春日韻四首大雪入歳􅇀其兆為有年漉漉始彌旬父老怨苦寒平旦上馬去重裘忽如單況彼牛衣子束緼嘘㣲􅈣賴有固窮節猶念及古先又古來有道士聲利不置懷顧於草木微而愛松若梅兹辰閲庭户適逢數花開芳意未渠央是足銜吾盃又人事重名實趨向盡百端丈夫負雄氣動欲追古賢於意少不惬自放江海邊登髙望八極雲氣生我前萬事何足問所湏惟酒錢又﨑嶇既山曲迢遞亦水濵既見蓬葦士輒復忘為勤得之眉睫間我遇固㠯神所善但樓護豈暇從若人送淳安徐敎諭之任握手出南城眷眷從此辭蒼茫寒江色日莫浮雲滋大舟挾雙艫輕若四馬馳淳安衆才彦竝遲得師資擊鼓會高堂帷帳春風吹執經列座下質問無留疑平生五車書少出胸中竒歘然聽佳譽庶用懌我思贈季尊師季君神人也㝠晦居山中還丹九轉成顔色如兒童致虚感元氣語黙與天通頻歳傷水旱下民食不充曰雨須有雨曰風必有風上帝聞其賢行世多隂功䇿名紫虚府進位稱仙公騎龍上天去此樂無終窮太古雪為楊友宜賦往時天大風能吹華山裂墜此一卷石或云太古雪粤自開闢初雲氣所凝結已經六萬歳變化同嶻嶪望之色正白表裏共澄澈塵土不能涴光采燿日月願君勿愛此持以獻金闕囘中避暑時持用消毒熱胡氏刺虎圖宛有烈婦人胡姓嫁劉氏從夫棗陽戍車宿水之澨夜半猛虎至銜夫入菑翳夫人自驚起不暇生為計直前執虎足盡力與牽制呼兒抽佩刀刃剚虎立斃夫命復不救復讐古所貴嗚呼流俗弊人義日以廢婦不失其夫臣子競為利患難圖苟免聞此得無媿吾故作此詩于以告萬世溪山積雪圖大雪歸溪山長林晝冥窅橋跨絶岸逺望行客少買魚酤新酒獨酌竟昬曉似此非他人高士戴安道偕虞伯生魏雄卿魏池燕集分韻得閣字侯家有貴客置酒燕池閣溽暑方盛極風雨俄大作栘楊相簸蕩蒲荷紛偃薄亂呌失蛙黽囘翔迷觀鶴街流汙穢盡竇湧波濤惡喧聲劇降殺神氣欣洗濯趣歡争酬酢獻笑雜歌咢益弛劔佩嚴未厭觥籌錯調燮維理得㵕漉宜施博和澤布原野溼烟散城郭嘉蔬已蒨蒨良苗常濯濯吾徒家食餘豫有豐稔樂題温日觀墨葡萄日觀作葡萄電掃無踪跡誰於故紙上㸃綴辨墨筆西天十萬里來往僅瞬息敗固不小遺下履一隻題金壇宋氏自怡軒白雲生何許萌芽自山石厥初僅毫末湏臾大充斥蔓延塞虚空日月為昬匿或時為霖雨庶類蒙潤澤或隨飄風散起滅竟無迹相縁千萬變發色黑青赤畸人飭棟宇逺俗喜幽閴開軒納高曠撫翫自怡懌人情慕富貴驅逐不暫息轉盼失故常在已何所得上下數千載往事猶厯厯於焉服聖訓無用苦沉溺昔年陶隠居常作帝王客挂冠神武門作詩寫胸臆超然處物外可謂貞且白何以企若人鞠躬修道德磵松為丁師善作磵松髙百尺磊落多大節連根抱危石古色黑如鐵隆冬方沍寒山中積霜雪蘿蔦悉枯老蒼崖猶凍裂此時唯老榦峭直不摧折國匠求美材瞻望歎竒絶險阻不可致既作復中輟我願驅六丁操斧隳嵑􅙙得此棟梁材持以獻天闕劉將軍詩交趾小蠻夷去國將萬里土産無異物其人狀如鬼溼熱生瘴氣疾者無不死天兵雖南征棄之良有以往年鄂州省綏靖失其理交馳赤白囊來告犯邊鄙遣人覘虚實在廷孰可使矯矯劉將軍一旦備行李有才兼文武不但善弧矢深入險惡地限敵纔一水介者數百人視之若螻蟻移文至其國詰問事終始指摘中利害文辭更深美報書禮甚恭敝邑何敢爾彊吏爭怨隙搆煽乃為此賄賂却勿受足以振綱紀威聲聞逺方一邊禍為弭國家方全盛武備不可弛如此將帥才宜歌宿衛士古木詩大木生何許乃在泰山隈泰山崖石裂怒木響如雷浸潤長膏液根株日以培縱厯千百載霜雪不能摧長安天子詔欲築九層臺臺上搆宮殿青雲共徘徊匠氏走海内博求棟梁材萬夫治道路揮斧重林開大器當大用小器易剪裁有如豪侈士蹤跡困塵埃適可厚自養毋為興歎哀東山詩為葉子實賦東山髙幾許上有浮空雲葉君居其間好道夙所聞窮年絶人事矻坐攷遺文松關晝常揜石田朝自芸葆真去汨昬養息襲氤氲軒冕有遺䇿髙舉謝世紛悠悠阻林莽長與麋鹿羣繇來巢許臣不事堯舜君題恒齋精金有恒質入火受百鍊君子有恒性寧逐外物變既不慕富貴又不厭貧賤素履往無咎夷險隨所踐張侯老世故此義頗深見勉之復勉之繼之在無倦次仲實見寄韻平居憶故舊懷抱輒不佳興來望浮雲悵恨獨舉盃竒文孰能賞髙言孰能偕兹辰辱使至喜有意問來諷誦劇傾倒百過巻且開得知賢者心出處與作排山嶽縱可移厥髙固崔嵬敝廬邇喧市卑溼苦病骸常念川路脩杖屨安得陪撫事意疎散毋論與俗乖猶恐戰不勝常處澗谷隈斯言弗果踐臨風重徘徊題文丞相書梅堂大厦就傾覆難以一木支惟公抱忠義挺然出天姿死既得所處自顧乃不疑惻愴大江南名與日月垂我行見遺墨再拜墮涕洟名堂有深意亦唯歳寒枝可知平昔心慷慨非一時峩峩著棟宇昭昭示民知勿使風雨敗永慰千古思塞上曲沙塞何窅窅樹短百草長大河屈曲流不復辨四方驅車日將夕黑雲隠長岡人馬俱飢疲解鞍飲寒塘張坐逐平地擊火燒烏羊桐酪過醇酎摇艷盈盃觴既醉謌嗚嗚頓蹋如驚狂月從天外來耿耿流素光悲風動寥廓拂面吹胡霜白鴈中夜飛參差自成行一箭落霜羽挾弓負豪彊中情無留滯千載能鷹揚邑中南峰陳翁義莊骨肉分枝葉由來同一身榮枯不相待此富或彼貧君子尚周急況復在親親昧兹損益理有靦獨何人南峰自善士義勇超常倫燋心視末俗變化何由淳孰利佳田園壑舟固有神割之惠宗族為世成吾仁仰止文正公遺法實所循垂名倘不朽當與斯人均偶題叢生園中草蔚蔚媚幽姿乘時各敷榮皓色被緑枝似有微香發秋風輒吹之入人襟袖中亦復可憐兹詰朝步荒畦莖葉稍離披飄零即已矣霜露不爾私榮悴既有時小大何異而幸愛七尺軀天道不可誣夢讀退之詩頗竒詭已覺記其大㫖作此篇自聞蓬萊山大林夾長巒上生癭藤蘿下生荆榛菅仰不見天日藏蓄霧雨寒仙聖常所處沮洳亦少乾雖云誇鳳凰出入傷羽翰哀音起空洞令人鼻準酸我欲訴上帝為施鐵鑿鑽琢落石側裂化為千丈磐瓊樓與玉殿玲瓏相通寛日月交户牖光射青琅玕而我從吾師來遊樂且般呼吸養元氣華腴生肺肝萬劫永不死如循環無端竊為仙聖慮炳然心若丹上帝如許我致此亦何難雪後次鄭集之韻雪後登髙望江山信竒哉重岡起且伏相連白皚皚水官方謝事雲氣霅然開六龍翻滄海赤日從中來萬物將蠢動忽如登春􅄗木行味正酸含荾先屬梅天時亦相應初昬占斗魁遨遊自兹始入林踐蒼苔西湖青濎濙西山髙崔嵬長松更千載老枝多折摧名僧剏精舍静謐依巖隈伊予實放士正可誅蒿萊情深惟痛飲毋吝發新醅家人欲求我但見白雲堆機心無自作可使絶嫌猜君辭如泉酒我醉如山頽卜居同里巷時時得追陪為瓶或先罄此恥當及罍大雅歌治世其音不宜哀有倡必有和愧我非長才美哉春雪篇雲漢共昭囘次劉師魯韻三年客塞上日夜懷舊丘飢來迫我去何暇為逺謀四顧無一親此身如羈囚悲風動沙漠囘首令人愁道路已漫漫歳月復悠悠丈夫四方志至此何所求買船發河上河水亦南流攜鉏理荒圃吾疾日已瘳飛雁至江滸北風天始涼是時禾黍登斯人亦少康皇天降厚德胡為私一方燕趙及齊魯人飢或相􅆷奈何有積廩如陵復如岡生非肉食者此憂心甚長亟謀樹皋壤剪茅覆小堂我志亦易豐歳祀有特羊夏夜偕田郎中宿張子元家田君有詩用韻長日氣甚昏欲睡不可忍薄􅇀更飲酒趣取太白引坐久輒醒然累語加況矧髙情逸世表遂使名迹泯彼人較是非達者但微哂交遊半天下公輩獨英敏橘中篇竝海無山林莽莽皆平疇君家擇地利即此營菟裘襍樹作藩屏青紅間綢繆其中植橘柚擁蔽枝葉稠盛夏開白華朱實懸髙秋飛霜虐萬物寒風助颼飀凌晨察變候䇿杖巡維陬是何黄金多暴露宜藏收採摘資衆力轉輸及佗州不長傅貸殖謂此同列侯上充國家賦下貽筐筥謀千縑可坐致何必龍陽洲次袁伯長韻盤盤海底石竝樹青琅玕至陽生至隂龍宮常苦寒揚光炫朝彩吐氣烝微瀾根株歴千載莫測勞悴端端如巢居子草木皮衣冠超然去人羣取友蹄與翰日誦黄帝言浩歎淚闌干奈何天下治必以雲為官佩劒黄金環咀丹白玉盤自聞至人德積熱生肺肝黄塵日􅇀起對面不相看三山在何處使我師王韓􅊃歌紫芝曲倚君清夜彈題屏風畫商山四老人飛雪灑遥野衝波蕩無垠蟠蟠山谷間居此四老人下為民庶師上作王家賔清風𦕈何許馳想寂寞濵李御史之陜秦中古帝都遺俗五方并君為監御史出治周百城上當采民風下當宣德明赫赫英威振奸惡皆振驚弭節事觀覽慷慨有髙情宅土稱上腴后稷此躬耕秔稌既充實烝民日已生我行由天下留滯客燕京岋然岐山嶺嘗致鳳凰鳴騑􅆖不可追矯首望去旌贈詩􅊃自寫寸心西向傾遣興偶作春蔬茂前畦蒨蒨有顔色珍禽呌深樹過耳亦一適用是易吾慮毋為自襞積放浪天地間無今亦無昔古人得意處相與元不隔如何故人心未炤我胸臆徴言極纎芥實出左右力豈憚決係蹯人生且為客書懷寄杜原父二首吾生何為者穉年志頗髙神仙與功名壯思躍秋濤中宵豈無寐悲甚幾欲號後來失所養百數患難逃竭力奉甘㫖出入身甚勞舊書益遺忘九牛存一毛稍後與人事忍情如忍刀旦夕自惟念未足非兒曹常欲力道德屢失迷所撡區區習蠧簡對案夜焚膏倘然有所得中心樂陶陶忽如從古人握手共遊遨攜持亦何事庶用娛蓬蒿追思作詠歌示之必賢豪丈夫生世間毋論賤與貧夙發多意氣往往惟任真松柏生髙岡挺然固出羣不為霜雪阨不為風雨春得時可行道節義亦足伸吾生托下土所識凡幾人窮交獨相慰笑語亦復親又遥望山下雲旦起迷羣岫老鶴巢其中縹緲摽未搆長鳴對秋月鳴罷復俛味散入墟落間聞者莫能究顧惟雲外客娛心飲醇酎於此何如哉吾亦有所遘往來常泛舟泝流浙江上是時秋風髙濤水日夕壯瞬息踰百里猛捷莫可狀倚船縱觀久力可騎􅚪況顧謂吾友言為樂頗豪放斟酌尊中酒懷抱益虚曠常從山中遊實愛巖谷幽長松䕃泉水四時清如秋佇立輒良久忽欲忘其儔吾聞古來人山居多名流此語或可信市朝安得留黄天祥衍三天數求詩嘗論術數書其變難盡紀為之非賢聖亦多有妙理造端無大異據六甲五子分門復析類包括備終始黄生衍三天有名聞逺邇蔓延善推測布算加積累吾行徧天下所見亦多矣如生豈易得詣實不虚美往來江海上宿留隨所止省識凡幾人孰為豪傑士歳月瞥眼過春花既紛萎蕭條臥旅邸風雨響窗紙勸生遊京師北走五千里貴人多問命禍福常自擬兢兢恐跕墜有甚履淵水為言徴無咎抵掌必歡喜徴名何足取奮步從此起題史仲憲重修三皇廟史君宰宜黄政績頗殊異廉不至苟取明不可壅蔽有詔行括田使者自臨視限期已促迫責在州縣吏乘時自掊尅上下受其弊君不憚勞苦日夜親算計頃畆無增損成書極根柢隣壤大盜起相約不犯界三皇大聖人典祀承國制捐金修廟學首政繫瞻視事事有條理後來藐難繼集賢秉直筆稱述傳後世當令處風憲擇才頗詳諦一朝任擊搏風采必嚴厲英主方在上明見萬里外鄙詩或流聞亦可當獻替贈無極進上人進公宗門秀髙標如長松霜雪亦摧折夭矯化為龍燕坐大道塲五戒為垣墉魔賊悉散走不復事戰攻禪居閟青峭窗户加雲封長日語聲絶風動櫩牙鐘贈執中允上人南山多白雲澶漫塞崖谷中有龎良叟寂寞卧林屋前門樹髙松後户植幽竹孤風相纒繞波濤驚蕩沃梵文五千巻誦説盡精熟時時發清唱鏗鏘擊金玉伊余走海内一見輒嘆服願言從之遊淡泊心自足靈龜篇為陳渭叟作馬尊師所画芝龜也蒼龜生中山深阻絶中道不飲亦不食靈和中自抱嫗休凝神液巖上産芝草支干集五采相射顔色好彼遊江海上作計苦不早一罹豫且罔性命莫能保歸遺宋元君天意資探討築宮修祠祭相承以為寳神者固如斯遺骨易枯槁古聞蒙莊氏苦語欲相曉持為衛生經千載長不老楊仲𢎞集巻一欽定四庫全書楊仲𢎞集巻二元楊載撰送凌吉叟大江風雨暗此日送行舟會合能無間攜離秖自愁棄繻才足恃題柱志初酬請看秋鴻舉冥冥獨未休又末俗唯無侶吾儒氣亦卑相從謀飲食那復敬師資衆已欺王式吾猶信不疑可憐如鷃雀擾擾在藩籬初陽􅄗望月彩雲相冪歴華露共嬋娟在水渾疑墮當空孰使懸潛虬精魄動宿鶴羽毛鮮寂寂丹􅄗夜相從訝得仙次韶卿壬寅元日又三日聞遊人頗盛之作韻堂堂宵雨過栗栗曉寒仍獻歳人同得東郊事復興杜門疑我拙有句愛君能且驗臨堦草從今日漸增寄劉師魯好在劉公子遨遊興若何江湖勞悵望歳月劇奔波迹寄天涯逺詩傳海内多前賢題詠處一一為經過又想君遊宦處正值洞庭湖落日波濤壯晴天島嶼孤舟航通漢沔風物覽衡巫天下文章敝非君孰起予龍井元造生羣物唯龍德最靈作霖蘇亢旱取水竭滄溟變化無留迹蜿蜒善養形壯哉吾羨汝一躍上青冥贈吾子行春雨連城濶春雲暎户多長衢方淖濘小水亦風波慎獨能如此思君可若何便當乘興去著屣一相過東陽十題焦桐只作全生計唯存半死心芻蕘猶不置斤斧重相尋遂使煁焦釜誰為愛古琴有材不足恃愁絶念知音蠧簡往古韋編在何年始汗青蠧蟲深卜宅科斗少成形泯滅阽秦火搜羅出漢廷斯文天未䘮不敢望全經破硯彼美端溪石家藏歳月多廉隅皆破缺筋力盡研磨玉亦堅而已星如粲者何向來曾自詭持用掇髙科殘畫斷裂無邊幅華堂棄置餘蒼松深踞地白鶴上凌虚風格猶森若丹青總翳如苦心絶人事誰見用功初舊劒匣裏雌雄劔通神世所聞潛精依厚地吐氣切髙雲亦有蛟龍害寧無星斗文不逢雷煥識埋沒復何云塵鏡收藏無寳匣歎息網絲懸孰使明為暗如觀醜勝妍玉􅄗終寂寂金鵲尚翩翩政訝開元日虚將盛事傳廢檠二尺書檠在如今久棄捐魚膏雖有熖蠧簡獨無縁墻下偕遺礫窗間帶舊烟却觀提挈處辛苦悔當年敗裘寂寞牛衣子能無敝緼袍塵埃須浣濯蟣蝨費爬搔意味存雞肋寒凉視馬毛千金既鎖鑠猶聽朔風號斷碑摩挲不成讀上有蘚斑斑字畫鍾王輩文章漢魏間龜趺凋贔屭螭首落孱顔渤海神明逺今同磑石頑卧鐘漢殿經焚後㗁然卧草中雕殘牙板廢鏽澁土花蒙追蠡難陳力華鯨不奏功待賢初設簴想見古人風送屠存博君往金陵郡於予亦有聞海環平野盡山出大江分未召元司馬誰憐鄭廣文自今師道立章薦必紛紛又江左知名士唯君德最淳明經初試吏食禄可榮親矯矯能違世棲棲直為貧朝廷求俊乂未易捨斯人渡江寄俞仲連舟濟大江濆中流日欲曛鹵翻沙際雪潮落渡頭雲鯨躍常知候鴻飛不亂羣頗思論勝槩把酒莫如君奉題伯父雙峰樵隠山出雙峰秀溪流一𣲖清土風存禮讓人事省將迎路逐髙低過田隨早晚耕家林有如此南望每關情又童稚離桑梓猶能憶故山雲峰乘白腳蘚石露蒼顔揷架詩書富應門禮義閒緑林遺我恨囘首淚闌珊又石樹盤根瘦沙溪激浪清竹間㸔犢卧木末見人行穡事常分力樵歌輒和聲從來攜杖處不礙白雲生又山曲兩三家相過路不賒對門開竹逕臨水種梅花酒熟留人醉詩成任客誇時時談舊事相看鬢垂華又草滿三春緑山留萬古青呼兒欣解意應俗憚勞形採菌敲寒木收魚炤夜汀秖應老崖谷束帶尚論經贈方韶父處士蜀郡蘇明允襄陽孟浩然成名兼二子得句詫羣賢口絶人間事身如物外仙卓然能有此未信獨無傳又古賢皆眇邈不意見斯人得趣時時好吟詩句句新挐舟來訪友覽勝輒經旬别業稠山下歸歟願比隣和孟東野題崑山寺蘭若負崑岡鑿崖安佛牀梯雲石磴滑入厨泉水香旦寒鳥相聚月黑龍放光舟行苦局促幸憩殊勝場送方韶父先輩遊五湖蕭蕭垂素髮渺渺汎滄波過眼江山好離家日月多詩名終不朽世事復如何一往五湖上蒼茫問釣簑和張仲實之吳興舟行雜詠水程通百里雲樹隔千層鶴髮歡相見龍門羨獨登文辭無乃壯桮杓尚能勝仰止情何極吾為附􅂹蠅又風流須我輩邂逅及斯時道術懷經濟文章出笑嘻由來天下士絶異里中兒它日金閨彦娟娟想翠眉楊仲𢎞集巻二欽定四庫全書楊仲𢎞集卷三元楊載撰寄題羅氏别業二首溪行如百里為地已幽深石轉黄金塢山抽碧玉簪盃觴酬日月弦誦起雲林樂事無終極誰能得此心又門前臨白逕長日少人行野樹重重暗溪流脉脉清山光元不斷雲氣自相縈已似龎公隠何時重入城江行次韻六首潮頭終歳白沙腹有時皤利涉他州柂終更古戍戈天依臨海樹風作滿江波亦有投竿意還聽孺子歌又舊事如遺迹新愁轉泥人晴天宜縱步凍草各含春野鵲飛林杪沙鷗過水濵江山故如此晚望及斯辰又藜羮真我食薜荔亦吾衣養性隨時足今生徇物非秋蓬猶未定風樹莫相違謾作烟霞想曾無羽翼飛又春花􅊃共采若木有誰編浩蕩寧無取紛華幸見憐緒風吹四裔清露洗重𤣥萬物皆生意蹉跎畏此年又路僻行來好天清望極遐白魚翻急浪黄犢卧晴沙柳吐千條葉梅殘幾樹花佳辰從此數歴歴看韶華又子胥因諫戮兹事幾經秋顧爾忠難揜于今憤不休天風吹地轉海水入江流欲問䲭夷處茫然使我愁酬子行初秋風颶之作􅇀夜風濤變崩騰怒不休魚龍皆失穴江海欲同流竝岸漂千舍連檣覆萬艘隂陽知有沴惻愴動深憂送孫大方歸朝元宮三首髙卧林泉表超然謝世紛空山鳴白雨古石繫蒼雲不作䕫龍伍甘從鹿豕羣都門遊宦客囘首總慙君又飛搆上凌空依稀想故宮金盤凝曉露玉佩振秋風溟滓那違俗支離更養蒙大還何日就變化入無窮又為樓因地勢四面盡青山路落秋城外河流曉樹間雁飛雲莫莫龍現雨珊珊建木光華盛何時共折攀挽饒國吳文康公詩二首厚德修天爵崇資拜地官粲然周典禮偉甚漢衣冠共喜懸金印俄聞葢玉棺史臣書寵數光照碧巑岏又道學繇賢子推恩自聖皇白茅分壤土華衮賜衣裳漫注長生録虚傳郤老方神遊終不返瀛海路茫茫題張氏順堂百順名為福紛然會此堂詩書成藴藉黍稷發馨香夜户鳴琴瑟春筵酌酒漿子孫宜孟晉相繼謁明光題信州先天觀圖四首囘環因地勢制作本人謀蔽日來龍駕凌空結蜃樓秋琴翻浩蕩夜罄答深幽願受長生訣他年幸一遊又髙林褰翠氣虚谷散虹光道士多騎虎仙人自牧羊澗泉通地逺山嶺際天長戴子文為記流傳示不忘又四圍山不斷狀若碧芙蓉谷逺含風細崖深下露濃茂林藏虎豹隠洞伏蛟龍恍惚神人降浮空羽葢重又鬼神相與處燒藥易成功雲霧生牀下雷霆起室中養身唯淡泊遊世等虚空髙舉寧無日飄然獨馭風次引浚儀公題蘭竹卷子韻樹蕙連叢竹秖應族類同相依巖石畔併入画圖中勁葉凝清露危梢倚碧空諒非髙世士此意固難通贈程景純二首南遊觀楚越北度覽幽燕羇旅新愁換英豪往事傳塵沙迷逺驛風雨暗長川好醉新豐酒清朝正選賢又論士無他術先觀氣盛衰澗松多勁節瓊樹有髙枝圖籍曾無覽弓旌詎久遺似君宜努力慎莫負明時思菴閔氏青山下遺封見若堂蓼莪恩未泯拱木恨難忘德業銘金石詩書塞棟梁子孫修學術奕世有輝光赤壁圖寂寂長江夜同人共泛舟清尊方淡蕩孤棹且夷猶望逺幽禽度歌長獨蠒抽千年遺跡在不逐水東流贈昌上人二首山中明月小壠上白雲多旦食飡松柏秋衣攬薜蘿俗人希見問禪老每相過異日髙僧傳垂名定不磨又未生天地始此理固存存直木何由曲清源不可渾養生毋過厚守道在彌敦超出塵埃網蘄師共與論送葉彦中之官行􅄗二首范滂將攬轡周景已題輿九扈名兼美三鱣兆豈虚都門愁撡袂江徼喜沿書重有斑衣奉南州總不如又大府徴才士知君學業優兩京勞侍從十載困淹留白雪歌難和青雲志易酬鍾山多勝槩有意與同游送胡秀才歸新安二首明詔方求士知君有俊才未聞遺杞梓何事返蒿萊似驥寜淹足為龍豈暴腮文章成錦繡他日必重來又彼美逢衣子遨遊至上京雲霄方有志塵土已知名塞雁驚新恨溪鷗憶舊盟秋風吹易水惆悵復南征惠崇古木寒鴉江上秋雲薄寒鴉散亂飛未鳴常競噪向晚復爭歸似怯霜威重仍嫌樹影稀老僧修止觀寫物固精㣲留别陳益謙大帆仍馺娑雙棹復夷猶曉岸烟沙濶春江霧雨稠桃花隨漲水荇菜逐長流遲子來京國何時賦壯遊遊陳氏園偕李治中張提舉曉日從千騎郊原樂事多溪山春與麗烟靄晝相和宿蠧藏編冊鳴騶隔薜蘿使君辭滿引起舞亦傞傞挽艾處士二首才行能䨥美終身作布衣江湖名自逺塵土迹還稀野菊秋霜薄岩松夕照微沙鷗盟未改忽忽下漁磯又撰文來相府書字出詞垣盛事傳千載幽光發九原父賢宜竝著子孝復堪論多少衣冠族無聞愧後昆顧氏義塾居鄉為義塾兹事罕前聞外户來衿佩中堂蓄典墳儒宗先麗澤聖德尚彌文吳下多豪族能賢總羨君挽吳道士曾為方外士抗迹出塵氛既草歸田賦仍書誓墓文卧牛空有兆紀鶴竟無聞春草年年合誰憐道士墳送林季羽入京宿衛三首青雲自致身磊落見斯人巻衮辭蒼麓垂纓侍紫宸漏􅋊珠閤曉香暖玉爐春倘厭承明事歸來衣錦新又終軍方近幸賈誼最能文獨用竒才進應將美譽聞金鞍光照地寶劔氣凌雲來往燕􅄗下同游必羨君又衛郎皆世胄之子更才賢意氣雲霄上榮光日月邊都俞聞寳訓出入奉瓊筵立志當𢎞毅功名不偶然送徐義父入京二首舊富三冬學今為萬里遊風雲丹鳳闕雨雪黑貂裘南土名先著東堂選必優相逢多意氣談笑接名流又幽燕向日邊裘馬去翩翩磧逈沙如雪河窮浪入天上書雙闕下待詔五門前壯節當竒遇無煩媿往賢贈曇上人二首多生為佛子慧達自童蒙蟬脱凡塵外龍騰覺海中一真元不染四大本來空異日叢林下知師繼杲公又人世百年内都如過隙塵不開心上眼苦愛夢中身城市無閑日江山又晚春相逢言道好獨覺意相親贈胡汲古二首先生唯達道久矣樂山林致聘無雙璧為生過十金身閑雲出岫髮短雪盈簪遁世猶吾志同盟欲自今又野客何蕭散長年暫出遊風塵唯短褐江海自扁舟有迹能來往無心任去留才名今藉甚屈指到枚鄒送胡汲古之吳中有客佩蒼精居然得此生山開棲越跡水泝入吳程佚老悠悠計傷離戀戀情食菲方未已應不為魚羮中秋攬雲憑結搆步月上林皋不記金尊竭頻瞻玉宇髙神清存夜氣天濶數秋毫百尺樓如在何煩卧汝曹挽曹光益二首斯人吾所愛不見已經年頗怪魚書絶俄聞鵩賦傳歸魂迷道路遺骨滯山川逺業凋零盡臨風為悵然又好學無如子冥冥獨苦心未成梁棟用誰使雪霜侵宿草孤春意游雲泊太隂憶渠情不已揮淚在衣襟贈劉時中二首騷雅誰能繼居然屬大才銳思羅宇宙逸興走風雷處勝輕流俗名髙震外􅄗東郊乘大路翼翼待龍媒又吳越千餘里君來按轡遊羣公虞罪戾多士想風流決事曾無壅觀民輒有憂若人何可得離别重添愁送王元禮歸平城二首燕趙多竒士遺風有固然射鵰猶絶藝屠狗亦名賢形勢威天下風流號北邊送君歸此地亦欲奮吾鞭又牧羊憐馬援投筆困班生侯印終兼綰窮愁實飽更大才當用世小挫亦知名快飲桑乾酒能澆氣不平贈張之翰二首外􅄗收掾屬奮步集亨衢落落蟠英氣飄飄發壯圖威風聞郡邑行李涉江湖竝轡逢佳友周游興不孤又長才當用世進取或􅌞途剸劇曾揮刃銷奸若燎枯交游冠葢盛出入禮儀都有賴寛衰俗餘波及腐儒送陳君佐入京二首子欲遊京國程途萬里遥束裝辭邑社振斾躐風飈學問先餘子飛騰在一朝太平知有䇿必顯聖明朝又董子知天道朱雲善易經由來登俊乂所以重朝廷彼有譏儒服吾無鼓説鈴君看鴻鵠舉忽忽至青冥宿延祥觀有感二首處世如庸俗胡為淹此留蹉跎悲往日磊落愧前修願棄人間事來為物外遊大還如可就猶足訪丹丘又瓊館遊仙子超然逺世情言辭多近道豪翰久知名露下衣裳溼風來几案清似君居處勝亦足寄吾生題青田葉叔至野清堂二首為堂殊顯敞在野興尤濃白水流千折青山繞百重樹麻行斾斾蒔木倚童童相對漁樵話終朝亦罕逢又逺來山異甚龍虎互騫騰溪狹灘聲悍林繁雨氣增正須求靜坐何事角多能謁告還鄉里君堂或可升送張宣撫使嶺南二首奉使入蠻烟終軍始妙年抗旌辭朔野擊檝渡湘川翠竹侵巖際黄茆盡海邊狼荒非善地為戒莫留連又此行行萬里𣺌𣺌極朱涯地勢雖懸隔天威可逺加引弓飛惡鳥拔劔斬妖蛇遲子歸來日燕南看雪花送李侍郎使安南九秋天色晚萬里送君行馬首塞雲起腰間寳劔横奉揚天子命慰答逺人情直渡蠻江水炎氛一日清喜雪酬康子淵院使漠漠連天暗霏霏著地輕欲迷鳷鵲觀先入鳳凰城凍影篩簾宻寒光射隙明詰朝宜表賀來歳卜收成送吳清叔驛路程雖逺帆風勢甚遒青山隨岸去白水滿江流牢落添新恨繁華憶舊遊只今歸去好把釣即槎頭贈鄭尊師茫茫雲著地摵摵雨交天篁竹連河上青茅盡海邊棲遲聊應化放曠且談𤣥相對蒲團坐清風為肅然黄櫟杖為龔聖與作嗟哉黄櫟杖吾賴汝扶持未免道途苦無如筋力衰散才唯不用大節固多竒老向江湖上提攜得自隨次夏仲勉韻二首門前無繫馬屋外有鳴螿迫迮衣冠府蕭條翰墨場雨淫憂地溼風暴喜天涼推轂無時已令人憶鄭莊又不喜為文富長憂得酒慳尊罍堆案上筆硯棄墻間有傳追王績無書繼賈山貴人能慢士往見亦胡顔冬至次張宣撫韻二首北去關河逺南歸歳月長屠龍雖有技相馬獨無方雲水連天暗霜蕪滿地荒客遊應未巳塵土在衣裳又瀛海無消息冥冥鳥道長已驚雙鬢短更待兩瞳方落日依平嶂洪河入大荒憂來那可得揮淚欲沾裳送吳清叔歸婺客遊春向莫無日不思歸雨給桑麻秀山深笋蕨肥薄醪能屢醉舊社足相依莫道天邊雁衝衝適禍機與方韶卿望月月明胡乃爾秋盛故能然匣鏡無纎翳槃珠有許圜寒光摇碧海爽氣挾青天幸遇山頭鶴令人夜不眠孝思亭詩為王心田作山嶠靄蒼蒼盤旋衛古藏盎温通地氣赫奕閟天光神化侔飛劔前聞驗若堂子孫修祭祀歳久不能忘浄香亭二首藝竹蒼空古為亭白日幽一麾方出守千户益封侯外物從渠屏清樽喜客留楣間標勝語朗詠亦風流又翼翼四簷外蕭蕭三逕中珠璣穿夜雨幢纛舞天風擁神生清氣開軒近碧空古人雖不見佳興詎無同酬吾子行耿耿思朋舊悠悠涉歳華既依秦大姓方問魯東家雅道將誰與新詩敢自誇祇今能會合不憚路途賖偶作碧草含秋意黄雲起􅇀容歸鴉昬且噪去雁有無踪盃酒因循醉朋人邂逅逢身名猶碌碌正坐日疎慵送劉明卿歸安東同郡居相逺逢君豈偶然秋天聨席宴寒夜共衾眠不為時名役猶嗟俗事牽語離還悵怏後會是何年和張仲實舟行雜詠莫作匆匆去相隨稍稍觀逺山多意態急水易波瀾把酒悠然樂扁舟得爾難五湖天下景六月氣常寒題秋江釣月詩卷泛跡秋江上而今不計年垂綸牽細浪欹帽破長烟已類𤣥真子兼疑孟浩然後來名未泯題品有髙賢楊仲𢎞集巻三欽定四庫全書楊仲𢎞集卷四元楊載撰壽姚承㫖上帝黄金闕仙人白玉堂皇猷資黼黻大筆主文章間氣生竒偉休期際吉康四朝承寵渥多士仰輝光盡發琅函祕重繙石室藏成書侔二典有道述三皇碩望髙天下榮光近日傍謀謨須稷契羽翼藉園黄上殿扶鳩杖開筵接蟻觴九重師道德千載合明良共説綸如綍能催繡作裳人思興禮樂國待理隂陽舊族名先著髙門慶甚長賜書踰萬卷納笏過三牀轉覺勛庸盛還欣體力强朱顔朝映日素髮曉欺霜已注長生籙曾傳却老方宜齊周李耳逺邁漢張蒼松栢深逾秀芝蘭久益芳願公多壽祉仍見子孫昌贈周景逺學士朔易囘元氣人才起俊流聲華當翰苑文采冠中州振佩趨􅄗閣抽毫侍冕旒人傳鸚鵡賦家有鷫鸘裘式覩黌宮立共惟祀典修一朝虞或缺六器俾傍求俎豆俄成列蘋蘩遂可羞中朝方有道下士實同休已及歸鴻候姑為食蟹謀朋簪多繾綣使節少淹留曉日花間酒春風桺下舟篇章㣲品藻山水媿清幽鄭璞曽先隋珠不暗投考槃雖自引闚觀亦吾憂簡冊銷長日蓬蒿憚凛秋論髙非縱誕興逺託賡酬尚憶駒千里胡能貉一丘何當把君袂相逐馭風遊壽杜尊師淡蕩風雲氣沈雄虎豹姿繇來天下士絶異里中兒苦縣常栽李商山舊采芝不當卿相位猶可帝王師始有巾車獲俄蒙仄席知賢才方竝用讒説遽相欺豸角將巍冠龍鱗敢逆批變通俱合道舒巻各乘時築室煙霞祕還丹日月遲願公長住世須作後天期次韻曹士開毗陵喜雨下土方淫澇髙田獨旱乾木形憂隕命藿肉愧為官索寞雲容合蕭條夜色闌精誠天已感祠禱力初殫逈野霑新潤曾檐下急湍槁苗還薿薿大豆且團團達宦俱相似疲民乞少安佳章宜刻石留示後人看春雪次陳元之韻寒氣何悽􅃤春空正杳冥東皇收槖籥北帝駕軨軿混沌包三極繽紛走百靈散殊分的皪擊玉碎瓏玲始試朝藏日俄疑晝隕星危橋無客渡曠野少人經百沸疑奔瀨孤撑沒峻岭林荒顛凍雀崖滑墮哀㹶衮衮隨風舞颼颼襍雨零遺蹤初得兔匿種詎憂螟眄睞傾農室歌謡徹帝庭陽春將布德品類各成形捉筆題新句持盃酌舊醽今朝須痛飲醉卧不須醒送張仲實之宜興南渡邦初造西山將獨賢立功何赫赫流慶尚綿綿報國橫戈數登壇授鉞專風雲方際會江海固周旋控險千鈞弩臨危七寶鞭忠誠深足仗智勇實兼全自返髙橋役端持宥府權兵威終抗敵人力可囘天甲第無踰者諸孫固頴然初生同燕頷有美自嬋娟善學聞當代能詩起妙年衛公猶故物鄭老竟寒氊矯矯青雲器泠泠白雪弦同遊雖未達自睍已無前政事兼留意時髦孰比肩知機無轉石縱辨若奔川特達羣公薦酸寒衆目憐姑為文學掾會覓孝廉船必見公侯復無論雨露偏秋風鵬鶚健萬里正翩翩送丘子正之海鹽州敎授有美區中彦由來志不羣舟航了吳越裘馬向燕雲才思庾開府風流王右軍得時宜玉筍稽古賸香芸果拔英毛頴遄收翰墨勛諸公希宦達半世有辛勤奔走空皮骨躋攀不寸分夏侯何地芥郢匠實風斤嗟我慚鴟鷺棲山似鹿麕偶來詢故老因得友多聞湖舫曾秋雨河橋幾夕曛過從方不散慘别亦奚云俎豆班侯泮鹽絺薄海濆未論虞廪米聊樂魯宮芹此日顔應抗之人德已薰化爐新鼓樂學殖重耝耘行矣穿黄落歸歟守白紛贈言將底事努力在斯文贈班彦功名書稱晉代盛事起江東内翰鍾竒氣深情縱古風摳衣皆弟子入室自豪雄欲立千金價寧論百日功奏名黄閣老承詔大明宮遺敎規王氏隂符易褚公杯沾銀鑿落佩簉玉玲瓏文學談經早聲華脱頴同麥光人共賞棘刺巧無窮願積臨池趣流傳史冊中士開燕岳氏溪堂有溪山新月上江海故人同之句邀予及張仲實曹克明同足成之置酒秋風裏凭闌野色中溪山新月上江海故人同縱浪情何極留連燕未終三鱣來上客五馬會羣公積水輸清氣微霞衒近空將昬林尚白及早稻先紅極論追遐古深情念困窮尚觀儀秩秩未遂樂融融才著當朝傑文誇命世雄數君今日選宜爾集南宫次韻黄子久喜晴三十韻呈汪知府霞彩晨張錦蟾光夕挂鈎隂霾雖盡解淫潦豈全收寖動遨遊興還聞倡和謳容容追舊賞厯厯破新愁騎氣城邊縱龍光海際浮艷粧來士女盛服擬王侯在藻羣魚躍依林白鳥啾河流交不斷山勢轉相繆物理歸含毓人情釋怨尤娭娛從老稚燕樂逐朋儔幄帟分郊次幨帷擁道周聨翩馳画舫嶻嶪累朱樓貿易通遐壤繁華壓大州聚廬千井富接棟萬家稠已戒增周口仍催㳏下流嘉蔬連隙地宿麥徧髙丘曹事虞多廢胥徒戢過求醲恩方竝育和氣與同遊期會朝先往追隨暮不休露華開的的風葉振颼颼拾芥非無日登禾即有秋朝家期少試隣郡固難侔共美光華著還矜德業修在廷争進薦當宁免垂憂玉漏傳金角金尊出殿頭秉心存正道造膝待嘉謀履直恒如矢防偏或類舟第誇繙竹簡不省計牙籌善對慙鳴鶴能歌愧飲牛過情蒙許與彌月為淹留再用韻贈黄子久自惟明似鏡何用曲如鈎未獲唐臣薦徒遭漢吏收悠然安性命復此縱歌謳石父能無辱虞卿即有愁歸田終寂寂行世且浮浮不假儕羣彦真堪客五侯髙人求替洽末俗避喧啾藜杖常他適繩樞每自繆與人殊用舍在已寡愆尤濟濟違班列倀倀逺匹儔能詩齊杜甫分道偪莊周達飲千鍾酒髙登百尺樓艱危仍蜀道留滯復荆州鶴度烟霄濶龍吟霧雨稠東行觀海島西逝涉江流自擬需于血何期渙有丘古書嘗厯覽大藥豈難求撫事吟梁父馳田賦逺遊堂名希莫莫亭扁效休休檻日迎東濟窗風背北颼鳴琴消永晝吹律效清秋雅俗居然别仙凡逈不侔多聞踰束晳善對邁楊修進有匡時略寧無切已憂塵埃深滅跡霜雪暗盈頭始見神龜夢終營狡兔謀雪埋東郭履月滿太湖舟急景誰推轂流年孰唱籌凌波乘赤鯉望氣候青牛好結飛霞佩胡為淹此留寄王繼學二十韻聖主敷皇極元臣建上台虚心求俊乂削迹去奸囘拜命超凡品知君秉大材淳風隨日播公道應時開負鼎資烹飪撡刀貴剸裁銛鋒行肯綮異味合鹽梅廟議常參決朝班復共陪艱難須佽助豁達逺嫌猜遺佚聞風起英豪接踵來經綸非董賈辭藻亦鄒枚在野思羅致盈庭想轂推既將龍作友惡假鴆為媒走也今留此公乎可念哉執竿猶海上扶耒即巖隈自守幽人意寧虞俗子咍舊遊辭玉府故事憶金􅄗落魄江湖阻蒼茫歳月催丹心徒耿介素髮已毰毸勿謂交如水能㤀恥及罍飛黄當駕馭猶足異駑駘送完者都同知來游天子學藉甚有聲華論事依三䇿藏書至五車姓名題雁塔譜牒記龍沙自可編青竹兼宜綰白麻文工金有價貌美玉無瑕興盡方豪飲篇終不浪誇豈惟吟芍藥曾是賦蒹葭事莫分難易人須辨正邪月中初折桂天上始乘槎勿待秋風起宫門聽鼓撾贈郭集賢衣冠趨近地藻翰集羣賢給事黄門裏抽毫黼座前佩龜金作紐賜馬玉為鞭御酒傾壺滿宮花揷帽偏清光依日月逸思繞風烟記憶踰三篋吟哦過百篇自惟叨侍從不敢廢周旋秋著隨車獵寒當襮被眠蘇環才既敏陸贄寵尤專自爾紆皇眷於焉理化弦詞臣方進用才大畢騰騫可念如揚子蕭蕭獨草𤣥悠然閣髙閣凭虚起登臨興甚長江流春𣺌𣺌樹色曉蒼蒼原隰魚鱗布峰巒鳥翼張雲來兼北極雨過及南荒地大遺民富時清致理康南山常在望懷古意難忘寄周御史二十韻同游河北後共抵浙西初獨倚知心舊翻成會面疎三年仍契濶萬里更吹嘘小子無竒氣先生有過譽見稱司馬賦求授夏侯書倉卒排歸計淹留著寓居已非興俊逸猶異主癰疽名士多親我諸公或請予駕言將采芑即事欲連茹顧爾傷流矢居然恨倚閭驚心聞杜宇過眼易蟾蜍忽召抽金匱俄徴論石渠文章殊賈馬謀略匪嚴徐薄技終難效窮愁只自如尚矜存弊履不肯曳長裾與作棲梁燕寧為呼轍魚儀形長日想懷抱幾時攄奏疏聞當宁抽毫待直爐烏􅄗弦既改鼇禁席仍虚馬首何繇見分光興有餘送董與可為句容縣主簿主簿非髙士通才或暫為催科虞慘急勾校慮稽遲慎察文無害詳觀獄有疑温純規白璧正直視朱絲要使聲名著何嫌品秩卑烏􅄗懸日月舉辟實無私送朱復之為邵武敎授放浪來京國於今復幾年山川多歴覽日月屢推遷異俗疑烏帽窮途信馬鞭達官空有榻遊士固無氊始聽除書下俄聞抗斾還南州分敎地成法紹前賢趙彦祥母慶八十從親年八十萬里自西來氏族稱三蜀光華照二􅄗柰繁愁夜雨筍長望春雷綺食和金鼎香醪進玉盃鳯毛方煒􅂱鶴髮正毰毸試使蟠桃熟從今更幾囘雲山圖為茅山劉宗師作長江千萬里奔浪薄髙雲龍現誰能覩猿啼不可聞迂迴因地勢昭晰應天文劔氣秋如洗珠光夜欲焚連峰俄筍迸斷岸復𤓰分句曲臨東極巖頭有隠君題康里氏家譜國受輿圖廣家傳譜諜詳馳聲繇雁塞拓跡至狼荒轉戰踰千里來降盡一方奮戈囘白日列㦸耀清霜破竹收城邑分茅賜土疆弟兄皆勁悍父祖各雄彊相印仍兼綰兵符更迭藏排衙開萬弩納笏過三床已及書宗祏還宜紀太常後人能繼紹千載有輝光題王叅政積翁别故人詩巻後聖主膺新命明公遇盛時混同開宇縣困厄守城池寇盜思攘敓黔黎賴寵綏合珪承燕享前席備詢咨築室求梁棟徂堂薦鼎鼒用兵陳廟算養士作邦基已草歸田賦仍題伐木詩此生終契濶吾道豈磷緇矯矯游龍字綿綿吐鳳辭錦囊加什襲細覽想形儀贈魏虚舟少府西蜀文章伯東吳閥閲家族傳貞觀舊躅繼信陵遐雅度人難測髙名衆共誇為楨材不小韞櫝玉無瑕鳴鳳占諧吉乗龍偶契嘉三牀邀納笏萬弩護排衙世賞官仍及朝叅寵復加天顔垂眷顧地肺侈光華緩步方鳴玉髙情欲泛槎翻然歸翠麓姑爾奉黃麻彭澤還栽桺河陽不種花投閒銷日月訪古略烟霞臘蟻常開宴春魚每看义興來恒放逸賔從任喧譁閤静褰珠箔窗虚閟緑紗琴彈多古雅詩就輒妍姱願作梁間燕徒慚井底蛙執鞭曾莫傚抱瑟敢長嗟戀戀情終在悠悠道苦賒春風吹去斾翹首又天涯贈劉平叔郎中肇自三苖氏淫為五虐刑商周終至治禮樂固常經赦過存三宥原情用八聽未能還畫象猶貴去殘形末俗仍澆薄生民曷救寧謂宜沾雨露抑使震雷霆皥皥惟毋擾元元庶有靈林殘求虎豹榖害去蝗螟此意雖忠厚斯言若窅冥君乎吾有望當使在朝廷送丘子正之海鹽珠生滄海底玉韞碧山中夜氣交明月陽精現白虹有賢兼重價當代振英風好學由天性能書至國工知名傳冀北作賦擬河東始欲徴揚子旋聞薦褚公隂符難獨美遺敎實爭雄絶藝雖宜進竒才自不同交游傾上國掄選屬南宮鄧禹官初試匡衡對漫通海邦終寂寞學館尚穹崇已注千人録當成五典功星辰皆在水渤澥信浮空把酒歡何限乘槎興不窮文章趨浩瀚物態入牢籠子必登芸閣吾方守桂叢索居彌寡陋荒業孰磨礱弗獲披雲霧惟思對華嵩知音期郭泰流俗易王充江海從兹逝飄飄任短蓬贈虞彦髙吳越知名士風流得此人結交何待久晤語即相親丹穴生儀鳳滄波豈縱麟飛鳴常見瑞變化不無神家世皆為善文儒謹飭身不將紈袴累自著綵衣新力學追髙古修辭絶等倫汪茫涵巨海要眇動纎塵鐘簴聲音大韺䪫節奏均詎誇傳里巷可使抒絲綸藉藉聞當代駸駸集要津省闈曾奉檄學館已垂紳滋味嘗郊鼎光華薦席珍南宫延國子西掖選詞臣慷慨升車日遲囘執袂辰論心情已至抵掌氣彌振虞詡才方壯湯休學最醇相期終晚歳無取艷芳春抱獨知何向為朋喜有因從君鳴一世流詠被無垠鄭中丞母大夫人壽八十端公居重位壽母在髙堂天意何相厚人倫實有光豸冠方俊偉鶴髮尚康彊内翰為封誥同僚舉慶觴欣欣承玉饌赫赫帯金章獻笑慈親側繩愆聖主傍中天懸日月下土凛風霜可謂全忠孝都縁積義方孟軻難獨美湛氏竟齊芳頌得吾無媿名宜百世揚送朱仲山歳貢入京昭代陶淳化多方出異材鳴岐聞鳳鳥清道服龍媒養素稠山僻觀竒載籍該為珍如寳璧奮蹟起蒿萊未展垂綸趣初承勸駕催羔羊填委巷駟馬踐輕埃戰藝鋒無敵搜賢網正恢上書追偃樂作賦竝鄒枚奮發真從此遊觀亦壯哉雲霄千萬里瞻望重徘徊招真觀圖欲學無為道來居小有天精神消物怪采色變風烟恬澹知天德虚無象帝先髙風何特達古跡尚流傳地涉鴻荒表山開混沌前谷幽疑鬼聚峰巧類人仚疉起三重閣分流百道泉岩穿留虎跡石冷逗蛟涎放浪曾無日遨遊未有年古經披覽罷毛骨為醒然喜晴得揚字呈汪知府霏霏褰宿靄煜煜射初陽出谷鶯聲滑摩空鶴勢張鼓鼙爭奮發帆幔各飛揚不畏塗泥滑寧憂積潦妨農夫分舊種紅女覓柔桑為有豐年慶陳陳滿太倉寄沈少微金華山隠居巖前通細路嶺外接危峰梯磴踰千級烟霞過萬重縁崖收異荈步壑數長松隔屋號朱虎當窓現黑龍蘅蘭爭酷烈桃李角鮮穠隠士多相過仙人庶可逢第能安性命何患改顔容煉鼎丹砂熟傾壺白酒醲微茫追絶響瀟灑振孤踪鄉里宜同好它年必子從挽徐處士此日新安郡名家復數誰危科雖屢掇舊業詎多遺孝友全髙行温恭集令儀花殘青歳晚木落紫山悲結蟻容兼盛銜鱣譽更垂白雲埋骨處揮涕想漣洏送侯尊師歸蜀北上關河逺南歸歳月賒飄飄攜短劒杳杳泛靈槎别岸秋濤掩前山曉霧遮欲攀青桂樹先採白蘋花大道元無極浮生即有涯舉杯吞夜月引袖拂晨霞獨跨沖天鶴能追赴壑蛇秖因投老去長日煉丹砂春晚喜晴積雨俄經月新晴始見春蒼苔侵别墅緑水過比隣性僻居宜逺身閒景易親無詩排世累有酒縱天真循圃花粘履凭闌桺拂巾歌呼從稚子談笑或嘉賔漸喜漁樵狎仍欣鳥雀馴幽情延薄莫浩思集清晨養拙元非病為文敢自珍杜門縁底事作計懶隨人楊仲𢎞集卷四欽定四庫全書楊仲𢎞集卷五元楊載撰次韻虞彦髙遊陽明洞憶昔神禹奠九州兹山會計功始休諸侯玉帛𣺌何許但見萬水從東流衣冠永閉陽明洞夜聞鬼哭巖之幽珠宮貝闕號龍瑞天造地設非人謀槎牙怪樹凍不死化作千丈蒼玉虬丹洞呀然仙掌裂翠峰巧矣蛾眉修梅梁飛去鐡鎖斷往往雷雨生靈湫軒轅緱神極祕怪海上笙鶴時相投平生閉門讀史謳子乃探穴先吾游明當挾子騎汗漫題詩更在最上頭不妨山水樂吾樂豈有飢溺憂民憂故家喬木尚可求有子有孫百世留卧橫玉簫泛歸舟吹散萬斛江南愁送俞用中之蓮城君家文獻猶未泯名載舟車無不之乃翁種德不食報流慶涓涓方在兹皦然玉立七尺軀相非公卿無此竒早孤為學孰勉劭藏書萬卷能盡披季父撫育過已子將為前人䕶址基我兄長公有年歳才氣偉煜通時宜賈誼晁錯奉大對生晚弗及同驅馳君令沿檄治鄉校初官履厯固不卑要為國中養賢俊政無大小視所施括蒼山好著仙籍昔人於此自燕頥榮公相業輩王謝石僧尚有踪跡遺君居三載業可想再見惟有操降旗古墻行建炎白馬南渡時循王以身佩安危疏恩治第壯與衛縮板栽榦繇偏禆下鍤江城但沙鹵往夷赤山取焦土帳前親兵力如虎一日連雲興百堵引錐試之鐡石堅長城在此勢屹然上功幕府分金錢讙聲如雷動地傳爾來瞬息逾百年髙崖為谷驚推遷華堂寂寞散文礎喬木􅃤淡棲寒烟我入荒園訪遺古所見惟存丈尋許廢壞終嗟麋鹿游飄零不記商羊舞王孫欲言淚如雨為言王孫毋自苦子孫再世隳門户英公尚及觀房杜如君百不一二數人生富貴當自取況有長才文甚武公侯之後必復初好把家聲繼其祖題山石猿鳥圖萬巻堆中昏欲睡忽見畫圖醒我意眼前崖谷起嵯峨便似著身遊此地楩柟櫧櫟大百圍奔泉透石辟歴飛𤣥猿孤峙憩美䕃下視白鳥娛清暉昔聞虞舜狩南嶽君子相隨化猿鶴往時此輩猶爾為慨想雲林真可樂拔劍斫山山骨露山鬼咿嚶安敢怒秖今踊躍歸去來莫愁無覓誅茅處李伯時畫浴馬圖古稱難畫莫如馬近朝唯數李伯時不至天閑觀帝服如此骨相何由知頭類渴烏尖揷耳竟度流沙輕萬里圉人牽浴恒凛然復恐化龍奔入水貧居里卷無馬騎徒步出入多傷悲大脛薄蹄何足願退立道傍塵滿面送時中兄入京先生意氣非常流有如鵰鶚厲九秋讀書不肯守章句經濟可許斯人儔懷抱利器將逺遊直往上國交公侯王侯位髙不下士如以蛟龍視螻蟻為君莫敏光範書以氣撼摇差可耳功名倘來不足為丈夫須作逺大期君不見麒麟閣上圖英俊當時或自閭閻有闕文次韻題慈照寺浪紋石山前流水響急灘崖崿齟齡嶮且艱直上正平稍去水坡陁漫漫龍背起幽阻之間有竒石洶若北風吹海立滄海飛塵事有徴遂使喧豗化㝠寂開闢以來六萬四千歳浩浩洋洋不休息雖有好事者欲為之不似大造無痕迹我行見之頗愕然抽觴戲欲取涓滴僧堂託宿語不眠竟莫禮了生公禪意外竒崛當眼前跋涉無負兩足趼君家住時宅通􅆵何如金堂石室友羣仙㑹見石髓流為泉何事更種東皋田子能食之可長年題王起宗畫松岩圖雲起重岩鬱凌亂長松落落樹直榦若人於此結茅屋爽氣飄然拂霄漢犧舟之子何逍遥從者傴僂攜一瓢山中無日不閒暇跋涉相顧凌風飈始知王宰用意髙使人觀圖鄙吝消世間未必有此景塗抹變幻憑秋毫丹青遊戲故足樂收絶視聽搜冥寞向來為政殊不惡乃爾胸中有丘壑題華岳江城圖華岳能詩世有名學畫丹青亦豪放此圖似寫安慶城雉堞樓􅄗儼相向北風將至江面黑千艘萬艘爭避匿滄溟涌溢水倒流南嶽動摇天柱側蛟龍戲落秋潭底素練平鋪八千里時清好作釣魚翁閑弄輕舟烟霧裏神馬歌次韻陳元之神馬來自崑崙西有足未始行沙泥朝趨欲出飛鳥上夕逝直與奔星齊緑鬃半散揷雙耳赤汗交流攢四蹄風神秀溢陿天地豈顧燕蔡并渠黎時時牽浴臨清溪對人誇殺黄須奚玉沙之禾中芻秣不嚙堤頭枯草稊與君側耳聽長嘶凡馬不聞生駃騠古劍歌為吳真人作閒閒真人藏古劍敬之如神不敢忽賔客時來求一觀輒有悲風起倉卒人言此是金鐵精良工煅煉久始成動摇天地合變化摩蕩日月含光精昔年有蛟起江中口吐烈熖燒長空下民昏溺上帝怒雷電往擊皆無功嘗持此劍斬蛟首流血滔滔浸廬阜傳記傳聞時既久不意世間今尚有吾過下里多惡氛魍魎魑魅能食人請君為我絶此怪一洗宇宙長清新梅梁歌酬鄭集之大禹之功及天地廟有梅梁何足異奈何過用鐵索纒太祝為之欲徼利每言變化失其所去作老龍治風雨一聲霹􅋬震岩扉千尺蜿蜒辭殿户七月槁苖沾塊土憂殺村中老農父買羊沽酒祭梅梁祭罷祠官傳好語吁嗟老農無爾愚大禹有神焉可誣汝曹淫祀欲求福此物為妖當伏誅題趙千里山水扇面歌公子丹青藝絶倫喜畫江山上紈扇秖今好事購千金四幅相連成一卷春流漠漠如江湖飛烟著樹相有無嵐光注射翻長虚白玉盤侵青珊瑚追隨流俗轉蕭疎對此便欲山林居旗亭花發酒須沽舟行為致雙提壺抱琴之子來相須醉歸不省何人扶旁有飛泉出岩隙掣電飛霜相盪激蛟龍不愛鯢桓食但見垂綸古盤石人生萬事無根柢出處行藏須早計一丘一壑倘如斯便可束書從此逝君不見鄭子真躬耕谷口垂千春毫芒世利能沒身汝胡齷齪為庸人題秋雨長吟圖雨暗秋天黒如墨窮居茅屋出不得終日長吟復短吟吟罷令人轉悽惻飢猿抱樹屈雙肘病鶴拖泥垂兩翼何當䇿杖過溪頭要看南山新翠色竹樹圖荆棘蒙蘢迷竹樹亂堆古石蒼苔䕶縱獵青郊懷舊路躍馬重岡追狡兔箭翎落地無尋處時中兄示余畫一軸畫一老翁推獨輪小車上載兩巨甕意其為警世之為因為賦詩小人無他獨嗜利兩甕載車將逺致肩頳足趼汗澘然冉冉脩程胡不畏世人但笑愚翁愚甕破即與瓦礫俱不知人有千金軀前行險道方乘車楊仲𢎞集巻五欽定四庫全書楊仲𢎞集卷六元楊載撰宗陽宮望月分韻得聲字老君􅄗上涼如水坐看氷輪轉二更大地山河微有影九天風露寂無聲蛟龍竝起承金榜鸞鳳雙飛載玉笙不信弱流三萬里此身今夕到蓬瀛次韻錢唐懷古四首江湖清濁自天開鴻鴈鳬鷖與往來黄道星辰環太乙紫雲宮殿擁蓬萊論文競奏王褒頌獻夀深傾阿母盃九域輿圖今混一百年耆舊獨興哀又斜界鈎陳通大道中分魏闕對層巒雲生殿上金爐暗露下庭前玉井寒江漢飛龍俄窅窅滄溟泛鷁竟漫漫中天會合寧非數坐見蒼生奠枕安又山囘禁禦入雲長無復陳兵衛兩廂千石金鐘埋野草萬年珠樹落秋霜龍文不徙陽人聚鳥篆終降軹道傍九市塵埃來衮衮一江波浪去茫茫又化人宮闕被層阿棟宇髙低若湧波翠石文章書日月寳珠光燄燭山河空桑説法黄龍聽貝葉繙經白馬駝誰謂一無超衆有只今塵土重來過題豐樂樓崢嶸飛構壓名邦西望平湖東望江氣合重𤣥蒙流瀣標存九域奠洪龎朝來散霧縈朱栱夜後流星透碧窓倚徧闌干愁目眩飛鳶旋轉故雙雙水樂洞石林求路轉聱牙來訪香嚴大士家雨過門前生薤葉風行隴上落松花懸崖滴水鳴金磬激磵流泉走玉砂欲適山林去城市久知寂寞勝紛華題拱北樓殷地鼓鼙迎日出倚天梁棟與雲浮北瞻帝闕三千里南控臣藩三百州江海無波沉罔象旌旗垂野駐貔貅鸞迴麗榜多深意繡衮于今有魏牟次韻羅雲叔紅梅玉人中酒殢芳華盡壓東風百種花襆被冬深裁異錦篝燈夜永障輕紗纎蕤露沁蜂腰蠟密蕊雲蒸鶴頂砂為問閬風何處在相期髙舉籋晨霞紀夢海上垂綸有幾年平居何事夢朝天蒼龍觀闕東風裏黄道星辰北斗邊治世秖今逢五百前程如此隔三千揚雄解奏甘泉賦應有聲名達帝前次韻陳子仁黄河二首禹功疏鑿過憂勤海内山川自此分元氣渾淪通地脉孤光追逓貫天文母金伏礫秋逾盛隂火藏淵夜不焚多少魚龍爭變化總歸西北㑹風雲又隂陽為殄黄河溢北度艱難擁萬艘齊楚百城防雉堞淮沂千里避鴻濤耕鋤已失天時正流徙爭依地勢髙此日朝廷憂水患須明利害䇿賢豪遊水樂洞分韻得人字常聞勝地宅仙人如此淵泉必有神子晉重來𤣥鶴舞琴髙初化赤魚馴巖排利劍鈎鐔古水象鳴球節奏均更有山僧能解語自今休厭往來頻望海海門東望浩漫漫風颶無時縱惡湍黑霧漲天隂氣盛滄波銜日曉光寒豈無方士求靈藥亦有幽人把釣竿摇蕩星槎如可馭别離塵土亦何難送羅雲叔歸山中黄石山原風物幽賤子往年曾一遊舊行􅞢柘已成逕新藝禾麻應滿疇馮衍能忘白首嘆謝安須為蒼生憂餘杭溪上明日發愁殺楊花吹客舟送段時敏之京懷山挾海奠京師氣埶紆餘盡北陲鴈度塞雲秋色逺鵲鳴宮樹曉光遲四方英俊皆來萃一代經綸屬有為君有長才希屈賈好將詞賦重當時留别京師囊衣託載道傍車人事匆匆歳欲徂風雨四更雞亂叫關河千里鴈相呼蕪菁散漫根猶美桑柘蕭條葉漸枯卻向髙丘重囘首五雲繚繞帝王都柬淛東萬户蕭伯善擇帥中軍自古難獨分符節守藩翰夜鳴鼓角溪山静曉竪旌旗雨雪乾不待掃門知魏勃豈須彈鋏識馮驩祇令四海無征戰萬巻詩書好厭觀送勾曲外史張君歸華陽送君髙舉入華陽古洞深蟠石路荒蔽日旌幢朝旋旋飛空環佩夜琅琅飡霞已試登仙訣祀竈還修却老方見説陶公雖隠遁猶將道德佐齊梁送户部康里尚書二首經濟才髙負重名早趨蘭省執權衡唐除宰相同三品漢拜司農列九卿禮樂正圖興美化錐刀先務已苛征公家事業齊周召重使斯民望太平又屢挾囊書上國遊途窮獨擁弊貂裘驟蒙陸贄知韓愈直待常何薦馬周北上塵埃憐寂寞南遊歳月苦淹留鯫生資歴猶卑淺可使徘徊製錦不贈同院諸公詔編國史有程期正是諸郎儤直時虎士守門宮杳杳雞人傳箭漏遲遲窓間夜雨銷銀燭城上春雲壓彩旗才大各稱天下選書成當繼古人為玉堂夜直直廬歳晏動羇情朔雪將飛覺夜明金井轆轤哀響絶玉階瓴甓斷紋生蘚花莫辨沿墻迹松葉時聞委砌聲愧以不才同制作諸公此日負髙名惠山泉此泉甘洌冠吳中舉世咸稱煮茗功路掛山腰開鹿苑池攢石骨閟龍宮聲摇夜雨聞幽谷彩發朝霞眩太空萬古長流那有盡探源疑與海相通寄維揚賈侯經國長才世豈多羣邪嫉正奈公何氣蒸雲霧藏喬嶽聲轉滄溟放大河逺跡江湖猶棄絶驚心歳月屢消磨鵾鵬自有垂天翼肯逐飛鴻入網羅寄康大夫二首往年持節使山南及此人情上下諳髙士變心慚隠逸小胥縮手戒貪婪猿聲散漫浮青嶂鴈影䙰褷曳碧潭遥想政成多暇日幨帷出郭有誰㕘又遥想幨帷出郭時先駈十里走旌旗青山落日蒼茫暗白水秋風慘淡悲勁矢每隨前隊發清笳偏逐後行吹荆州未覺風流逺縱飲還應到習池寄康里公二首廟堂為政已優游第秉純誠贊大猷五緯連珠環北極萬方同軌㑹中州衣冠肅肅趨金殿鐘鼓遲遲報玉樓治世賢才今盛集願陳旱麓頌宗周又歎息流年逐逝波功名到手莫蹉跎髙才自昔遭逢少公論於今責望多梁棟器充能負荷鹽梅味合要調和共誰魯國勲庸盛青史何年可滅磨寄康大夫官居烏府號清嚴察吏由來首六廉舊直螭頭司紀載新加豸角備觀瞻䝉恩聖主寧求進具禮名流每執謙欲論六朝興廢事籃輿應度蔣山尖送伯長扈駕二首䍑畢前驅盛國容黄麾仙仗衛重重星流曠野飛蒼鶻日麗層霄馭赤龍耀武邊陲須北狩合袪天地待東封論才孰可銘休烈扈聖還宜祀岱宗又追從羣彦客金門獨用才髙被國恩石室紬書裁帝紀玉堂草詔代王言宦途赫赫名方振餘子紛紛氣可吞㑹合適逢千載運奮飛寧羨北溟鯤寄袁伯長幾年簪筆侍明光直取才華補衛郎祀事悉稽周典禮頌聲須假漢文章雲垂迴野鳴鞘逺月滿髙城下漏長校獵合袪尤盛事願聞作賦擬長楊東湖四景為大尹本齋王侯賦四首朝來千騎出城闉為向東湖踏早春素練幕林雲氣薄明珠穿草露華新山花獻笑開簷畔海鳥忘機戲水濵記取當年賢太守及時為樂與斯民又夏月湖中爽氣多南風疉疉捲長波漁人舟楫衝蘋藻遊女衣裳􅒆芰荷膾切銀絲嘗美味腔傳金縷換新歌史君用意仍深逺即此光華豈滅磨又蹔停麾蓋擁輕舟此日湖山屬暮秋采采黃花登几案離離紅樹散汀洲傾壺浮蟻杯頻竭下箸鮮鱗網乍收莫向錢唐誇往事白蘇未許擅風流又雲氣低藏十萬家東湖飛雪又交加玉禾舊布仙山種瓊樹新開帝所花别浦移舟聞過鴈髙樓凭檻見歸鴉侯門似有相如客賸賦篇章與世誇虞待制魏録事述懷有作次韻奉和二首二公皆故相之後二首勢等衡廬各柱天家傳性理竝鈎𤣥諫垣劘切章連上文館招延席屢前羊豕尚修松下祭麒麟肯信草間眠岷峨舊日求遺族萬里須乘逆水船又理氣兼明善論天秪應為易又為𤣥玩辭已􅆻忘言表説卦仍觀未畫前對案窮年無近效閉門長夏且髙眠却忘京國多竒士欲向長河共買船即事禁城曉色清如水髙下樓􅄗錦繡中千樹好花連上苑百壺美酒出深宫珍禽競集髙林霧寳馬爭嘶横岸風人物此時俱盛極兩都絶勝漢西東次韻伯長待制揮鞭逺過御溝斜出院時時見暮鴉已入玉堂同視草還趨瓊砌共觀花獸爐香繞窓前霧蠟炬光摇帳底霞此