二首具嚴威命領祠官厯祀名山不厭難上帝乘龍遊下土真人騎鶴降虚壇已刋白玉為封檢更鑄黄金作祭冠國壽延洪千萬歳願祈榖熟小民安又子紹重黎有大功父宜封建至三公絲綸詔下皇恩重黼黻衣成古禮崇視草乍聞辭玉府獻桃曾見到珠宮有闕文便與彭籛得壽同題貢氏秀野堂貢氏諸郎皆好學南湖舊有讀書堂波濤已逐鯤鯨化霧雨猶聞虎豹藏隴上麥禾春娓娓谷中杉桂曉蒼蒼君卿雅有當時望八十能來佐漢皇次韻張仲實除日聞鵲奕世侯門能載德微如鳥鵲到今馴雕簷曉日鳴聲好緑樹春風鼓翼頻雲漢有愁天欲近昆岡見抵俗難親主人定有除書至貴爾先知及上春吳山晚眺山椒翬構四垂寛上相旌旗會覽觀傍近江湖天廣大上連星斗地清寒龍宮永鎖函書閟鳳嶺重嗟菀樹殘此際獨無雲蔽日正宜翹首望長安次克明韻贈劉時中循行郡國弗遲遲宣布新條及盛時民俗要令無狗盜人才今喜得牛毉窻間夜雨銷銀燭門外春雲壓彩旗左右湖山都未覺好分餘力治文辭潮潮頭初起壯何如如阜如岡乍有無髙浪駕天龍出沒疾風吹樹鳥讙呼隂陽莫測機相軋朝夕初生信不渝海石向來誇水德已應傾倒盡歸墟次韻袁德平苦雨二月雨霖無乃早園林誰復辨青紅浪花汨汨還登岸雲葉翻翻久亂空水落巖崖通鳥道墅流椔翳塞龍宮只今海上尤空濶願踏浮槎逐釣翁遣興門前髙柳緑紛紛戀靄留烟晝不分雨砌芳菲晴後見風窻言語靜中聞桐花可作鳳凰食竹葉還成虎豹文但使此心無外慕卜居何日絶人羣雪急霰中宵響瓦塍寒光未曉入窻稜横飛朔野威風壯盡壓西山氣槩增蟻酒佐歡唯弟共貂裘縱獵豈吾能如今何處堪游目葛嶺浮圖􅆟一層夏夜對月暑天煩倦唯酣寢薄暮登樓起宿痾簟報新秋凉意早窻開永夜月明多不眠孤鶴頻驚呌好事流螢屢見過安得泛舟江海上坐觀冰鏡落滄波送方仲永為重慶路校官君有英才世罕徒矯然如鶴上天衢長懷道藝干明主却恨衣冠累鉅儒愁裏論心相慰藉醉中發興共歌呼此行萬里官西蜀有問長因竹使符次韻劉時中見寄泥塗霄漢固難謀亦有元龍百尺樓籍籍圖書聊自適茫茫江海與誰遊但聞燕市能求馬肯向秦川輒飯牛富貴不才名盡滅未應摧沮恨淹留遣懷往歳銜杯意氣疎願隨童子誦詩書久荒靖節松三徑獨守揚雄宅一區春圃花殘收夏果海門潮落買江魚如今也足成吾趣何事王門作曳裾楊仲𢎞集卷七欽定四庫全書楊仲𢎞集卷八元楊載撰題髙尚書竹石矯龍疑蒼筠踞虎肖白石倘乘風雲會變化那可測趙浚儀公竹石老竹倚危石比德猶弟兄凌競度霜雪然後大節明王晉卿古木走根坼裂石曲榦漸清漣雷電忌交作化龍起重淵墨蘭謂香辭迫求曰色却媚愛執德非固然何用結為佩墨蕙與蘭大相似多花花蕊蕊在古象何人孤竹君二子題松雪翁墨竹二首蘅蘭倚脩竹寂寞生幽谷比德如夷齊於此受命獨又側石狀竒峭横竹枝扶疎猗蘭復叅立信哉德不孤題墨竹四首為鄭尊師飲霧初泠泠沐雨還斾斾相從采真遊可作晤語對又蔽日訝無影疏風疑有聲移根來室中尚假筆墨精又虚心可遊世直道難事人伯夷聖之清信哉德有隣又風味既澹泊顔色不娬媚孤生崖谷間有此凌雲氣畫竹二首翡翠含春霧琅玕振曉風清聲來枕上秀色入簾中又萌芽成虎豹變節作蛟龍正直唯吾與清修必子從七言絶句客中即事五首漸覺星星兩鬢皤推愁不去奈愁何客中忘却春光度驚見前林嫩竹多又終朝矻矻坐書帷春去春來總不知怪得山禽如有意隔窻撩亂踏花枝又幾日懸懸雨不休客窻孤逈使人愁杜鵑啼切知何處坐對雲山萬木稠又美木千章遶故宮如烟如霧塞虚空路衝南北山岡斷披拂能來萬里風又逺望潮頭出海來直衝西岸復東回鴟夷萬古留深恨如此波濤亦壯哉悼隣妓三首西子湖邊楊柳花隨風飄泊到天涯青春遇著歸來燕銜入當年王謝家又金沙灘上觀音面刦火光中幻化身抱取摩尼却歸去天衣元不汚風塵又一種腰肢分外妍雙眉畫作月娟娟春風吹破襄王夢行雨行雲若箇邊種柳圖連山斷岸古今同彷彿柴桑入望中為問江邊枯柳樹飛花幾度亂春風趙松雪畫蘭竹石石上蘭苕已蔚然竹枝相間復娟娟正如王謝佳公子文采風流竝世傳謾題都門幾度見秋風楓柘連山樹樹紅江海此時囘首望黄花滿地酒樽空贈陳相士二首英豪無處覓知音奔走塵埃嘆陸沈他日預言當富貴相逢何惜贈千金又江湖茫茫眼欲空尋常貴賤相多同低頭强與時人語踪跡徒勞逐轉蓬棘林圖村北村南隔暮雲滿林黄葉亂紛紛楚江回首三千里過鴈如今不可聞沙鴈漠漠寒烟樹影微一行沙鴈背人飛江南江北秋將盡客子如今猶未歸題應中父所藏陳仲美山水小景層巒疉嶂倚晴空松檜相連秀色同下有幽人茆屋在浩歌宜屬紫芝翁扇上竹種竹何須種萬竿一枝分影亦檀欒秋宵更受風披拂聽取清聲入夢寒題髙尚書墨竹尚書善画名天下戲掃修篁筆更竒何異補陀巖石上雪霜摧折有殘枝聽琴圖繇來六律妙難知聖德巍巍亦有師欲向琴中求至理想從虞舜五絃推讀碑圖老瞞自負知無窮文藝兼求事事通獨忌楊矦才勝已陷身令入網羅中水仙花花似金盃薦玉盤炯然光照一庭寒世間復有雲梯子獻與嫦娥月裡看題雪竹圖飽經霜雪性堅强抜起危梢百尺長大節挺然難屈撓渾如宋璟立班行題風竹圖屋後屋前皆種竹中宵無奈朔風號似維舟楫滄江上裂岸崩崖聽怒濤題息齋竹老節嚴嚴若自持翛然分影覆堦墀此君不受纎塵汚更看清朝雨過時雷泉石崖深處有潛龍奮起春雷不見蹤自此白雲山下路流泉一道響淙淙次韻康子山舍人二首兼旬風雨氣寒凉院落幽深草木長却喜今年多夏果碧苞丹實滿林香又欲賞秋花色已凉碧雲散盡楚天長姮娥舊種無多樹何故人間有此香題鍾呂傳道圖濟世曾聞有大才超然脱屣去塵埃劍光昱昱今何在上下乘龍戲九垓到京師城雪初消虀菜生角門深巷少人行柳梢聽得黄鸝語此是春來第一聲送人二首客路逢春雪乍消眼前愁思轉相撩垂楊染作黄金色舞遍東風萬萬條又金溝河上始通流海子橋邊繫客舟却到江南春水漲拍天波浪泛輕鷗畫竹石二首竹前怪石起叅差篁竹叢深使客疑如過瀟湘江上路鷓鴣啼罷日西時又息齋道人能畫竹攬結造化歸毫端偶從紙上得一箇大勝渭川栽萬竿宿浚儀公湖亭四首夜宿湖亭水氣凉四更風露濕衣裳空濛霧重前山暗屋角斜明是月光又兩兩三三白鳥飛背人斜去落漁磯雨餘不遣濃雲散猶向前山擁翠微又幾年鄉夢隔江湖此日登臨興不孤小艇欲行無逺近不愁歸醉要人扶又能文亦有張公子往歳俄加道士衣載酒白雲山下路擬將毫翰與同揮題十二紅卷子碧桃枝上有珍禽調舌交交聽好音畫出江南春意思明年攜酒共追㝷題巨然秋山山色嵯峨樹老蒼筆端描邈辨毫芒從來名下無虚士可與荆關作鴈行題鄭子貞畫像二首外姓爭權國必危若人有道獨前知倘縁辟召登朝著忍見他年漢鼎移又躬耕谷口雜編民寧肯懷金媚賊臣楊子解言如許事不知執㦸是何人次韻陳又新真人北上驛騎翩翩秖蹔歸壽觴捧罷戀慈闈秋風萬里關河道回首那堪翔鴈飛贈髙如山江行矚望多竒絶疊壁重崖翠倚空此日如山相邂逅皓然秋鬢一衰翁題畫兔呈馬伯庸學士姮娥乞與長生藥自可騰空入月中竊食草間多利害飢鷹奮擊待秋風喜晴樓外斜陽放晚晴街衢前後聽歡聲迴舟更倚南風順千里青山照眼明題廣寒龍先生詩卷三首匡廬山下有仙翁夀與乾坤配始終記得霓裳羽衣曲此身曾入廣寒宮又人事休祥靡不知道髙曾作帝王師龍顔大悦承天寵長記麻衣上殿時又古來聞有列仙儒栖宿巖巒道味腴度世直須功行滿乘龍飛去侍清都題倪御史墨帖二首官府移文存大畧僧家常住守清規秖令坐奪齊人食嘆息浮屠亦少衰又唐季朝銜亦漫加長憂群盜亂如麻子孫奕葉猶昌熾知是當年積善家紀夢二首四面青山擁翠微樓􅄗相向闢天扉夜䦨每作遊仙夢月滿瓊田萬鶴飛又紛紛鸞鶴滿虚空耳畔如聞度海風直上雲霄千萬里此身飛入紫微宮題温日觀葡萄二首老禪嗜酒醉不醒强坐虚櫩寫清影興來擲筆意茫然落葉滿庭秋月冷又醉中捉筆兩眼花倚簷架子欹復斜翠藤盤屈那可辨但見滿紙生龍蛇題墨竹二首嶰谷隂寒石如鐵二龍僵立露骨節春雷動地萬物活畏汝飛騰衝石裂又攢青聚緑生巖幽海濤聲引風颼颼年年三伏林下臥白晝憀慄如深秋用韻送德陽入越為贅壻二首從來浪迹信流槎始至山隂便作家不與淮王援桂樹應隨越女採荷花又輕霞薄霧詰朝晴岸柳江梅著樹明更向若耶溪上聽傍人歌唱盡春聲次韻子正雪中雜興四首天宮何事又飛花欲以文章起作家坐想玉堂風味在赤銅官鼎試春茶又舊説曾城玉為樹千樹萬樹遶仙家又須天上春風早想見飄零如此花又姑射仙人玉佩裳周流天地有輝光但令榖熟不疵癘未受人間黍稷香又寂寞寒儒半畆宮堆瓊積玉未為窮向來得此成竒觀一任衡門動健風題子行所藏魚藻圖畫出鯈魚戲緑漪羣分小白更相隨主人真得蒙莊趣視此洋洋樂可知題宣和畫爵二首蕞然徵命出蓬蒿飛躍無踰數仞髙阿閤鳳皇行缺此畫渠能使聖躬勞又一爵翩然飛且鳴翎毛嘴爪若天成遼陽一往無消息猶得人間著畫名次韻雪三首若有神人為㪚花往來揮灑任横斜乘龍忽忽行天上何不斯須過我家又初上衣裾細細花老松俄頃半枝斜髙林窮谷無行徑敗壁頽簷有住家又砑光帽子舞山花吹落曾城萬仞斜安得飈輪為我駕一時飛到列仙家題曾氏墳山詩漫漫平田一望中前山突起勢穹崇千年畱得孤墳在秖為州人敬魯公題三生圖一生曾歴萬生多貴賤賢愚變幾何更向此身存業識茫茫大刦詎消磨雲林雨霽圖為瞿澤民賦麗澤乘時灑八荒歸雲杉抄尚悠揚齊民亦有豐年望豈但陳陳問太倉山谷帖古來君子重親親欣戚相於此意真再拜先賢遺墨在弟兄鬬䦧是何人趙承㫖帖書名世仰浚儀公望重朝廷品秩隆今日後生思倣傚臨池須費十年功陽關圖咸陽西距玉門關萬里征人憚往還此别尊前須盡醉相逢俱是鬢毛斑春山圖春山流水暗涓涓發歛朝雲與暮烟更茸竒峰千萬仞不愁無處學神仙集虛虚室還能致吉祥唯嫌六鑿互相攘百神受命皆來舍豈假乘雲入帝鄉偶題二首巨木埋根數百年蔚然蒼翠上叅天不歸宮闕充梁棟也作龍舟濟大川又海上雲來徧地隂波間漏日瀉黄金水車倦踏傷淫潦無奈連天雨正深画枇杷四月江南盧橘熟離離佳實滿枝黃丹青偶向圖中見漬蜜猶思配一觴偶題藏名匿迹黃塵中日抱書案心㝠濛墻頭花變兩三色又是一年看春風清溪霧擁春郊白晝昏清溪路斷客銷魂更憐把釣衝風雨欲與漁翁共一樽喜晴簷外喧喧雀報晴夕陽猶照小窻明迴舟更倚南風順要聽田家打麥聲題沙總管屏風驚濤奔衝山震動靈液滲灑樹滋長襲肌或怯寒吹揺入耳如聞怒雷響畫馬天家狙狡骨骼竒朝飲暮秣必以時世無造父能駕馭直欲弄影舞瑤池楊仲𢎞集卷八
